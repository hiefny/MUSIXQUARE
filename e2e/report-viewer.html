<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIXQUARE E2E Test Report</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --green: #3fb950;
    --red: #f85149; --yellow: #d29922; --blue: #58a6ff;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    padding: 24px; max-width: 1200px; margin: 0 auto;
  }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header h1 span { color: var(--purple); }
  .status-badge {
    padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .status-badge.running { background: rgba(88,166,255,0.15); color: var(--blue); }
  .status-badge.passed { background: rgba(63,185,80,0.15); color: var(--green); }
  .status-badge.failed { background: rgba(248,81,73,0.15); color: var(--red); }
  .status-badge.waiting { background: rgba(139,148,158,0.15); color: var(--dim); }

  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center;
  }
  .stat .num { font-size: 32px; font-weight: 700; line-height: 1; }
  .stat .label { font-size: 12px; color: var(--dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.total .num { color: var(--text); }
  .stat.pass .num { color: var(--green); }
  .stat.fail .num { color: var(--red); }
  .stat.skip .num { color: var(--yellow); }
  .stat.time .num { color: var(--blue); font-size: 24px; }

  /* Progress */
  .progress-wrap { margin-bottom: 24px; }
  .progress-bar {
    height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-fill { height: 100%; transition: width 0.3s ease; border-radius: 4px; }
  .progress-fill.green { background: var(--green); }
  .progress-fill.red { background: var(--red); }
  .progress-info {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 13px; color: var(--dim);
  }
  .running-test {
    margin-top: 8px; font-size: 13px; color: var(--blue);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .running-test::before { content: '▸ '; }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filter-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--dim); cursor: pointer;
    font-size: 13px; transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--blue); color: var(--text); }
  .filter-btn.active { border-color: var(--blue); color: var(--blue); background: rgba(88,166,255,0.1); }
  .filter-btn .count { margin-left: 4px; opacity: 0.7; }

  /* Test list */
  .test-list { display: flex; flex-direction: column; gap: 4px; }
  .test-item {
    display: grid; grid-template-columns: 28px 1fr auto;
    align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; cursor: pointer;
    transition: border-color 0.2s;
  }
  .test-item:hover { border-color: var(--blue); }
  .test-item.expanded { border-color: var(--blue); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .icon { font-size: 16px; text-align: center; }
  .icon.pass { color: var(--green); }
  .icon.fail { color: var(--red); }
  .icon.skip { color: var(--yellow); }
  .test-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .test-name .file { color: var(--dim); font-size: 12px; margin-left: 8px; }
  .test-time { color: var(--dim); font-size: 12px; white-space: nowrap; }

  .error-detail {
    display: none; padding: 14px; font-family: 'Fira Code', monospace;
    font-size: 12px; background: #1a1e24; border: 1px solid var(--border);
    border-top: none; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
    white-space: pre-wrap; word-break: break-all; color: var(--red);
    max-height: 300px; overflow-y: auto;
  }
  .error-detail.show { display: block; }

  /* Copy button */
  .copy-section { margin-top: 24px; text-align: center; }
  .copy-btn {
    padding: 12px 32px; border-radius: 10px; border: 1px solid var(--purple);
    background: rgba(188,140,255,0.1); color: var(--purple);
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .copy-btn:hover { background: rgba(188,140,255,0.2); }
  .copy-btn.copied { background: rgba(63,185,80,0.15); border-color: var(--green); color: var(--green); }

  /* No data */
  .no-data {
    text-align: center; padding: 60px; color: var(--dim);
    font-size: 16px;
  }
  .no-data code {
    display: block; margin-top: 16px; padding: 12px 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; font-family: monospace; color: var(--blue);
    font-size: 14px;
  }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>MUSIXQUARE</span> E2E Report</h1>
  <div id="badge" class="status-badge waiting">Waiting</div>
</div>

<div class="stats">
  <div class="stat total"><div id="s-total" class="num">0</div><div class="label">Total</div></div>
  <div class="stat pass"><div id="s-pass" class="num">0</div><div class="label">Passed</div></div>
  <div class="stat fail"><div id="s-fail" class="num">0</div><div class="label">Failed</div></div>
  <div class="stat skip"><div id="s-skip" class="num">0</div><div class="label">Skipped</div></div>
  <div class="stat time"><div id="s-time" class="num">-</div><div class="label">Duration</div></div>
</div>

<div class="progress-wrap">
  <div class="progress-bar">
    <div id="prog-pass" class="progress-fill green" style="width:0; display:inline-block; float:left;"></div>
    <div id="prog-fail" class="progress-fill red" style="width:0; display:inline-block; float:left;"></div>
  </div>
  <div class="progress-info">
    <span id="prog-text">0 / 0</span>
    <span id="prog-pct">0%</span>
  </div>
  <div id="running" class="running-test" style="display:none;"></div>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All <span class="count" id="f-all">0</span></button>
  <button class="filter-btn" data-filter="failed">Failed <span class="count" id="f-fail">0</span></button>
  <button class="filter-btn" data-filter="passed">Passed <span class="count" id="f-pass">0</span></button>
  <button class="filter-btn" data-filter="skipped">Skipped <span class="count" id="f-skip">0</span></button>
</div>

<div id="test-list" class="test-list"></div>

<div class="copy-section" id="copy-section" style="display:none;">
  <button class="copy-btn" id="copy-btn">📋 Copy Report for Claude</button>
</div>

<div id="no-data" class="no-data">
  <div>테스트를 실행해주세요</div>
  <code>npx playwright test --reporter=./e2e/live-reporter.ts,line</code>
</div>

<script>
const $ = id => document.getElementById(id);
let currentFilter = 'all';
let report = null;
let polling = null;

// Filters
$('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderTests();
});

function fmtTime(ms) {
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return m + 'm ' + s + 's';
}

function statusIcon(s) {
  if (s === 'passed') return '<span class="icon pass">✓</span>';
  if (s === 'failed' || s === 'timedOut') return '<span class="icon fail">✗</span>';
  if (s === 'skipped') return '<span class="icon skip">◦</span>';
  return '<span class="icon">…</span>';
}

function renderTests() {
  if (!report) return;
  const list = $('test-list');
  const tests = report.tests.filter(t => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'failed') return t.status === 'failed' || t.status === 'timedOut';
    if (currentFilter === 'passed') return t.status === 'passed';
    if (currentFilter === 'skipped') return t.status === 'skipped';
    return true;
  });

  list.innerHTML = tests.map((t, i) => {
    const isFail = t.status === 'failed' || t.status === 'timedOut';
    return `
      <div class="test-item" onclick="toggleError(this)" data-idx="${i}">
        ${statusIcon(t.status)}
        <div class="test-name">${t.title}<span class="file">${t.file}</span></div>
        <div class="test-time">${fmtTime(t.duration)}</div>
      </div>
      ${isFail && t.error ? `<div class="error-detail" id="err-${i}">${escHtml(t.error)}</div>` : ''}
    `;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.toggleError = function(el) {
  const idx = el.dataset.idx;
  const detail = $('err-' + idx);
  if (!detail) return;
  el.classList.toggle('expanded');
  detail.classList.toggle('show');
};

function update(data) {
  report = data;
  const { total, passed, failed, skipped, completed, running, finishedAt, durationMs } = data;

  // Badge
  const badge = $('badge');
  if (finishedAt) {
    if (failed === 0) { badge.textContent = 'ALL PASSED'; badge.className = 'status-badge passed'; }
    else { badge.textContent = `${failed} FAILED`; badge.className = 'status-badge failed'; }
  } else {
    badge.textContent = 'RUNNING'; badge.className = 'status-badge running';
  }

  // Stats
  $('s-total').textContent = total;
  $('s-pass').textContent = passed;
  $('s-fail').textContent = failed;
  $('s-skip').textContent = skipped;
  $('s-time').textContent = fmtTime(durationMs);

  // Progress
  const pct = total ? (completed / total * 100) : 0;
  const passPct = total ? (passed / total * 100) : 0;
  const failPct = total ? (failed / total * 100) : 0;
  $('prog-pass').style.width = passPct + '%';
  $('prog-fail').style.width = failPct + '%';
  $('prog-text').textContent = `${completed} / ${total}`;
  $('prog-pct').textContent = pct.toFixed(0) + '%';

  // Running
  if (running) {
    $('running').style.display = 'block';
    $('running').textContent = running;
  } else {
    $('running').style.display = 'none';
  }

  // Filter counts
  const failCount = data.tests.filter(t => t.status === 'failed' || t.status === 'timedOut').length;
  $('f-all').textContent = completed;
  $('f-fail').textContent = failCount;
  $('f-pass').textContent = passed;
  $('f-skip').textContent = skipped;

  // No data
  $('no-data').style.display = 'none';

  // Copy section
  $('copy-section').style.display = finishedAt ? 'block' : 'none';

  renderTests();

  // Stop polling when done
  if (finishedAt && polling) {
    clearInterval(polling);
    polling = null;
  }
}

// Poll by reloading the JS script tag (works with file:// protocol)
function poll() {
  const old = document.getElementById('report-script');
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = 'report-script';
  s.src = './e2e-report-data.js?t=' + Date.now();
  s.onload = () => {
    if (window.__E2E_REPORT__) update(window.__E2E_REPORT__);
  };
  s.onerror = () => {}; // file not yet created
  document.body.appendChild(s);
}

polling = setInterval(poll, 1000);
poll();

// Copy report
$('copy-btn').addEventListener('click', () => {
  if (!report) return;
  const failedTests = report.tests.filter(t => t.status === 'failed' || t.status === 'timedOut');

  let text = `## E2E Test Report\n`;
  text += `- **Total**: ${report.total}\n`;
  text += `- **Passed**: ${report.passed} ✅\n`;
  text += `- **Failed**: ${report.failed} ❌\n`;
  text += `- **Skipped**: ${report.skipped}\n`;
  text += `- **Duration**: ${fmtTime(report.durationMs)}\n\n`;

  if (failedTests.length > 0) {
    text += `### Failed Tests\n\n`;
    failedTests.forEach((t, i) => {
      text += `**${i + 1}. ${t.title}** (${t.file})\n`;
      if (t.error) {
        // Truncate error to first 3 lines
        const lines = t.error.split('\n').slice(0, 3).join('\n');
        text += '```\n' + lines + '\n```\n\n';
      }
    });
  } else {
    text += `🎉 All tests passed!\n`;
  }

  navigator.clipboard.writeText(text).then(() => {
    const btn = $('copy-btn');
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Report for Claude'; btn.classList.remove('copied'); }, 2000);
  });
});
</script>

</body>
</html>
