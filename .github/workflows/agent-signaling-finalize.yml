name: Dispatch Main Signaling Liveness Repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: dispatch-main-signaling-liveness-repair
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/signaling-liveness-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the main repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run agent-signaling-finalize-v4.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh pr comment 82 --repo "$GITHUB_REPOSITORY" --body "Dispatched the main signaling repair workflow from PR event ${GITHUB_RUN_ID}. The main workflow will report its exact run URL and final result here." || true
