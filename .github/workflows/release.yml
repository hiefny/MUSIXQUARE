      - name: Apply and verify Developer API authority-fence D1 contract
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          probe_file='release-artifacts/deployments/developer-api-authority-fence-before.json'
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote --json --config cloudflare/wrangler.developer-api.toml \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'mxqr_developer_api_room_authority_fences') AS table_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_mxqr_developer_api_room_authority_fences_status') AS index_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('trg_mxqr_developer_api_keys_authority_fenced_insert', 'trg_mxqr_developer_api_keys_authority_fenced_update')) AS trigger_count" \
            | node scripts/capture-wrangler-d1-json.mjs "$probe_file"
          table_count="$(jq -er '.[0].results[0].table_count | tonumber' "$probe_file")"
          index_count="$(jq -er '.[0].results[0].index_count | tonumber' "$probe_file")"
          trigger_count="$(jq -er '.[0].results[0].trigger_count | tonumber' "$probe_file")"
          if [[ "$table_count" == '0' ]]; then
            if [[ "${{ inputs.apply_developer_api_d1 }}" != 'true' ]]; then
              echo '::error::Developer API authority fence is missing; rerun with apply_developer_api_d1 enabled.'
              exit 1
            fi
            npm run --silent wrangler -- d1 execute musixquare-developer-api \
              --remote --config cloudflare/wrangler.developer-api.toml \
              --file cloudflare/developer-api.authority-fence.migration.sql
          elif [[ "$table_count" == '1' && ( "$index_count" != '1' || "$trigger_count" != '2' ) ]]; then
            if [[ "${{ inputs.apply_developer_api_d1 }}" != 'true' ]]; then
              echo '::error::Developer API authority fence is incomplete; rerun with apply_developer_api_d1 enabled.'
              exit 1
            fi
            # CREATE TABLE can commit before a later statement fails. Repair
            # only the idempotent tail on a workflow retry; never recreate or
            # replace the authority rows themselves.
            repair_file='release-artifacts/deployments/developer-api-authority-fence-repair.sql'
            awk '
              /^CREATE INDEX / { emit = 1 }
              emit {
                if ($0 ~ /^CREATE INDEX /) sub(/^CREATE INDEX /, "CREATE INDEX IF NOT EXISTS ");
                if ($0 ~ /^CREATE TRIGGER /) sub(/^CREATE TRIGGER /, "CREATE TRIGGER IF NOT EXISTS ");
                print
              }
            ' cloudflare/developer-api.authority-fence.migration.sql > "$repair_file"
            grep -Fq 'CREATE INDEX IF NOT EXISTS idx_mxqr_developer_api_room_authority_fences_status' "$repair_file"
            grep -Fq 'CREATE TRIGGER IF NOT EXISTS trg_mxqr_developer_api_keys_authority_fenced_insert' "$repair_file"
            grep -Fq 'CREATE TRIGGER IF NOT EXISTS trg_mxqr_developer_api_keys_authority_fenced_update' "$repair_file"
            npm run --silent wrangler -- d1 execute musixquare-developer-api \
              --remote --config cloudflare/wrangler.developer-api.toml --file "$repair_file"
          elif [[ "$table_count" != '1' || "$index_count" != '1' || "$trigger_count" != '2' ]]; then
            echo "::error::Unexpected Developer API authority-fence schema state: table=$table_count index=$index_count triggers=$trigger_count"
            exit 1
          fi

          verify_file='release-artifacts/deployments/developer-api-authority-fence-verified.json'
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote --json --config cloudflare/wrangler.developer-api.toml \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'mxqr_developer_api_room_authority_fences' AND instr(lower(sql), 'primary key (room_code, room_generation)') > 0 AND instr(lower(sql), 'status in (''active'', ''cleared'')') > 0) AS table_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_mxqr_developer_api_room_authority_fences_status') AS index_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('trg_mxqr_developer_api_keys_authority_fenced_insert', 'trg_mxqr_developer_api_keys_authority_fenced_update') AND instr(lower(sql), 'developer_api_authority_fenced') > 0) AS trigger_count, (SELECT COUNT(*) FROM mxqr_developer_api_room_authority_fences WHERE status NOT IN ('active', 'cleared') OR reason NOT IN ('owner_account_deleted', 'ownership_transfer_pending')) AS invalid_fence_count" \
            | node scripts/capture-wrangler-d1-json.mjs "$verify_file"
          jq -e '
            .[0].results[0]
            | (.table_count | tonumber) == 1
              and (.index_count | tonumber) == 1
              and (.trigger_count | tonumber) == 2
              and (.invalid_fence_count | tonumber) == 0
          ' "$verify_file" >/dev/null || {
            echo '::error::The production Developer API authority-fence contract is incomplete.'
            jq '.[0].results[0]' "$verify_file"
            exit 1
          }

      - name: Apply and verify Developer API authority-epoch D1 contract
