version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Asia/Seoul
    # Routine version-update PRs are paused; security alerts remain enabled.
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '01:30'
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci
