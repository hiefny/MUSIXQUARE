name: One-shot Signaling Liveness Production Repair v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-signaling-finalize-v4.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: musixquare-one-shot-signaling-production-v5
  cancel-in-progress: true

jobs:
  repair-validate-deploy-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Publish starting status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 82 --body "Signaling production repair v5 started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Require unchanged main ownership
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Apply exact WebSocket liveness repair
        run: node scripts/one-shot-signaling-liveness-patch.mjs

      - name: Align release, export, and CI contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          TARGET_VERSION = '8.3.73'
          PREVIOUS_VERSION = '8.3.72'

          def replace_once(source: str, before: str, after: str, label: str) -> str:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}: {before[:100]!r}')
              return source.replace(before, after, 1)

          for name in ('package.json', 'package-lock.json'):
              path = Path(name)
              document = json.loads(path.read_text(encoding='utf-8'))
              if document.get('version') != PREVIOUS_VERSION:
                  raise SystemExit(f'{name}: unexpected version {document.get("version")!r}')
              document['version'] = TARGET_VERSION
              if name == 'package-lock.json':
                  root = document.get('packages', {}).get('')
                  if not isinstance(root, dict) or root.get('version') != PREVIOUS_VERSION:
                      raise SystemExit('package-lock.json: unexpected root package version')
                  root['version'] = TARGET_VERSION
              path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          version_targets = (
              ('cloudflare/app-worker.ts', 'ADMIN_ASSET_VERSION'),
              ('browser/classic-runtime/admin.ts', 'ADMIN_SCRIPT_VERSION'),
          )
          for filename, constant in version_targets:
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              pattern = re.compile(rf"const {constant} = '([^']+)';")
              matches = pattern.findall(source)
              if matches != [PREVIOUS_VERSION]:
                  raise SystemExit(f'{filename}: unexpected {constant} declarations: {matches!r}')
              source = pattern.sub(f"const {constant} = '{TARGET_VERSION}';", source, count=1)
              path.write_text(source, encoding='utf-8')

          liveness_path = Path('src/network/transport/signaling-liveness.ts')
          liveness = liveness_path.read_text(encoding='utf-8')
          for constant in (
              'SIGNALING_LIVENESS_PING',
              'SIGNALING_LIVENESS_PONG',
              'SIGNALING_LIVENESS_INTERVAL_MS',
              'SIGNALING_LIVENESS_TIMEOUT_MS',
          ):
              liveness = replace_once(
                  liveness,
                  f'export const {constant}',
                  f'const {constant}',
                  f'{liveness_path}:{constant}',
              )
          liveness_path.write_text(liveness, encoding='utf-8')

          test_path = Path('src/network/transport/__tests__/signaling-liveness.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          imported_constants = """import {
            SIGNALING_LIVENESS_INTERVAL_MS,
            SIGNALING_LIVENESS_PING,
            SIGNALING_LIVENESS_PONG,
            SIGNALING_LIVENESS_TIMEOUT_MS,
          } from '../signaling-liveness.ts';
          """
          local_constants = """const SIGNALING_LIVENESS_PING =
            '{\"type\":\"signaling-liveness-ping\",\"version\":1}';
          const SIGNALING_LIVENESS_PONG =
            '{\"type\":\"signaling-liveness-pong\",\"version\":1}';
          const SIGNALING_LIVENESS_INTERVAL_MS = 5_000;
          const SIGNALING_LIVENESS_TIMEOUT_MS = 10_000;
          """
          tests = replace_once(
              tests,
              imported_constants,
              local_constants,
              f'{test_path}:liveness constants import',
          )
          test_path.write_text(tests, encoding='utf-8')

          evidence_path = Path('scripts/release-evidence.mts')
          evidence = evidence_path.read_text(encoding='utf-8')
          evidence = replace_once(
              evidence,
              '  events: readonly string[];\n',
              '  event: string;\n  fallbackEvents?: readonly string[];\n',
              f'{evidence_path}:options',
          )
          evidence = replace_once(
              evidence,
              '  workflow,\n  events,\n  prefix,\n',
              '  workflow,\n  event,\n  fallbackEvents = [],\n  prefix,\n',
              f'{evidence_path}:destructure',
          )
          old_run_sets = """    const runSets = await Promise.all(
              events.map(async (event) => ({
                event,
                runs: await githubApi(workflowRunsPath(repository, workflow, sha, event), token),
              })),
            );
          """
          new_run_sets = """    const candidateEvents = [event, ...fallbackEvents];
            const runSets = await Promise.all(
              candidateEvents.map(async (candidateEvent) => ({
                event: candidateEvent,
                runs: await githubApi(
                  workflowRunsPath(repository, workflow, sha, candidateEvent),
                  token,
                ),
              })),
            );
          """
          evidence = replace_once(
              evidence,
              old_run_sets,
              new_run_sets,
              f'{evidence_path}:run sets',
          )
          evidence = replace_once(
              evidence,
              "      events: ['push', 'workflow_dispatch'],\n",
              "      event: 'push',\n      fallbackEvents: ['workflow_dispatch'],\n",
              f'{evidence_path}:candidate events',
          )
          evidence_path.write_text(evidence, encoding='utf-8')

          Path('docs/design/signaling-liveness.md').write_text(
              '''# Signaling WebSocket Liveness and Invite Recovery

- **Status:** Accepted
- **Decision date:** 2026-08-19
- **Applies to:** Cloudflare standard-room and PRO signaling transports

## Decision

The signaling Worker advertises protocol version 1 after authenticated admission. Upgraded
clients send a fixed application-level ping on the exact admitted WebSocket every five
seconds. Cloudflare Durable Objects use a WebSocket auto-response when available, retaining
an explicit fallback for local and compatibility runtimes.

A socket that produces neither a pong nor another server message within the bounded timeout
is identity-fenced out of transport state before close. Existing WebRTC media/data channels
remain intact while only the signaling generation is rebuilt through the existing recovery
backoff. Legacy Workers remain compatible because monitoring begins only after capability
advertisement. Background timer gaps re-arm the probe instead of declaring a false outage.

The media-loading policy is unchanged: loading remains best-effort until the device itself
fails, and the 200 MiB value remains a transfer/private-storage protocol ceiling rather than
a RAM admission limit.
''',
              encoding='utf-8',
          )
          PY

      - name: Remove transient repair files
        run: |
          rm -f .github/workflows/agent-signaling-finalize.yml
          rm -f .github/workflows/agent-signaling-finalize-v3.yml
          rm -f .github/workflows/agent-signaling-finalize-v4.yml
          rm -f .github/workflows/one-shot-signaling-production.yml
          rm -f scripts/one-shot-signaling-liveness-patch.py
          rm -f scripts/one-shot-signaling-liveness-patch.mjs
          rm -f scripts/one-shot-signaling-liveness-patch-base.mjs
          rm -f scripts/.generated-one-shot-signaling-liveness-patch.mjs

      - name: Format touched sources
        run: >-
          npx prettier --write
          src/network/transport/signaling-liveness.ts
          src/network/transport/__tests__/signaling-liveness.test.ts
          src/network/transport/__tests__/cloudflare-signaling-worker.test.ts
          src/network/transport/cloudflare-signaling.ts
          src/network/transport/types.ts
          src/network/peer.ts
          cloudflare/signaling-worker.ts
          cloudflare/app-worker.ts
          browser/classic-runtime/admin.ts
          .github/workflows/ci.yml
          scripts/release-evidence.mts
          scripts/service-worker-asset.ts
          docs/design/signaling-liveness.md
          package.json
          package-lock.json
          index.html

      - name: Verify clean patch shape and release identity
        run: |
          test ! -e .github/workflows/one-shot-signaling-production.yml
          test ! -e .github/workflows/agent-signaling-finalize-v4.yml
          test ! -e scripts/one-shot-signaling-liveness-patch.py
          test ! -e scripts/one-shot-signaling-liveness-patch.mjs
          test ! -e scripts/one-shot-signaling-liveness-patch-base.mjs
          grep -q "v460" scripts/service-worker-asset.ts
          grep -q "const ADMIN_ASSET_VERSION = '8.3.73';" cloudflare/app-worker.ts
          grep -q "const ADMIN_SCRIPT_VERSION = '8.3.73';" browser/classic-runtime/admin.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== '8.3.73' || lock.version !== '8.3.73' || lock.packages?.['']?.version !== '8.3.73') {
            throw new Error('RELEASE_VERSION_NOT_ALIGNED');
          }
          NODE
          git diff --check

      - name: Focused signaling tests
        run: >-
          npx vitest run
          src/network/transport/__tests__/signaling-liveness.test.ts
          src/network/transport/__tests__/cloudflare-signaling.test.ts
          src/network/transport/__tests__/cloudflare-signaling-worker.test.ts
          src/network/__tests__/signaling-health.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and formatting contracts
        run: |
          npm run lint
          npm run format:check

      - name: Full unit suite
        run: npm test

      - name: Checked production build
        run: npm run build:checked

      - name: Bundle every production Worker
        run: npm run check:worker-bundles

      - name: Commit validated clean source to main
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: detect half-open signaling outages'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "final_sha=${final_sha}" >> "$GITHUB_OUTPUT"
          gh pr comment 82 --body "Clean signaling repair committed to main at ${final_sha}; exact-SHA CI is starting." || true

      - name: Dispatch and wait for exact-SHA CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          gh workflow run ci.yml --ref main
          run_id=''
          for _ in $(seq 1 90); do
            run_id="$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --commit "$FINAL_SHA" --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          gh pr comment 82 --body "Exact-SHA CI: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
          gh run watch "$run_id" --exit-status --interval 10

      - name: Dispatch and wait for full production release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          gh workflow run release.yml --ref main -f target=all -f apply_developer_api_d1=false
          run_id=''
          for _ in $(seq 1 90); do
            run_id="$(gh run list --workflow release.yml --branch main --event workflow_dispatch --commit "$FINAL_SHA" --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          gh pr comment 82 --body "Full app+signaling production release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
          gh run watch "$run_id" --exit-status --interval 15

      - name: Verify live SW and signaling capability
        env:
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          sw_ok='false'
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://musixquare.com/service-worker.js?verify=${FINAL_SHA}" | grep -q 'v460'; then
              sw_ok='true'
              break
            fi
            sleep 5
          done
          test "$sw_ok" = 'true'

          node --input-type=module <<'NODE' > live-signaling-verification.json
          import { randomBytes, randomInt, randomUUID } from 'node:crypto';
          import WebSocket from 'ws';

          const roomId = String(randomInt(100000, 1000000));
          const peerId = `verify-${randomUUID().replaceAll('-', '').slice(0, 20)}`;
          const secret = randomBytes(24).toString('base64url');
          const url = new URL(`wss://signal.musixquare.com/api/rooms/${roomId}/ws`);
          url.searchParams.set('role', 'host');
          url.searchParams.set('peerId', peerId);
          const ping = '{"type":"signaling-liveness-ping","version":1}';
          const pong = '{"type":"signaling-liveness-pong","version":1}';

          const result = await new Promise((resolve, reject) => {
            const socket = new WebSocket(url, { origin: 'https://musixquare.com' });
            let workerVersionId = '';
            const timer = setTimeout(() => {
              socket.terminate();
              reject(new Error('LIVE_SIGNALING_LIVENESS_TIMEOUT'));
            }, 15000);
            const finish = (value) => {
              clearTimeout(timer);
              try { socket.close(1000, 'verification complete'); } catch {}
              resolve(value);
            };
            socket.once('open', () => socket.send(JSON.stringify({ type: 'host-auth', secret })));
            socket.on('message', (data) => {
              const raw = data.toString();
              if (raw === pong) {
                finish({ workerVersionId, signalingLivenessVersion: 1, pong: true });
                return;
              }
              let message;
              try { message = JSON.parse(raw); } catch { return; }
              if (message?.type !== 'peer-open') return;
              workerVersionId = typeof message.workerVersionId === 'string' ? message.workerVersionId : '';
              if (message.signalingLivenessVersion !== 1) {
                clearTimeout(timer);
                socket.terminate();
                reject(new Error(`LIVE_SIGNALING_CAPABILITY_${String(message.signalingLivenessVersion)}`));
                return;
              }
              socket.send(ping);
            });
            socket.once('error', reject);
          });
          console.log(JSON.stringify(result));
          NODE
          cat live-signaling-verification.json

      - name: Close superseded PR and publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          gh pr close 82 --comment "Superseded by deployed main commit ${FINAL_SHA}. SW v460 and signaling liveness capability v1 were verified live." --delete-branch || true

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 82 --body "Production repair v5 failed closed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
