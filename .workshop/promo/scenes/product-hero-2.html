<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSIXQUARE – Product Hero (tablet 3:2)</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #ededed 0%, #dedede 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; }

  .overlay {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
    font-size: 11px; letter-spacing: 0.08em;
    color: #71717a; text-transform: uppercase;
    user-select: none;
    transition: opacity 0.3s ease;
    opacity: 0.7;
  }
  .overlay.hidden { opacity: 0; }
  .overlay kbd {
    display: inline-block;
    min-width: 18px; padding: 3px 6px;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 4px;
    background: rgba(255,255,255,0.8);
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 10px; font-weight: 600;
    color: #52525b;
    text-align: center;
  }

  .brand {
    position: fixed;
    top: 24px; left: 24px;
    font-size: 10px; letter-spacing: 0.24em;
    color: #a1a1aa;
    text-transform: uppercase;
    font-weight: 700;
    user-select: none;
    transition: opacity 0.3s ease;
  }
  .brand.hidden { opacity: 0; }

  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #f8f9fa;
    z-index: 100;
    transition: opacity 0.4s ease;
    font-size: 11px; letter-spacing: 0.2em;
    color: #a1a1aa; text-transform: uppercase;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="brand">MUSIXQUARE</div>
<div class="loading" id="loading">Loading textures…</div>
<div class="overlay">
  <span><kbd>Space</kbd> pause</span>
  <span><kbd>R</kbd> reset</span>
  <span><kbd>H</kbd> hide UI</span>
  <span>drag to orbit · scroll to zoom</span>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.162.0';
import { OrbitControls } from 'https://esm.sh/three@0.162.0/examples/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from 'https://esm.sh/three@0.162.0/examples/jsm/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'https://esm.sh/three@0.162.0/examples/jsm/geometries/RoundedBoxGeometry.js';
import GUI from 'https://esm.sh/lil-gui@0.19.2';

const canvas = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.max(window.devicePixelRatio, 3));  // supersample for capture
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);  // transparent — body gradient shows through
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(10, window.innerWidth / window.innerHeight, 0.1, 1000);
const DEFAULT_CAM = new THREE.Vector3(0, 0.5, 90);
camera.position.copy(DEFAULT_CAM);

const pmrem = new THREE.PMREMGenerator(renderer);

function makeStudioScene() {
  // High-contrast "softbox" setup — bright top panel, warm side, dark ground
  const s = new THREE.Scene();
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(12, 0.1, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  top.position.y = 5;
  s.add(top);
  const warm = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 5, 5),
    new THREE.MeshBasicMaterial({ color: 0xfff0d0 })
  );
  warm.position.set(-6, 1, 0);
  s.add(warm);
  const cool = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 5, 5),
    new THREE.MeshBasicMaterial({ color: 0xd0e8ff })
  );
  cool.position.set(6, 1, 0);
  s.add(cool);
  const ground = new THREE.Mesh(
    new THREE.BoxGeometry(20, 0.1, 20),
    new THREE.MeshBasicMaterial({ color: 0x1a1a1a })
  );
  ground.position.y = -4;
  s.add(ground);
  return s;
}

const envTextures = {
  Room:   pmrem.fromScene(new RoomEnvironment(), 0.04).texture,
  Studio: pmrem.fromScene(makeStudioScene(),      0.02).texture,
  None:   null
};
scene.environment = envTextures.Studio;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
keyLight.position.set(4, 8, 6);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xccddff, 0.35);
fillLight.position.set(-6, 2, 4);
scene.add(fillLight);

// ─── Panel layout ────────────────────────────────────
// Left cluster: 3 setup cards stacked & overlapping like a deck fanned slightly
// Right cluster: main player + audio settings floating
const PANELS = [
  { file: '01.png', pos: [-4.50,  1.44, -0.15], rotY:  0.090, rotX:  0.200, rotZ: -0.100, scale: 0.72 },
  { file: '02.png', pos: [-3.50, -0.18,  0.35], rotY:  0.130, rotX:  0.000, rotZ:  0.100, scale: 0.72 },
  { file: '03.png', pos: [-2.20, -1.55,  1.00], rotY:  0.270, rotX: -0.210, rotZ:  0.300, scale: 0.72 },
  { file: '04.png', pos: [ 2.20,  1.06,  3.50], rotY: -0.080, rotX: -0.130, rotZ: -0.080, scale: 1.00 },
  { file: '05.png', pos: [ 4.20, -1.27,  1.85], rotY: -0.170, rotX: -0.390, rotZ: -0.040, scale: 0.72 }
];

const ASSET_PATH = '../assets/screenshots-tablet/';
const BASE_WIDTH = 6.0; // unit-width for scale=1.0

const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function loadTexture(file) {
  return new Promise((resolve, reject) => {
    loader.load(ASSET_PATH + file, tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      resolve(tex);
    }, undefined, reject);
  });
}

const screenMaterials = [];
const bodyMaterials = [];
const shadowData = [];  // { mesh, material, W, H } — for GUI batch update
const shadowState = {
  opacity: 0.10,
  scaleX: 1.2,
  scaleY: 0.34,
  offsetY: 0.42  // distance below panel, as fraction of H
};
const CORNER_R = 0.12;  // panel corner radius

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const hw = w / 2, hh = h / 2;
  s.moveTo(-hw + r, -hh);
  s.lineTo( hw - r, -hh);
  s.quadraticCurveTo( hw, -hh,  hw, -hh + r);
  s.lineTo( hw,  hh - r);
  s.quadraticCurveTo( hw,  hh,  hw - r,  hh);
  s.lineTo(-hw + r,  hh);
  s.quadraticCurveTo(-hw,  hh, -hw,  hh - r);
  s.lineTo(-hw, -hh + r);
  s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  return s;
}

function buildPanel(tex, cfg) {
  const aspect = tex.image.width / tex.image.height;
  const W = BASE_WIDTH * cfg.scale;
  const H = W / aspect;
  const DEPTH = 0.055;

  const group = new THREE.Group();
  group.position.set(...cfg.pos);
  group.rotation.set(cfg.rotX, cfg.rotY, cfg.rotZ || 0);

  // Screenshot front — diffuse texture + subtle emissive + clearcoat gloss
  // Keeps UI contrast; gets highlights from env via clearcoat
  const screenMat = new THREE.MeshPhysicalMaterial({
    map: tex,
    emissive: 0xffffff,
    emissiveMap: tex,
    emissiveIntensity: 0.75,
    metalness: 0.32,
    roughness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 1.0,
    envMapIntensity: 0.0,
    transparent: true,
    opacity: 0.90,
    toneMapped: false
  });
  screenMaterials.push(screenMat);

  // Panel body sides/back — pure white glossy plastic with emissive baseline
  // Emissive keeps shaded areas from going gray while still allowing bevel reflections
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    emissive: 0xffffff,
    emissiveIntensity: 0.25,
    metalness: 0.0,
    roughness: 0.35,
    clearcoat: 0.6,
    clearcoatRoughness: 0.15,
    envMapIntensity: 0.9,
    transparent: true,
    opacity: 0.90
  });
  bodyMaterials.push(bodyMat);

  // Body: flat extruded rounded rect (no bevel — clean card look)
  const rectShape = roundedRectShape(W, H, CORNER_R);
  const bodyGeom = new THREE.ExtrudeGeometry(rectShape, {
    depth: DEPTH,
    bevelEnabled: false,
    curveSegments: 16
  });
  bodyGeom.translate(0, 0, -DEPTH / 2);
  const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
  group.add(bodyMesh);

  // Screen: flat rounded rect plane matching body shape
  const screenGeom = new THREE.ShapeGeometry(rectShape);
  const uv = screenGeom.attributes.uv.array;
  for (let i = 0; i < uv.length; i += 2) {
    uv[i]     = (uv[i]     + W / 2) / W;
    uv[i + 1] = (uv[i + 1] + H / 2) / H;
  }
  screenGeom.attributes.uv.needsUpdate = true;
  const screenMesh = new THREE.Mesh(screenGeom, screenMat);
  screenMesh.position.z = DEPTH / 2 + 0.002;
  group.add(screenMesh);

  // Soft contact shadow below (unit-sized geometry + scale so GUI can resize)
  const shadowTex = makeShadowTexture();
  const shadowGeom = new THREE.PlaneGeometry(1, 1);
  const shadowMat = new THREE.MeshBasicMaterial({
    map: shadowTex,
    transparent: true,
    opacity: shadowState.opacity,
    depthWrite: false,
    toneMapped: false
  });
  const shadow = new THREE.Mesh(shadowGeom, shadowMat);
  shadow.scale.set(W * shadowState.scaleX, H * shadowState.scaleY, 1);
  shadow.position.set(0, -H * shadowState.offsetY, -DEPTH * 0.5);
  shadow.rotation.x = -Math.PI / 2 * 0.12;
  group.add(shadow);
  shadowData.push({ mesh: shadow, material: shadowMat, W, H });

  return group;
}

// Canvas-based radial gradient for soft contact shadow
function makeShadowTexture() {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0,    'rgba(0,0,0,0.9)');
  g.addColorStop(0.4,  'rgba(0,0,0,0.4)');
  g.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const panelsGroup = new THREE.Group();
scene.add(panelsGroup);

Promise.all(PANELS.map(p => loadTexture(p.file).then(tex => ({ tex, cfg: p }))))
  .then(loaded => {
    loaded.forEach(({ tex, cfg }) => {
      panelsGroup.add(buildPanel(tex, cfg));
    });
    document.getElementById('loading').classList.add('hidden');
  })
  .catch(err => {
    console.error('Texture load failed:', err);
    document.getElementById('loading').textContent = 'Failed to load screenshots';
  });

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 10;
controls.maxDistance = 50;

// ─── Click-to-edit: select panel → lil-gui sliders ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selectedIndex = -1;
let editMode = false;   // true when a panel is selected — pauses float

const gui = new GUI({ title: 'Controls' });

// ─── Scene-level controls (always visible) ───────────
const sceneState = {
  fov: camera.fov,
  camZ: camera.position.z
};
const sceneFolder = gui.addFolder('Camera');
sceneFolder.add(sceneState, 'fov', 8, 70, 0.5).name('fov (lower = telephoto)').onChange(v => {
  camera.fov = v;
  camera.updateProjectionMatrix();
});
sceneFolder.add(sceneState, 'camZ', 5, 90, 0.5).name('distance').onChange(v => {
  const dir = new THREE.Vector3(0, 0, 1); // along +Z relative to target
  const target = controls.target.clone();
  camera.position.copy(target).add(dir.multiplyScalar(v));
  controls.update();
});
sceneFolder.open();

// ─── Background gradient controls ────────────────────
const bgState = { top: '#ededed', bottom: '#dedede', radial: true };
function applyBg() {
  const type = bgState.radial ? 'radial-gradient(ellipse at center' : 'linear-gradient(180deg';
  document.body.style.background = `${type}, ${bgState.top} 0%, ${bgState.bottom} 100%)`;
}
const bgFolder = gui.addFolder('Background');
bgFolder.addColor(bgState, 'top').name('top / inner').onChange(applyBg);
bgFolder.addColor(bgState, 'bottom').name('bottom / outer').onChange(applyBg);
bgFolder.add(bgState, 'radial').name('radial (else linear)').onChange(applyBg);
bgFolder.add({
  'Copy bg': () => {
    const css = `background: ${bgState.radial ? 'radial-gradient(ellipse at center' : 'linear-gradient(180deg'}, ${bgState.top} 0%, ${bgState.bottom} 100%);`;
    navigator.clipboard.writeText(css);
    console.log('[copied]', css);
  }
}, 'Copy bg');
bgFolder.close();

// ─── Material controls (apply to all screen faces) ───
const matState = {
  opacity: 0.90,
  emissiveIntensity: 0.75,
  roughness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 1.0,
  envMapIntensity: 0.0,
  metalness: 0.32
};
const matFolder = gui.addFolder('Material (all panels)');
function applyMat(prop, v) {
  screenMaterials.forEach(m => { m[prop] = v; m.needsUpdate = true; });
  // Body mirrors opacity so the whole panel translucency stays consistent
  if (prop === 'opacity') {
    bodyMaterials.forEach(m => { m[prop] = v; m.needsUpdate = true; });
  }
}
matFolder.add(matState, 'opacity', 0, 1, 0.01).onChange(v => applyMat('opacity', v));
matFolder.add(matState, 'emissiveIntensity', 0, 2, 0.01).onChange(v => applyMat('emissiveIntensity', v));
matFolder.add(matState, 'roughness', 0, 1, 0.01).onChange(v => applyMat('roughness', v));
matFolder.add(matState, 'clearcoat', 0, 1, 0.01).onChange(v => applyMat('clearcoat', v));
matFolder.add(matState, 'clearcoatRoughness', 0, 1, 0.01).onChange(v => applyMat('clearcoatRoughness', v));
matFolder.add(matState, 'envMapIntensity', 0, 3, 0.05).onChange(v => applyMat('envMapIntensity', v));
matFolder.add(matState, 'metalness', 0, 1, 0.01).onChange(v => applyMat('metalness', v));
matFolder.add({
  'Copy material': () => {
    const lines = Object.entries(matState).map(([k, v]) => `    ${k}: ${v.toFixed(3)},`).join('\n');
    navigator.clipboard.writeText(lines);
    console.log('[copied]\n' + lines);
  }
}, 'Copy material');
matFolder.close();

// ─── Shadow controls ────────────────────────────────
const shadowFolder = gui.addFolder('Shadow');
shadowFolder.add(shadowState, 'opacity', 0, 1, 0.01).onChange(v => {
  shadowData.forEach(s => { s.material.opacity = v; s.material.needsUpdate = true; });
});
shadowFolder.add(shadowState, 'scaleX', 0.3, 4, 0.05).name('width').onChange(v => {
  shadowData.forEach(s => s.mesh.scale.x = s.W * v);
});
shadowFolder.add(shadowState, 'scaleY', 0.1, 2, 0.02).name('height').onChange(v => {
  shadowData.forEach(s => s.mesh.scale.y = s.H * v);
});
shadowFolder.add(shadowState, 'offsetY', 0.0, 1.5, 0.02).name('offset down').onChange(v => {
  shadowData.forEach(s => s.mesh.position.y = -s.H * v);
});
shadowFolder.add({
  'Copy shadow': () => {
    const lines = Object.entries(shadowState).map(([k, v]) => `    ${k}: ${v.toFixed(3)},`).join('\n');
    navigator.clipboard.writeText(lines);
    console.log('[copied]\n' + lines);
  }
}, 'Copy shadow');
shadowFolder.close();

// ─── Lighting & Environment controls ─────────────────
const lightState = {
  env: 'Studio',
  ambient: 0.6,
  key: 0.8,
  fill: 0.35,
  keyX: 4, keyY: 8, keyZ: 6
};
const lightFolder = gui.addFolder('Lighting');
lightFolder.add(lightState, 'env', ['Room', 'Studio', 'None']).onChange(v => {
  scene.environment = envTextures[v];
});
lightFolder.add(lightState, 'ambient', 0, 2, 0.02).onChange(v => { ambientLight.intensity = v; });
lightFolder.add(lightState, 'key',     0, 2, 0.02).onChange(v => { keyLight.intensity = v; });
lightFolder.add(lightState, 'fill',    0, 2, 0.02).onChange(v => { fillLight.intensity = v; });
lightFolder.add(lightState, 'keyX', -15, 15, 0.2).name('key x').onChange(v => { keyLight.position.x = v; });
lightFolder.add(lightState, 'keyY', -15, 15, 0.2).name('key y').onChange(v => { keyLight.position.y = v; });
lightFolder.add(lightState, 'keyZ', -15, 15, 0.2).name('key z').onChange(v => { keyLight.position.z = v; });
lightFolder.add({
  'Copy lighting': () => {
    const lines = Object.entries(lightState).map(([k, v]) =>
      `    ${k}: ${typeof v === 'number' ? v.toFixed(2) : JSON.stringify(v)},`).join('\n');
    navigator.clipboard.writeText(lines);
    console.log('[copied]\n' + lines);
  }
}, 'Copy lighting');
lightFolder.close();

// ─── Export (high-res PNG capture) ───────────────────
async function captureAt(w, h) {
  const origRatio = renderer.getPixelRatio();
  const origSize = new THREE.Vector2();
  renderer.getSize(origSize);
  const origAspect = camera.aspect;

  // Resize renderer + camera for capture (don't touch canvas style)
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);

  // Composite: bg gradient onto 2D canvas, then draw WebGL result on top
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  if (bgState.radial) {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.hypot(w, h) / 2);
    g.addColorStop(0, bgState.top);
    g.addColorStop(1, bgState.bottom);
    ctx.fillStyle = g;
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, bgState.top);
    g.addColorStop(1, bgState.bottom);
    ctx.fillStyle = g;
  }
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(canvas, 0, 0);

  const dataUrl = out.toDataURL('image/png');

  renderer.setPixelRatio(origRatio);
  renderer.setSize(origSize.x, origSize.y, false);
  camera.aspect = origAspect;
  camera.updateProjectionMatrix();
  window.dispatchEvent(new Event('resize'));

  return dataUrl;
}

function downloadPng(dataUrl, name) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = name;
  a.click();
}

const exportFolder = gui.addFolder('Export');
exportFolder.add({
  '4K (3840×2160)': async () => {
    const url = await captureAt(3840, 2160);
    downloadPng(url, `musixquare-hero-4k-${Date.now()}.png`);
  }
}, '4K (3840×2160)');
exportFolder.add({
  '8K (7680×4320)': async () => {
    const url = await captureAt(7680, 4320);
    downloadPng(url, `musixquare-hero-8k-${Date.now()}.png`);
  }
}, '8K (7680×4320)');
exportFolder.add({
  'FHD (1920×1080)': async () => {
    const url = await captureAt(1920, 1080);
    downloadPng(url, `musixquare-hero-fhd-${Date.now()}.png`);
  }
}, 'FHD (1920×1080)');
exportFolder.close();

// ─── Panel-specific controls (populated on click) ───
let panelFolder = gui.addFolder('Panel');
panelFolder.hide();
const guiState = { x: 0, y: 0, z: 0, rotX: 0, rotY: 0, rotZ: 0 };

function rebuildGUI() {
  panelFolder.destroy();
  panelFolder = gui.addFolder('Panel');

  if (selectedIndex < 0) { panelFolder.hide(); return; }
  const group = panelsGroup.children[selectedIndex];
  const cfg = PANELS[selectedIndex];
  panelFolder.title(`#${selectedIndex + 1} ${cfg.file}`);

  guiState.x = group.position.x;
  guiState.y = group.position.y;
  guiState.z = group.position.z;
  guiState.rotX = group.rotation.x;
  guiState.rotY = group.rotation.y;
  guiState.rotZ = group.rotation.z;

  panelFolder.add(guiState, 'x', -12, 12, 0.05).onChange(v => {
    group.position.x = v; PANELS[selectedIndex].pos[0] = v;
  });
  panelFolder.add(guiState, 'y', -8, 8, 0.05).onChange(v => {
    group.position.y = v; PANELS[selectedIndex].pos[1] = v;
  });
  panelFolder.add(guiState, 'z', -6, 6, 0.05).onChange(v => {
    group.position.z = v; PANELS[selectedIndex].pos[2] = v;
  });
  panelFolder.add(guiState, 'rotX', -Math.PI/2, Math.PI/2, 0.01).onChange(v => {
    group.rotation.x = v; PANELS[selectedIndex].rotX = v;
  });
  panelFolder.add(guiState, 'rotY', -Math.PI, Math.PI, 0.01).onChange(v => {
    group.rotation.y = v; PANELS[selectedIndex].rotY = v;
  });
  panelFolder.add(guiState, 'rotZ', -Math.PI/2, Math.PI/2, 0.01).onChange(v => {
    group.rotation.z = v; PANELS[selectedIndex].rotZ = v;
  });
  panelFolder.add({
    'Copy as code': () => {
      const c = PANELS[selectedIndex];
      const g = panelsGroup.children[selectedIndex];
      const line = `  { file: '${c.file}', pos: [${g.position.x.toFixed(2).padStart(5)}, ${g.position.y.toFixed(2).padStart(5)}, ${g.position.z.toFixed(2).padStart(5)}], rotY: ${g.rotation.y.toFixed(3).padStart(6)}, rotX: ${g.rotation.x.toFixed(3).padStart(6)}, rotZ: ${g.rotation.z.toFixed(3).padStart(6)}, scale: ${c.scale} },`;
      navigator.clipboard.writeText(line);
      console.log('[copied]', line);
    }
  }, 'Copy as code');
  panelFolder.add({
    'Deselect (resume float)': () => { selectedIndex = -1; editMode = false; rebuildGUI(); }
  }, 'Deselect (resume float)');
  panelFolder.open();
}

function pickFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(panelsGroup.children, true);
  if (hits.length === 0) return -1;
  let g = hits[0].object;
  while (g.parent && g.parent !== panelsGroup) g = g.parent;
  return panelsGroup.children.indexOf(g);
}

// Distinguish click from drag — only pick if the mouse hasn't moved much
let downPos = null;
canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  downPos = null;
  if (Math.hypot(dx, dy) > 4) return;
  const idx = pickFromEvent(e);
  if (idx >= 0) {
    selectedIndex = idx;
    editMode = true;
    rebuildGUI();
  }
});

// ─── Subtle float animation (paused while editing or on Space) ───
const clock = new THREE.Clock();
let paused = true;  // start paused — Space to start motion

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (!editMode && !paused) {
    panelsGroup.children.forEach((g, i) => {
      const phase = i * 1.3;
      g.position.y = PANELS[i].pos[1] + Math.sin(t * 0.5 + phase) * 0.08;
      // keep rotation.z as baseline so GUI doesn't jitter when re-selected
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

let uiHidden = false;
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
    controls.autoRotate = !paused;
  } else if (e.code === 'KeyR') {
    camera.position.copy(DEFAULT_CAM);
    controls.target.set(0, 0, 0);
    controls.update();
  } else if (e.code === 'KeyH') {
    uiHidden = !uiHidden;
    document.querySelector('.overlay').classList.toggle('hidden', uiHidden);
    document.querySelector('.brand').classList.toggle('hidden', uiHidden);
    if (uiHidden) gui.hide(); else gui.show();
  }
});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
