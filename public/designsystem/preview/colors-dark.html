<link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.sw{width:92px;height:92px;border-radius:var(--radius-s);padding:8px 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;font-weight:700;}
.sw .nm{color:var(--text-main);mix-blend-mode:difference;}
.sw .hx{color:var(--text-main);mix-blend-mode:difference;opacity:.8;font-weight:600;}
</style></head><body><div class="card"><div class="row">
<div class="sw" style="background:#121212"><span class="nm">bg</span><span class="hx">#121212</span></div>
<div class="sw" style="background:#1A1A1A"><span class="nm">surface-1</span><span class="hx">#1A1A1A</span></div>
<div class="sw" style="background:#202020"><span class="nm">surface-2</span><span class="hx">#202020</span></div>
<div class="sw" style="background:#262626"><span class="nm">divider</span><span class="hx">#262626</span></div>
<div class="sw" style="background:#404040"><span class="nm">surface-3</span><span class="hx">#404040</span></div>
<div class="sw" style="background:#3b82f6;color:#fff"><span style="color:#fff">primary</span><span style="color:#fff;opacity:.85;font-weight:600">#3B82F6</span></div>
</div></div></body></html>
