name: Agent Refactor Format Once

on:
  push:
    branches:
      - agent/quality-hardening-no-ui-changes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/quality-hardening-no-ui-changes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Separate app-shell and bootstrap asset cache identities
        run: |
          python - <<'PY'
          from pathlib import Path

          service_worker_path = Path('browser/service-worker.ts')
          service_worker = service_worker_path.read_text()
          old_key = "const BOOTSTRAP_CACHE_KEY = `./bootstrap.js?cache=${CACHE_VERSION}`;"
          new_key = "const BOOTSTRAP_CACHE_KEY = './bootstrap.js?cache=v449';"
          if old_key in service_worker:
              service_worker = service_worker.replace(old_key, new_key, 1)
          elif new_key not in service_worker:
              raise SystemExit('service-worker bootstrap cache key contract changed')
          service_worker_path.write_text(service_worker)

          claim_test_path = Path('src/pro-room/__tests__/claim-bootstrap.test.ts')
          claim_test = claim_test_path.read_text()
          old_block = '''  it('keeps the self-hosted scrubber ahead of app code and removes the static analytics tag', () => {
              const bootstrapSource = `/bootstrap.js?cache=${SERVICE_WORKER_CACHE_VERSION}`;
              const bootstrapIndex = INDEX_SOURCE.indexOf(`<script src="${bootstrapSource}"></script>`);
              const appIndex = INDEX_SOURCE.indexOf('<script type="module" src="/src/app.ts"></script>');

              expect(SERVICE_WORKER_CACHE_VERSION).toMatch(/^v\\d+$/);
              expect(bootstrapIndex).toBeGreaterThan(-1);
              expect(bootstrapIndex).toBeLessThan(appIndex);
              expect(SERVICE_WORKER_SOURCE).toContain(
                'const BOOTSTRAP_CACHE_KEY = `./bootstrap.js?cache=${CACHE_VERSION}`;',
              );
              expect(SERVICE_WORKER_SOURCE).toContain('BOOTSTRAP_CACHE_KEY,');
              expect(INDEX_SOURCE).not.toContain(`src="${ANALYTICS_SRC}"`);
            });'''
          new_block = '''  it('keeps the self-hosted scrubber ahead of app code and removes the static analytics tag', () => {
              const bootstrapMatch = INDEX_SOURCE.match(
                /<script src="\\/bootstrap\\.js\\?cache=(v\\d+)"><\\/script>/,
              );
              const bootstrapVersion = bootstrapMatch?.[1] ?? null;
              const bootstrapSource = bootstrapVersion
                ? `/bootstrap.js?cache=${bootstrapVersion}`
                : '';
              const bootstrapIndex = INDEX_SOURCE.indexOf(`<script src="${bootstrapSource}"></script>`);
              const appIndex = INDEX_SOURCE.indexOf('<script type="module" src="/src/app.ts"></script>');

              expect(SERVICE_WORKER_CACHE_VERSION).toMatch(/^v\\d+$/);
              expect(bootstrapVersion).toMatch(/^v\\d+$/);
              expect(bootstrapIndex).toBeGreaterThan(-1);
              expect(bootstrapIndex).toBeLessThan(appIndex);
              expect(SERVICE_WORKER_SOURCE).toContain(
                `const BOOTSTRAP_CACHE_KEY = './bootstrap.js?cache=${bootstrapVersion}';`,
              );
              expect(SERVICE_WORKER_SOURCE).toContain('BOOTSTRAP_CACHE_KEY,');
              expect(INDEX_SOURCE).not.toContain(`src="${ANALYTICS_SRC}"`);
            });'''
          if old_block in claim_test:
              claim_test = claim_test.replace(old_block, new_block, 1)
          elif new_block not in claim_test:
              raise SystemExit('claim bootstrap cache assertion contract changed')
          claim_test_path.write_text(claim_test)
          PY

      - name: Format authored sources
        run: npm run format

      - name: Remove one-shot formatter workflow
        run: rm .github/workflows/agent-refactor-format-once.yml

      - name: Commit formatted refactor
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: format refactor and separate cache identities"
          git push origin HEAD:agent/quality-hardening-no-ui-changes
