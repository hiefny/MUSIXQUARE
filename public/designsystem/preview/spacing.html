<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:20px 24px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{background:var(--primary);border-radius:4px;}
.lab{font-size:10px;font-weight:700;color:var(--text-sub);letter-spacing:0.08em;}
</style></head><body><div class="card">
<div class="unit"><div class="bar" style="width:4px;height:4px"></div><div class="lab">4</div></div>
<div class="unit"><div class="bar" style="width:8px;height:8px"></div><div class="lab">8</div></div>
<div class="unit"><div class="bar" style="width:12px;height:12px"></div><div class="lab">12</div></div>
<div class="unit"><div class="bar" style="width:16px;height:16px"></div><div class="lab">16</div></div>
<div class="unit"><div class="bar" style="width:24px;height:24px"></div><div class="lab">24</div></div>
<div class="unit"><div class="bar" style="width:32px;height:32px"></div><div class="lab">32</div></div>
<div class="unit"><div class="bar" style="width:40px;height:40px"></div><div class="lab">40</div></div>
<div class="unit"><div class="bar" style="width:56px;height:56px"></div><div class="lab">56</div></div>
</div></body></html>
