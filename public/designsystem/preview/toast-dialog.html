<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:#1f1f1f;color:var(--text-main);font-family:var(--font-sans);}
.card{padding:24px;position:relative;min-height:140px;}
.toast{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#000;padding:14px 28px;border-radius:100px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-block;}
.dialog{background:var(--surface-1);border-radius:20px;padding:20px 22px;max-width:280px;margin-top:14px;}
.dtitle{font-size:16px;font-weight:800;margin-bottom:6px;}
.dmsg{font-size:13px;color:var(--text-sub);font-weight:500;margin-bottom:14px;}
.drow{display:flex;gap:8px;justify-content:flex-end;}
.db{height:34px;padding:0 14px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;}
.db.ghost{background:var(--surface-2);color:var(--text-main);}
.db.prim{background:var(--primary);color:#fff;}
</style></head><body><div class="card">
<div class="toast">Invite code: 492815</div>
<div class="dialog">
  <div class="dtitle">Leave Session</div>
  <div class="dmsg">Return to the start screen? You'll be disconnected.</div>
  <div class="drow"><button class="db ghost">Stay</button><button class="db prim">Leave</button></div>
</div>
</div></body></html>
