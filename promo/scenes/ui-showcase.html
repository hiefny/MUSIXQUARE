<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">

<title>MUSIXQUARE – UI Showcase</title>
<style>
@font-face {
  font-family: "Pretendard";
  src: url("../../fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f8f9fa;
  --primary: #3b82f6;
  --primary-rgb: 59, 130, 246;
  --text-main: #212529;
  --text-sub: #495057;
}

body {
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

.promo-scene {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 1;
}

/* ─── Background blobs ─── */
.promo-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0;
  pointer-events: none;
}
.promo-blob-1 {
  width: 500px; height: 500px;
  background: rgba(59,130,246,0.10);
  top: -120px; right: -120px;
}
.promo-blob-2 {
  width: 400px; height: 400px;
  background: rgba(59,130,246,0.06);
  bottom: -100px; left: -100px;
}

/* ─── Logo + tagline area ─── */
#promo-top {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 3;
  white-space: nowrap;
}

.glow-bg {
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--primary-rgb), 0.15) 0%, transparent 70%);
  opacity: 0;
  pointer-events: none;
}

.note-icon-wrapper {
  margin-bottom: 48px;
  opacity: 0;
  transform: scale(0.5);
}
.note-icon { width: 96px; height: 96px; overflow: visible; }
/* Inside stroke: use clip-path to mask the outer half of the stroke */
.note-stroke {
  fill: none; stroke: var(--primary); stroke-width: 2.4;
  stroke-dasharray: 60; stroke-dashoffset: 60;
  stroke-linecap: round; stroke-linejoin: round; opacity: 0;
  clip-path: url(#note-clip);
}
.note-fill-path { fill: var(--primary); opacity: 0; }

.logo-welcome { height: 56px; fill: var(--text-main); display: block; }
.logo-welcome > .wg { opacity: 0; }
.wl.wlr  { clip-path: inset(0 100% 0 0); }
.wl.wrl  { clip-path: inset(0 0 0 100%); }
.wl.wtb  { clip-path: inset(0 0 100% 0); }
.wl.wbt  { clip-path: inset(100% 0 0 0); }
.wl.wdiag { clip-path: inset(0 100% 100% 0); }

/* Tagline: large, same visual weight as MUSIXQUARE logo */
#promo-tagline {
  font-size: 60px;
  font-weight: 800;
  color: var(--text-main);
  margin-top: 20px;
  letter-spacing: -0.8px;
  opacity: 0;
  text-align: center;
  line-height: 1.35;
  white-space: normal;
  max-width: 600px;
}

/* ─── Phone frame ─── */
.promo-phone-wrap {
  position: absolute;
  width: 375px; height: 812px;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -48%) scale(1.55);
  z-index: 2;
  opacity: 0;
}

.promo-phone {
  width: 375px; height: 812px;
  border-radius: 0; overflow: hidden;
  position: relative; background: #fff;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.10),
    0 4px 16px rgba(0,0,0,0.05);
}

.promo-phone iframe {
  width: 375px; height: 812px;
  border: none; display: block;
}
</style>
</head>

<script>
const iframe = document.getElementById('app-frame');
let appDoc = null;
window.appReady = false;

function tryInit() {
  try {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    if (!doc || !doc.body || doc.body.children.length < 5) return false;
    appDoc = doc;
    setupApp();
    window.appReady = true;
    return true;
  } catch(e) { return false; }
}
if (!tryInit()) {
  iframe.addEventListener('load', () => tryInit());
  const poll = setInterval(() => { if (tryInit()) clearInterval(poll); }, 200);
}

// ─── Easing ───
function smooth(t) { return 1 - Math.pow(1 - t, 4.5); }
function ease(t)   { return 1 - Math.pow(1 - t, 2.5); }

// ─── Logo animation data ───
const wlData = [];
document.querySelectorAll('.wl').forEach(el => {
  const style = el.style;
  const wt = parseFloat(style.getPropertyValue('--wt')) || 0;
  const wd = parseFloat(style.getPropertyValue('--wd')) || 150;
  let dir = 'wlr';
  if (el.classList.contains('wrl'))  dir = 'wrl';
  if (el.classList.contains('wtb'))  dir = 'wtb';
  if (el.classList.contains('wbt'))  dir = 'wbt';
  if (el.classList.contains('wdiag')) dir = 'wdiag';
  wlData.push({ el, wt, wd, dir });
});

function setClipPath(el, dir, progress) {
  const p = ease(progress);
  const remain = (1 - p) * 100;
  switch (dir) {
    case 'wlr':  el.style.clipPath = `inset(0 ${remain}% 0 0)`; break;
    case 'wrl':  el.style.clipPath = `inset(0 0 0 ${remain}%)`; break;
    case 'wtb':  el.style.clipPath = `inset(0 0 ${remain}% 0)`; break;
    case 'wbt':  el.style.clipPath = `inset(${remain}% 0 0 0)`; break;
    case 'wdiag': el.style.clipPath = `inset(0 ${remain}% ${remain}% 0)`; break;
  }
}

// ─── Cached refs ───
const revealEls = {};
let currentTab = 'play';
let currentSetupSection = '';

// (taglineEntries moved after timeline constants)

// ─── Setup ───
function setupApp() {
  if (!appDoc) return;

  const fouc = appDoc.getElementById('fouc-guard');
  if (fouc) fouc.remove();
  appDoc.documentElement.setAttribute('data-theme', 'light');

  const overlay = appDoc.getElementById('setup-overlay');
  if (overlay) { overlay.style.display = 'flex'; overlay.style.opacity = '1'; overlay.classList.add('active'); }

  ['setup-code-area','setup-join-area','setup-role-area'].forEach(id => {
    const el = appDoc.getElementById(id);
    if (el) el.style.display = 'none';
  });
  const setupWelcome = appDoc.getElementById('setup-welcome-area');
  if (setupWelcome) { setupWelcome.style.display = 'flex'; setupWelcome.style.flexDirection = 'column'; setupWelcome.style.flex = '1'; }

  // Activate first slider slide so content is visible (CSS: .ob-slide children have opacity:0, .ob-slide.active makes them opacity:1)
  // Also force inline opacity since CSS transitions are cancelled by Playwright
  const allSlides = appDoc.querySelectorAll('.ob-slide');
  if (allSlides.length > 0) {
    allSlides[0].classList.add('active');
    allSlides[0].querySelectorAll('.ob-title, .ob-desc, .ob-icon-circle').forEach(el => el.style.opacity = '1');
  }

  const setupCodeInput = appDoc.getElementById('setup-code');
  if (setupCodeInput) setupCodeInput.value = '482937';

  // Setup action buttons — VERTICAL layout matching real mobile app (ob-actions.vertical)
  const setupActions = appDoc.getElementById('setup-actions');
  if (setupActions) {
    setupActions.classList.add('vertical');
    setupActions.innerHTML = `
      <button class="btn-ob-primary" id="btn-setup-host">제가 방장할래요</button>
      <button class="btn-ob-secondary" id="btn-setup-guest">모임에 참여할래요</button>
    `;
  }

  // HOST badge — blue
  const roleBadge = appDoc.getElementById('role-badge');
  if (roleBadge) {
    const roleText = appDoc.getElementById('role-text');
    const roleDot = roleBadge.querySelector('.role-dot');
    if (roleText) roleText.textContent = 'HOST';
    if (roleDot) roleDot.style.background = '#ffffff';
    roleBadge.style.background = '#3b82f6';
    roleBadge.style.color = '#ffffff';
    roleBadge.classList.add('connected');
    if (roleText) roleText.style.color = '#ffffff';
  }

  // Track info
  const tt = appDoc.getElementById('track-title');
  if (tt) tt.textContent = 'Sunset Boulevard';
  const ta = appDoc.getElementById('track-artist');
  if (ta) ta.textContent = 'Luna & The Stars';
  const ss = appDoc.getElementById('seek-slider');
  if (ss) { ss.max = '225'; ss.value = '83'; }
  const tc = appDoc.getElementById('time-curr');
  if (tc) tc.textContent = '1:23';
  const td = appDoc.getElementById('time-dur');
  if (td) td.textContent = '3:45';
  const vs = appDoc.getElementById('volume-slider');
  if (vs) vs.value = '80';

  // Playlist
  const pul = appDoc.getElementById('playlist-ui');
  if (pul) {
    pul.innerHTML = '';
    [
      { name: 'Sunset Boulevard', active: true },
      { name: 'Midnight in Seoul', active: false },
      { name: 'Ocean Drive (feat. Luna)', active: false },
      { name: 'Golden Hour', active: false },
    ].forEach((t, i) => {
      const li = appDoc.createElement('li');
      li.className = 'track-item' + (t.active ? ' active' : '');
      li.innerHTML = `<span class="track-idx">${i+1}</span><div class="track-name"><span class="track-name-text">${t.name}</span></div>${t.active ? '<div class="playing-indicator" style="display:flex; margin-left:auto; flex-shrink:0;"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>':''}`;
      li.style.opacity = '0';
      li.style.transform = 'translateY(16px)';
      pul.appendChild(li);
    });
  }

  // Mobile settings: show general + audio panels stacked
  appDoc.querySelectorAll('.settings-subtab-panel').forEach(p => {
    const panel = p.dataset.panel;
    if (panel === 'general' || panel === 'audio') {
      p.style.display = 'block';
    } else {
      p.style.display = 'none';
    }
  });

  appDoc.querySelectorAll('.invite-code-value').forEach(el => el.textContent = '482937');
  const dt = appDoc.getElementById('connect-device-title');
  if (dt) dt.textContent = '연결된 기기 2대';

  const cd = appDoc.getElementById('chat-drawer');
  if (cd) cd.style.display = 'none';

  // i18n
  const i18nMap = {
    'nav.home':'메인','nav.playlist':'재생목록','nav.connect':'연결',
    'nav.settings':'설정','nav.help':'도움말',
    'chat.start':'채팅을 시작하세요',
    'common.sync':'동기화','player.play_media':'미디어 재생',
    'settings.invite_code':'초대 코드',
    'connect.qr_title':'QR 코드로 참가',

    'settings.subtab.connect':'연결','settings.subtab.help':'도움말',
    'settings.language':'언어','settings.theme':'테마',
    'settings.theme_light':'라이트',
    'settings.battery_saving':'배터리 절약 모드',
    'settings.speaker_role':'스피커 역할',
    'settings.speaker_role_stereo':'스테레오',
    'settings.reverb':'리버브','settings.reverb_none':'없음',
    'settings.visualizer':'비주얼라이저','settings.eq':'이퀄라이저',
    'player.visualizer':'비주얼라이저',
    'setup.hello_select_role':'안녕하세요! 본인의 역할을 선택해주세요.',
    'setup.last_step':'마지막 단계!',

    'setup.enter_code_connect':'이 코드를 다른 기기에 입력해주세요',
    'setup.enter_host_code':'방장이 알려준 6자리 코드를 입력해주세요',
    'setup.what_sound':'어떤 소리를 맡을까요?',

    'help.local_recommended':'로컬 네트워크 권장',

  appDoc.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18nMap[key]) el.textContent = i18nMap[key];
  });

function switchTab(tabName, force) {
  if (!appDoc) return;
  if (tabName === currentTab && !force) return;
  currentTab = tabName;
  appDoc.querySelectorAll('.tab-content').forEach(t => {
    t.classList.remove('active'); t.style.display = 'none';
    t.style.opacity = '0'; t.style.transform = 'translateX(0)';
  });
  const target = appDoc.getElementById('tab-' + tabName);
  if (target) {
    target.style.display = ''; target.classList.add('active');
    if (force) { target.style.opacity = '1'; target.style.transform = 'translateX(0)'; }
    if (!force && (tabName === 'connect' || tabName === 'settings' || tabName === 'guide')) {
      target.querySelectorAll('.tab-header, .section-group, .help-block').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(22px)';
      });
    }
    // Settings: reset scroll to top on tab switch
    if (tabName === 'settings') {
      const tabBody = target.querySelector('.tab-body');
      if (tabBody) tabBody.scrollTop = 0;
    }
  }
  const navMap = {play:'nav-play',playlist:'nav-playlist',connect:'nav-connect',settings:'nav-settings',guide:'nav-guide'};
  appDoc.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nEl = appDoc.getElementById(navMap[tabName]);
  if (nEl) nEl.classList.add('active');
}

function showSetupSection(sectionName) {
  if (!appDoc) return;
  if (currentSetupSection === sectionName) return;
  currentSetupSection = sectionName;
  ['setup-welcome-area','setup-code-area','setup-join-area','setup-role-area'].forEach(id => {
    const el = appDoc.getElementById(id);

window.__promoSetTime = function(ms) {
  const promoTop = document.getElementById('promo-top');
  const phone = document.getElementById('promo-phone-wrap');
  const blob1 = document.querySelector('.promo-blob-1');
  const blob2 = document.querySelector('.promo-blob-2');
  const noteWrapper = document.getElementById('note-wrapper');
  const noteStroke = document.getElementById('note-stroke');
  const noteFill = document.getElementById('note-fill');
  const ghost = document.querySelector('.wg');
  const tagline = document.getElementById('promo-tagline');
  const logoSvg = document.getElementById('logo-svg');
  const glow = document.getElementById('glow');

  // ═══ PHASE A: Logo (0-5s) — Note + MUSIXQUARE appear simultaneously ═══
  if (ms < TRANSITION_START) {
    if (promoTop) {
      promoTop.style.left = '50%';
      promoTop.style.top = '50%';
      promoTop.style.transform = 'translate(-50%, -50%) scale(1)';
      promoTop.style.opacity = '1';
    }
    if (phone) phone.style.opacity = '0';
    if (logoSvg) logoSvg.style.opacity = '1';

    // Note icon — appear + scale
    if (ms >= NOTE_APPEAR) {
      const p = Math.min((ms - NOTE_APPEAR) / 400, 1);
      const ep = smooth(p);
      noteWrapper.style.opacity = String(ep);
      noteWrapper.style.transform = `scale(${0.5 + 0.5 * ep})`;
    }
    // Note stroke draw (inside stroke via clip-path)
    if (ms >= NOTE_DRAW_START) {
      const p = Math.min((ms - NOTE_DRAW_START) / (NOTE_DRAW_END - NOTE_DRAW_START), 1);
      noteStroke.style.strokeDashoffset = String(60 * (1 - smooth(p)));
      noteStroke.style.opacity = '1';
    }
    // Note fill
    if (ms >= NOTE_FILL_START) {
      const p = Math.min((ms - NOTE_FILL_START) / (NOTE_FILL_END - NOTE_FILL_START), 1);
      noteFill.style.opacity = String(p);
    }
    // Ghost letters
    if (ms >= GHOST_TIME && ghost) {
      ghost.style.opacity = String(0.15 * Math.min((ms - GHOST_TIME) / 300, 1));
    }
    // Logo clip-path writing — starts at 400ms (simultaneous with note draw)
    wlData.forEach(({ el, wt, wd, dir }) => {
      const st = LOGO_WRITE_START + wt;
      if (ms < st) return;
      setClipPath(el, dir, Math.min((ms - st) / wd, 1));
    });
    // No tagline during Phase A (removed "함께 완성하는 서라운드 사운드")
    tagline.style.opacity = '0';
    if (ms >= GLOW_START) {
      const p = Math.min((ms - GLOW_START) / 1200, 1);
      const pulse = Math.sin(p * Math.PI);
      glow.style.opacity = String(pulse * 0.8);
      glow.style.transform = `scale(${0.8 + pulse * 0.3})`;
    }
    return;
  }

  // ═══ PHASE B: Transition (5-7s) — logo fades out in place, tagline appears at top ═══
  if (ms < TRANSITION_END) {
    const t = (ms - TRANSITION_START) / (TRANSITION_END - TRANSITION_START);
    const ep = smooth(t);

    if (promoTop) {
      // First half: logo fades out at center
      // Second half: promoTop jumps to top position for tagline
      if (t < 0.5) {
        promoTop.style.top = '50%';
        promoTop.style.transform = 'translate(-50%, -50%) scale(1)';
        const fadeOut = smooth(t / 0.5);
        promoTop.style.opacity = String(1 - fadeOut);
      } else {
        promoTop.style.top = '7%';
        promoTop.style.transform = 'translate(-50%, -50%) scale(1)';
        promoTop.style.opacity = '1';
      }
    }

    // Fade out everything: note, glow, logo
    const fadeOutP = smooth(Math.min(t / 0.4, 1));
    noteWrapper.style.opacity = String(1 - fadeOutP);
    glow.style.opacity = '0';
    if (logoSvg) logoSvg.style.opacity = String(1 - fadeOutP);

    // After fade out, show tagline at top position
    if (t >= 0.5) {
      if (logoSvg) logoSvg.style.opacity = '0';
      tagline.textContent = taglineEntries[0].text;
      const fadeIn = smooth((t - 0.5) / 0.5);
      tagline.style.opacity = String(fadeIn);
      tagline.style.transform = `translateY(${10 * (1 - fadeIn)}px)`;
    } else {
      tagline.style.opacity = '0';
    }

    if (phone) phone.style.opacity = String(smooth(Math.max(0, (t - 0.3) / 0.7)));
    if (blob1) blob1.style.opacity = String(ep * 0.7);
    if (blob2) blob2.style.opacity = String(ep * 0.5);
    return;
  }

  // ═══ PHASE C-I: After transition (7s+) ═══
  if (promoTop) {
    promoTop.style.top = '7%';
    promoTop.style.transform = 'translate(-50%, -50%) scale(1)';
    promoTop.style.opacity = '1';
  }
  if (logoSvg) logoSvg.style.opacity = '0';
  noteWrapper.style.opacity = '0';
  if (phone) phone.style.opacity = '1';
  if (blob1) blob1.style.opacity = '0.7';
  if (blob2) blob2.style.opacity = '0.5';

  // ── Dynamic tagline ──
  const FADE_DUR = 500;
  let activeTagline = null;
  for (const entry of taglineEntries) {
    if (ms >= entry.start && ms < entry.end) { activeTagline = entry; break; }
  }
  if (activeTagline) {
    tagline.textContent = activeTagline.text;
    const fadeInP = Math.min((ms - activeTagline.start) / FADE_DUR, 1);
    const timeToEnd = activeTagline.end - ms;
    const fadeOutP = timeToEnd < FADE_DUR ? timeToEnd / FADE_DUR : 1;
    const opacity = Math.min(smooth(fadeInP), fadeOutP);
    tagline.style.opacity = String(opacity);
    tagline.style.transform = `translateY(${14 * (1 - smooth(fadeInP))}px)`;
  } else {
    tagline.style.opacity = '0';
  }

  if (!window.appReady || !appDoc) return;

  // ═══ Phase C: Setup overlay (7-13s) ═══
  const overlay = appDoc.getElementById('setup-overlay');
  if (ms < 13000) {
    if (overlay) {
      overlay.classList.add('promo-visible', 'active');
      overlay.classList.remove('promo-hidden');
      if (ms > 12500) {
        overlay.style.opacity = String(1 - smooth((ms - 12500) / 500));
      } else {
        overlay.style.opacity = '';
      }
    }
    // Welcome → Role → Code (matching real app flow) with slide transitions
    const SETUP_TRANS = 500; // transition duration
    const setupPhases = [
      { start: 7000, end: 9200, section: 'setup-welcome-area' },
      { start: 9200, end: 11000, section: 'setup-role-area' },
      { start: 11000, end: 13000, section: 'setup-code-area' },
    ];
    for (const sp of setupPhases) {
      if (ms >= sp.start && ms < sp.end) {
        showSetupSection(sp.section);
        const el = appDoc.getElementById(sp.section);
        if (el) {
          // Fade-in at start of this phase
          const fadeIn = Math.min((ms - sp.start) / SETUP_TRANS, 1);
          const ep = smooth(fadeIn);
          el.style.opacity = String(ep);
          el.style.transform = `translateX(${20 * (1 - ep)}px)`;
          // Fade-out at end of this phase (if not the last before overlay disappears)
          const timeToEnd = sp.end - ms;
          if (timeToEnd < SETUP_TRANS && sp.section !== 'setup-code-area') {
            const fadeOut = timeToEnd / SETUP_TRANS;
            el.style.opacity = String(fadeOut);
          }
        }
        break;
      }
    }
    // Cycle welcome slides: slide 1 (7-8.2s), slide 2 (8.2-9.2s)
    {
      const slides = appDoc.querySelectorAll('.ob-slide');
      const track = appDoc.getElementById('ob-slider-track');
      if (slides.length > 0 && track) {
        const activateSlide = (idx) => {
          slides.forEach((s, i) => {
            if (i === idx) {
              s.classList.add('active');
              s.querySelectorAll('.ob-title, .ob-desc, .ob-icon-circle').forEach(el => el.style.opacity = '1');
            } else {
              s.classList.remove('active');
              s.querySelectorAll('.ob-title, .ob-desc, .ob-icon-circle').forEach(el => el.style.opacity = '0');
            }
          });
          const dots = appDoc.querySelectorAll('.ob-dot');
          dots.forEach((d, i) => i === idx ? d.classList.add('active') : d.classList.remove('active'));
        };
        if (ms <= 8200) {
          activateSlide(0);
          track.style.transform = 'translateX(0)';
        } else if (ms > 8200 && ms < 9200) {
          activateSlide(1);
          track.style.transform = 'translateX(-100%)';
        }
      }
    }
    return;
  }

  if (overlay) {
    overlay.classList.remove('promo-visible', 'active');
    overlay.classList.add('promo-hidden');
  }

  // ═══ Visualizer ═══
  if (ms >= D_START + 700 && ms < D_FADEOUT + FADEOUT_DUR) {
    const canvas = appDoc.getElementById('visualizerCanvas');
    if (canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = 2;
      if (canvas.width !== rect.width * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
      }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(dpr, dpr);
      const cx = rect.width / 2, cy = rect.height / 2;
      const t = (ms - D_START - 700) / 1000;
      const bassPulse = Math.sin(t * 1.8) * 0.12 + Math.sin(t * 3.1) * 0.06 + Math.sin(t * 0.7) * 0.04;
      const highPulse = Math.sin(t * 2.5) * 0.10 + Math.sin(t * 4.7) * 0.08;
      const scale = rect.width / 200;
      const bassR = (70 + bassPulse * 80) * scale;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(bassR, cx * 0.88), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(59, 130, 246, 0.40)';
      ctx.fill();
      const highR = (45 + highPulse * 55) * scale;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(highR, cx * 0.60), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(96, 165, 250, 0.50)';
      ctx.fill();
      ctx.restore();
    }
  }

  // ═══ Fade-out previous tab before switching ═══
  const fadeouts = [
    { start: D_FADEOUT, dur: FADEOUT_DUR, tab: 'play' },
    { start: E_FADEOUT, dur: FADEOUT_DUR, tab: 'playlist' },
    { start: F_FADEOUT, dur: FADEOUT_DUR, tab: 'connect' },
    { start: G_FADEOUT, dur: FADEOUT_DUR, tab: 'settings' },
  ];
  for (const fo of fadeouts) {
    if (ms >= fo.start && ms < fo.start + fo.dur) {
      const tabEl = appDoc.getElementById('tab-' + fo.tab);
      if (tabEl) {
        const p = smooth((ms - fo.start) / fo.dur);
        tabEl.style.opacity = String(1 - p);
        tabEl.style.transform = `translateX(${-16 * p}px)`;
      }
    }
  }

  // ═══ Phase D-I: Tab content reveals ═══
  for (const e of appEntries) {
    if (ms < e.t) continue;
    const progress = Math.min((ms - e.t) / e.dur, 1);
    const ep = smooth(progress);

    if (e.type === 'reveal') {
      const el = revealEls[e.sel];
      if (el) {
        el.style.opacity = String(ep);
        const dist = e.fromTop ? -30 : 20;
        el.style.transform = `translateY(${dist * (1 - ep)}px)`;
      }
    }
    else if (e.type === 'reveal-track') {
      const items = appDoc.querySelectorAll('.track-item');
      const el = items[e.idx];
      if (el) {
        el.style.opacity = String(ep);
        el.style.transform = `translateY(${18 * (1 - ep)}px)`;
      }
    }
    else if (e.type === 'reveal-el') {
      const parentEl = appDoc.getElementById(e.parent);
      if (parentEl) {
        let el;
        if (typeof e.nth === 'number') {
          el = parentEl.querySelectorAll(e.sel)[e.nth];
        } else {
          el = parentEl.querySelector(e.sel);
        }
        if (el) {
          el.style.opacity = String(ep);
          el.style.transform = `translateY(${20 * (1 - ep)}px)`;
        }
      }
    }
    else if (e.type === 'tab') {
      if (!e._switched) { switchTab(e.tab); e._switched = true; }
      const tabEl = appDoc.getElementById('tab-' + e.tab);
      if (tabEl) {
        tabEl.style.opacity = String(ep);
        tabEl.style.transform = `translateX(${24 * (1 - ep)}px)`;
      }
    }
  }

  // Settings: smooth scroll down to audio section
  if (currentTab === 'settings' && ms >= G_SCROLL_START && ms < G_SCROLL_END) {
    const tabBody = appDoc.querySelector('#tab-settings .tab-body');
    const audioPanel = appDoc.querySelector('.settings-subtab-panel[data-panel="audio"]');
    if (audioPanel && tabBody) {
      const targetScroll = audioPanel.offsetTop - tabBody.offsetTop;
      const scrollProgress = smooth(Math.min((ms - G_SCROLL_START) / (G_SCROLL_END - G_SCROLL_START), 1));
      tabBody.scrollTop = targetScroll * scrollProgress;
    }
  }

  // ═══ Playing indicator (equalizer bars) animation ═══
  // Animate when playlist tab is visible (or play tab with active track)
  const playingBars = appDoc.querySelectorAll('.playing-indicator .bar');
  if (playingBars.length > 0) {
    const t = ms / 1000;
    // Three bars with different sine wave frequencies for organic feel
    const heights = [
      0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 4.2)),
      0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 5.7 + 1.2)),
      0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 3.8 + 2.5)),
    ];
    playingBars.forEach((bar, i) => {
      bar.style.height = `${heights[i] * 100}%`;
      bar.style.animation = 'none';
    });
  }
};

// Auto-play
const params = new URLSearchParams(location.search);
if (params.get('autoplay') === 'true') {
  const waitForReady = setInterval(() => {
    if (window.appReady) {
      clearInterval(waitForReady);
      let startTime = performance.now();
      (function loop() {
        const elapsed = performance.now() - startTime;
        window.__promoSetTime(elapsed);
        if (elapsed < 50000) requestAnimationFrame(loop);
      })();
    }
  }, 100);
}
</script>
