        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.signaling.toml --json \
            > release-artifacts/deployments/signaling-before.json
          node scripts/release-deployment-state.mts prepare signaling

      - name: Deploy and record signaling Worker
        timeout-minutes: 15
        id: signaling_deployment
        if: inputs.target == 'all' || inputs.target == 'signaling'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$RELEASE_TARGET" != 'all' ]]; then
            node scripts/release-deployment-state.mts compatibility-recheck "$RELEASE_TARGET" "$GITHUB_SHA"
          fi
          node scripts/release-deployment-state.mts \
            preflight signaling release-artifacts/recovery-checkpoint
          node scripts/release-deployment-state.mts attempt signaling
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.signaling.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.signaling.toml --json \
            > release-artifacts/deployments/signaling.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mts record signaling
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mts version signaling)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke signaling Worker
        if: inputs.target == 'all' || inputs.target == 'signaling'
        timeout-minutes: 5
        env:
          MXQR_EXPECTED_SIGNALING_VERSION: ${{ steps.signaling_deployment.outputs.version_id }}
        run: npm run smoke:live:signaling

      # CI exercises the browser signed-PUT CORS/XHR leg without production
      # secrets. Keep the host assertion itself strict and live here, after
      # both assertion-owning Workers have been deployed.
      - name: Smoke Remote Share host assertion path
        if: inputs.target == 'all' || inputs.target == 'signaling'
        timeout-minutes: 5
        env:
          MXQR_EXPECTED_REMOTE_SHARE_VERSION: ${{ steps.remote_share_deployment.outputs.version_id }}
          MXQR_EXPECTED_SIGNALING_VERSION: ${{ steps.signaling_deployment.outputs.version_id }}
        run: npm run smoke:live:remote-share -- --require-assertion

      - name: Record current Developer API facade deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api-facade.toml --json \
            > release-artifacts/deployments/developer-api-facade-before.json
          node scripts/release-deployment-state.mts prepare developer-api-facade

      - name: Deploy and record Developer API facade Worker
        timeout-minutes: 15
        id: developer_api_facade_deployment
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$RELEASE_TARGET" != 'all' ]]; then
            node scripts/release-deployment-state.mts compatibility-recheck "$RELEASE_TARGET" "$GITHUB_SHA"
          fi
          node scripts/release-deployment-state.mts \
            preflight developer-api-facade release-artifacts/recovery-checkpoint
          node scripts/release-deployment-state.mts attempt developer-api-facade
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.developer-api-facade.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api-facade.toml --json \
            > release-artifacts/deployments/developer-api-facade.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mts record developer-api-facade
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mts version developer-api-facade)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Record current Developer API deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        run: |
          node scripts/release-deployment-state.mts prepare developer-api

      - name: Apply Developer API base schema
        timeout-minutes: 10
        if: inputs.apply_developer_api_d1 && (inputs.target == 'all' || inputs.target == 'developer-api')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npm run developer-api:schema:remote

      - name: Deploy and record Developer API Worker
        timeout-minutes: 15
        id: developer_api_deployment
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$RELEASE_TARGET" != 'all' ]]; then
            node scripts/release-deployment-state.mts compatibility-recheck "$RELEASE_TARGET" "$GITHUB_SHA"
          fi
          node scripts/release-deployment-state.mts \
            preflight developer-api release-artifacts/recovery-checkpoint
          node scripts/release-deployment-state.mts attempt developer-api
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.developer-api.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api.toml --json \
            > release-artifacts/deployments/developer-api.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mts record developer-api
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mts version developer-api)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke Developer API Worker
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        timeout-minutes: 10
        env:
          MXQR_DEVELOPER_API_SMOKE_KEY: ${{ secrets.MXQR_DEVELOPER_API_SMOKE_KEY }}
          MXQR_DEVELOPER_API_SMOKE_ROOM: '000001'
          MXQR_EXPECTED_DEVELOPER_API_VERSION: ${{ steps.developer_api_deployment.outputs.version_id }}
          MXQR_EXPECTED_DEVELOPER_API_FACADE_VERSION: ${{ steps.developer_api_facade_deployment.outputs.version_id }}
        run: npm run smoke:live:developer-api

      - name: Record current app deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'app'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.app.toml --json \
            > release-artifacts/deployments/app-before.json
          node scripts/release-deployment-state.mts prepare app

      - name: Deploy and record app Worker with immutable dist
        timeout-minutes: 15
        if: inputs.target == 'all' || inputs.target == 'app'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$RELEASE_TARGET" != 'all' ]]; then
            node scripts/release-deployment-state.mts compatibility-recheck "$RELEASE_TARGET" "$GITHUB_SHA"
          fi
          node scripts/release-deployment-state.mts \
            preflight app release-artifacts/recovery-checkpoint
          node scripts/release-deployment-state.mts attempt app
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.app.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.app.toml --json \
            > release-artifacts/deployments/app.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mts record app
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          exit "$record_exit"

      - name: Smoke app generation endpoint
        if: inputs.target == 'all' || inputs.target == 'app'
        timeout-minutes: 5
        run: npm run smoke:live:app-generation

      - name: Smoke anonymous app account boundary
        if: inputs.target == 'all' || inputs.target == 'app'
        timeout-minutes: 5
        run: npm run smoke:live:app-public-boundary

      - name: Smoke current PRO public boundary after app deployment
        if: inputs.target == 'all' || inputs.target == 'app'
        timeout-minutes: 8
        run: npm run smoke:live:pro-room

      - name: Verify release still owns current production deployments
        timeout-minutes: 10
        id: final_verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-deployment-state.mts verify-current

      - name: Restore PRO room generation readiness
        timeout-minutes: 10
        id: pro_room_generation_cutover
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'ready', release_sha = '${{ github.sha }}', updated_at = unixepoch() * 1000 WHERE contract_version = 1 AND ever_enabled = 1 AND floor_release_sha IS NOT NULL; SELECT contract_version, status, release_sha, ever_enabled, floor_release_sha, ever_enabled AS generation_floor FROM mxqr_pro_room_generation_cutover WHERE contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mts \
                release-artifacts/deployments/pro-room-generation-cutover-ready.json
          node scripts/pro-room-generation-cutover.mts verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-ready.json \
            ready \
            "${{ github.sha }}"

      - name: Mark coherent production candidate committed
        id: production_commit
        if: success()
        shell: bash
        run: |
          echo 'committed=true' >> "$GITHUB_OUTPUT"
          printf '{"schemaVersion":1,"commit":"%s","target":"%s"}\n' \
            "$GITHUB_SHA" "$RELEASE_TARGET" \
            > release-artifacts/recovery-checkpoint/production-committed.json

      - name: Persist coherent production commit marker
        if: steps.production_commit.outputs.committed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-commit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/recovery-checkpoint/production-committed.json
          if-no-files-found: error
          retention-days: 90

      - name: Assess R2 recovery constraints before Worker rollback
        timeout-minutes: 5
        id: r2_policy_assessment
        if: >-
          (failure() || cancelled()) &&
          steps.mutation_authorization.outputs.authorized == 'true' &&
          steps.production_commit.outputs.committed != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node scripts/release-r2-policy-state.mts \
            assess release-artifacts/recovery-checkpoint
          forward_targets="$(
            node scripts/release-r2-policy-state.mts \
              targets release-artifacts/recovery-checkpoint
          )"
          echo "forward_targets=${forward_targets}" >> "$GITHUB_OUTPUT"

      - name: Disable PRO room generation cutover before failed-release rollback
        timeout-minutes: 10
        id: pro_room_generation_cutover_disable
        if: >-
          (failure() || cancelled()) &&
          steps.mutation_authorization.outputs.authorized == 'true' &&
          steps.production_commit.outputs.committed != 'true' &&
          inputs.target == 'all'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          mkdir -p release-artifacts/deployments
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'disabled', release_sha = NULL, updated_at = unixepoch() * 1000 WHERE contract_version = 1; SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mts \
                release-artifacts/deployments/pro-room-generation-cutover-disabled.json
          node scripts/pro-room-generation-cutover.mts verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-disabled.json \
            disabled
          node scripts/pro-room-generation-cutover.mts cutover-outputs \
            release-artifacts/deployments/pro-room-generation-cutover-disabled.json \
            >> "$GITHUB_OUTPUT"

      - name: Assess captured Worker compatibility floors before failed-release rollback
        timeout-minutes: 10
        id: worker_floor_assessment
        if: >-
          (failure() || cancelled()) &&
          steps.mutation_authorization.outputs.authorized == 'true' &&
          steps.production_commit.outputs.committed != 'true' &&
          inputs.target != 'remote-share'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          mkdir -p release-artifacts/deployments
          floor_file='release-artifacts/recovery-checkpoint/worker-floor-current-live.json'
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor, CASE WHEN EXISTS (SELECT 1 FROM mxqr_pro_grant_audit WHERE actor_id = 'system:entitlement-backfill' AND action = 'entitlement.backfill' AND result = 'complete') THEN 1 ELSE 0 END AS entitlement_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mts "$floor_file"
          node scripts/release-worker-floor-state.mts \
            assess release-artifacts/recovery-checkpoint "$floor_file" \
            release-artifacts/recovery-checkpoint
          forward_targets="$(node scripts/release-worker-floor-state.mts targets release-artifacts/recovery-checkpoint)"
          echo "forward_targets=${forward_targets}" >> "$GITHUB_OUTPUT"

      - name: Restore release-owned Workers after a failed release
        timeout-minutes: 20
        id: worker_rollback
        if: >-
          (failure() || cancelled()) &&
          steps.mutation_authorization.outputs.authorized == 'true' &&
          steps.production_commit.outputs.committed != 'true'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          service_control_forward_floor="$(
            node scripts/release-deployment-state.mts \
              service-control-forward-floor "$GITHUB_SHA" release-artifacts/recovery-checkpoint
          )"
          remote_share_forward_floor="$(
            node scripts/release-deployment-state.mts \
              remote-share-forward-floor "$GITHUB_SHA" release-artifacts/recovery-checkpoint
          )"
          pro_system_audio_forward_floor="$(
            node scripts/release-deployment-state.mts \
              pro-system-audio-forward-floor "$GITHUB_SHA" release-artifacts/recovery-checkpoint
          )"
          standard_room_pin_forward_floor="$(
            node scripts/release-deployment-state.mts \
              standard-room-pin-forward-floor "$GITHUB_SHA" release-artifacts/recovery-checkpoint
          )"
          rollback_skip_targets="$(
            MXQR_R2_POLICY_OUTCOME="${{ steps.r2_policy_assessment.outcome }}" \
            MXQR_R2_FORWARD_TARGETS="${{ steps.r2_policy_assessment.outputs.forward_targets }}" \
            MXQR_GENERATION_FENCE_OUTCOME="${{ steps.pro_room_generation_cutover_disable.outcome }}" \
            MXQR_WORKER_FLOOR_OUTCOME="${{ steps.worker_floor_assessment.outcome }}" \
            MXQR_WORKER_FLOOR_TARGETS="${{ steps.worker_floor_assessment.outputs.forward_targets }}" \
            MXQR_APPLY_DEVELOPER_API_D1="${{ inputs.apply_developer_api_d1 }}" \
            MXQR_SERVICE_CONTROL_FORWARD_FLOOR="$service_control_forward_floor" \
            MXQR_REMOTE_SHARE_FORWARD_FLOOR="$remote_share_forward_floor" \
            MXQR_PRO_SYSTEM_AUDIO_FORWARD_FLOOR="$pro_system_audio_forward_floor" \
            MXQR_STANDARD_ROOM_PIN_FORWARD_FLOOR="$standard_room_pin_forward_floor" \
            node scripts/release-recovery-plan.mts
          )"
          echo "skipped_targets=${rollback_skip_targets}" >> "$GITHUB_OUTPUT"
          MXQR_ROLLBACK_SKIP_TARGETS="$rollback_skip_targets" \
            node scripts/release-deployment-state.mts \
              rollback release-artifacts/recovery-checkpoint
      - name: Reconcile R2 policy with the exact recovered Worker boundary
        timeout-minutes: 10
        id: r2_policy_reconciliation
        if: >-
          (failure() || cancelled()) &&
          steps.mutation_authorization.outputs.authorized == 'true' &&
          steps.production_commit.outputs.committed != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node scripts/release-r2-policy-state.mts \
            reconcile \
            release-artifacts/recovery-checkpoint \
            release-artifacts/recovery-checkpoint

      - name: Freshly verify the paired R2 and Worker recovery boundary
        timeout-minutes: 10
        id: paired_recovery_verification
        if: >-
          (failure() || cancelled()) &&
          steps.mutation_authorization.outputs.authorized == 'true' &&
          steps.production_commit.outputs.committed != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node scripts/release-r2-policy-state.mts \
            verify-paired-recovery \
            release-artifacts/recovery-checkpoint \
            release-artifacts/recovery-checkpoint

      - name: Freshly verify Worker compatibility floors
        timeout-minutes: 10
        id: worker_floor_verification
        if: >-
          (failure() || cancelled()) &&
          steps.mutation_authorization.outputs.authorized == 'true' &&
          steps.production_commit.outputs.committed != 'true' &&
          inputs.target != 'remote-share'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          floor_file='release-artifacts/recovery-checkpoint/worker-floor-final-live.json'
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor, CASE WHEN EXISTS (SELECT 1 FROM mxqr_pro_grant_audit WHERE actor_id = 'system:entitlement-backfill' AND action = 'entitlement.backfill' AND result = 'complete') THEN 1 ELSE 0 END AS entitlement_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mts "$floor_file"
          node scripts/release-worker-floor-state.mts \
            verify release-artifacts/recovery-checkpoint "$floor_file" \
            release-artifacts/recovery-checkpoint

      - name: Upload deployment records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-deployments-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-artifacts/deployments/
            release-artifacts/recovery-checkpoint/
          if-no-files-found: warn
          retention-days: 90

      - name: Release summary
        if: always()
        run: |
          wrangler_version="$(node scripts/print-wrangler-version.mts)"
          echo "### MUSIXQUARE production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Wrangler: \`${wrangler_version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: \`${RELEASE_VALIDATION_PROFILE}\` (full E2E runs nightly and remains manually dispatchable)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate source: run \`${RELEASE_SOURCE_RUN_ID}\`, attempt \`${RELEASE_SOURCE_RUN_ATTEMPT}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- Developer API D1 changes requested: \`${{ inputs.apply_developer_api_d1 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PRO generation readiness restore: \`${{ steps.pro_room_generation_cutover.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery PRO generation fence: \`${{ steps.pro_room_generation_cutover_disable.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery Worker floor assessment: \`${{ steps.worker_floor_assessment.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final Worker floor verification: \`${{ steps.worker_floor_verification.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final production ownership verification: \`${{ steps.final_verification.outcome || 'not-run' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery Worker outcome: \`${{ steps.worker_rollback.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery paired R2 reconciliation: \`${{ steps.r2_policy_reconciliation.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fresh paired recovery verification: \`${{ steps.paired_recovery_verification.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery compatibility floor: \`${{ steps.worker_rollback.outputs.skipped_targets || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare deployment records are attached to this run." >> "$GITHUB_STEP_SUMMARY"
          node scripts/release-deployment-state.mts \
            summary release-artifacts/recovery-checkpoint

      - name: Fail release when automatic recovery is incomplete
        if: >-
          always() &&
          (steps.r2_policy_assessment.outcome == 'failure' ||
           steps.r2_policy_assessment.outcome == 'cancelled' ||
           steps.pro_room_generation_cutover_disable.outcome == 'failure' ||
           steps.pro_room_generation_cutover_disable.outcome == 'cancelled' ||
           steps.worker_floor_assessment.outcome == 'failure' ||
           steps.worker_floor_assessment.outcome == 'cancelled' ||
           steps.worker_rollback.outcome == 'failure' ||
           steps.worker_rollback.outcome == 'cancelled' ||
           steps.r2_policy_reconciliation.outcome == 'failure' ||
           steps.r2_policy_reconciliation.outcome == 'cancelled' ||
           steps.worker_floor_verification.outcome == 'failure' ||
           steps.worker_floor_verification.outcome == 'cancelled' ||
           steps.paired_recovery_verification.outcome == 'failure' ||
           steps.paired_recovery_verification.outcome == 'cancelled')
        run: |
          echo "::error::Automatic release recovery was incomplete. Inspect the rollback report before any manual action."
          exit 1

  recovery:
    name: Preserve failed-release recovery boundary
    needs: [validate, deploy]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.deploy.result != 'success' &&
      needs.deploy.outputs.mutation_authorized == 'true' &&
      needs.deploy.outputs.production_committed != 'true'
    uses: ./.github/workflows/release-recovery.yml
    with:
      target: ${{ inputs.target }}
      apply_developer_api_d1: ${{ inputs.apply_developer_api_d1 }}
      mutation_authorized: ${{ needs.deploy.outputs.mutation_authorized }}
    secrets: inherit
