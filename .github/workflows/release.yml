name: Production Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker scope to deploy
        required: true
        default: all
        type: choice
        options:
          - app
          - signaling
          - pro-room
          - developer-api
          - remote-share
          - all
      apply_developer_api_d1:
        description: Apply Developer API D1 schema and one-time migrations
        required: true
        default: false
        type: boolean
      apply_pro_room_generation_d1:
        description: Apply the forward-only admin/auth/Developer PRO generation migrations
        required: true
        default: false
        type: boolean
      enable_pro_room_generation_cutover:
        description: Enable reuse after automated D1/public checks and direct R2/signaling/limiter evidence
        required: true
        default: false
        type: boolean
      pro_room_generation_cutover_confirmation:
        description: Type DIRECTLY_VERIFIED_000002_000003 after direct R2/signaling/limiter checks
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: musixquare-production-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.111.0
  RELEASE_VALIDATION_PROFILE: core-smoke

jobs:
  validate:
    name: Validate release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Release validation must prove that this commit is covered by the
          # latest CACHE_VERSION bump, including a separate follow-up bump.
          fetch-depth: 0

      - name: Validate release options
        env:
          PRO_ROOM_GENERATION_CUTOVER_CONFIRMATION: ${{ inputs.pro_room_generation_cutover_confirmation }}
        run: |
          if [[ "${{ inputs.apply_developer_api_d1 }}" == "true" &&
                "${{ inputs.target }}" != "all" &&
                "${{ inputs.target }}" != "developer-api" ]]; then
            echo "::error::Developer API D1 changes require target 'developer-api' or 'all'."
            exit 1
          fi
          if [[ "${{ inputs.apply_pro_room_generation_d1 }}" == "true" &&
                "${{ inputs.target }}" != "all" ]]; then
            echo "::error::The first PRO room generation migration requires target 'all'."
            exit 1
          fi
          if [[ "${{ inputs.enable_pro_room_generation_cutover }}" == "true" &&
                ("${{ inputs.target }}" != "all" ||
                 "$PRO_ROOM_GENERATION_CUTOVER_CONFIRMATION" != "DIRECTLY_VERIFIED_000002_000003") ]]; then
            echo "::error::Generation cutover requires target 'all' plus direct R2, signaling, and limiter cleanup evidence for 000002/000003."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Release-candidate core smoke
        run: npm run test:e2e:release

      - name: Build and verify production bundle
        run: npm run build:checked

      - name: Record immutable release manifest
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: npm run release:manifest

      - name: Upload immutable production candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            release-artifacts/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          # The candidate is consumed by this same approved workflow run.
          # Deployment records below remain available for the long audit trail.
          retention-days: 3

  deploy:
    name: Deploy approved candidate
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://musixquare.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_MESSAGE: git:${{ github.sha }} run:${{ github.run_id }} target:${{ inputs.target }}
      RELEASE_ROLLBACK_MESSAGE: rollback:${{ github.sha }} run:${{ github.run_id }} attempt:${{ github.run_attempt }}
      RELEASE_TARGET: ${{ inputs.target }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          # The schema-intent fence compares this release with the immutable
          # SHA recorded on the previous deployment. Keep that commit object
          # available instead of failing closed on a shallow checkout.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install app smoke browser
        if: inputs.target == 'all' || inputs.target == 'app'
        run: npx playwright install --with-deps chromium

      - name: Download approved production candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Verify candidate hashes and commit
        run: npm run release:verify

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run --silent wrangler -- whoami

      - name: Probe PRO room generation migration state
        id: pro_room_generation_migration_plan
        if: inputs.target != 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          mkdir -p release-artifacts/deployments
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command="$(cat scripts/sql/pro-room-generation-admin-migration-state.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-admin-state.json
          npm run --silent wrangler -- d1 execute musixquare-auth \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command="$(cat scripts/sql/pro-room-generation-auth-migration-state.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-auth-state.json
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote --json --config cloudflare/wrangler.developer-api.toml \
            --command="$(cat scripts/sql/pro-room-generation-developer-migration-state.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-developer-state.json
          node scripts/pro-room-generation-cutover.mjs plan-migrations \
            release-artifacts/deployments/pro-room-generation-admin-state.json \
            release-artifacts/deployments/pro-room-generation-auth-state.json \
            release-artifacts/deployments/pro-room-generation-developer-state.json \
            >> "$GITHUB_OUTPUT"

      - name: Validate PRO room generation migration intent
        if: inputs.target != 'remote-share'
        shell: bash
        run: |
          if [[ ("${{ steps.pro_room_generation_migration_plan.outputs.admin }}" != "ready" ||
                 "${{ steps.pro_room_generation_migration_plan.outputs.auth }}" != "ready" ||
                 "${{ steps.pro_room_generation_migration_plan.outputs.developer }}" != "ready") &&
                "${{ inputs.apply_pro_room_generation_d1 }}" != "true" ]]; then
            echo "::error::PRO room generation schemas need forward completion. Re-run target 'all' with the reviewed generation migration enabled."
            exit 1
          fi

      - name: Apply admin PRO room generation migration
        if: >-
          inputs.apply_pro_room_generation_d1 &&
          steps.pro_room_generation_migration_plan.outputs.admin != 'ready'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          node scripts/pro-room-generation-cutover.mjs render-migration admin \
            release-artifacts/deployments/pro-room-generation-admin-state.json \
            cloudflare/admin-metrics.pro-room-generation.migration.sql \
            release-artifacts/deployments/pro-room-generation-admin-apply.sql
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --config cloudflare/wrangler.app.toml \
            --file release-artifacts/deployments/pro-room-generation-admin-apply.sql

      - name: Apply account PRO room generation migration
        if: >-
          inputs.apply_pro_room_generation_d1 &&
          steps.pro_room_generation_migration_plan.outputs.auth != 'ready'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          node scripts/pro-room-generation-cutover.mjs render-migration auth \
            release-artifacts/deployments/pro-room-generation-auth-state.json \
            cloudflare/auth.pro-room-generation.migration.sql \
            release-artifacts/deployments/pro-room-generation-auth-apply.sql
          npm run --silent wrangler -- d1 execute musixquare-auth \
            --remote --config cloudflare/wrangler.app.toml \
            --file release-artifacts/deployments/pro-room-generation-auth-apply.sql

      - name: Apply Developer API PRO room generation migration
        if: >-
          inputs.apply_pro_room_generation_d1 &&
          steps.pro_room_generation_migration_plan.outputs.developer != 'ready'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          node scripts/pro-room-generation-cutover.mjs render-migration developer \
            release-artifacts/deployments/pro-room-generation-developer-state.json \
            cloudflare/developer-api-room-generation.migration.sql \
            release-artifacts/deployments/pro-room-generation-developer-apply.sql
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote --config cloudflare/wrangler.developer-api.toml \
            --file release-artifacts/deployments/pro-room-generation-developer-apply.sql

      - name: Verify every PRO room generation schema
        if: inputs.target != 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command="$(cat scripts/sql/pro-room-generation-admin-readiness.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-admin-ready.json
          npm run --silent wrangler -- d1 execute musixquare-auth \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command="$(cat scripts/sql/pro-room-generation-auth-readiness.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-auth-ready.json
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote --json --config cloudflare/wrangler.developer-api.toml \
            --command="$(cat scripts/sql/pro-room-generation-developer-readiness.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-developer-ready.json
          node scripts/pro-room-generation-cutover.mjs verify-schema \
            release-artifacts/deployments/pro-room-generation-admin-ready.json \
            release-artifacts/deployments/pro-room-generation-auth-ready.json \
            release-artifacts/deployments/pro-room-generation-developer-ready.json

      - name: Verify a new generation migration remains disabled
        if: >-
          inputs.target != 'remote-share' &&
          (steps.pro_room_generation_migration_plan.outputs.admin != 'ready' ||
           steps.pro_room_generation_migration_plan.outputs.auth != 'ready' ||
           steps.pro_room_generation_migration_plan.outputs.developer != 'ready')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-before-workers.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-before-workers.json \
            disabled

      - name: Read PRO room generation cutover before dependency rollout
        id: pro_room_generation_cutover_before_rollout
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-before-rollout.json
          node scripts/pro-room-generation-cutover.mjs cutover-outputs \
            release-artifacts/deployments/pro-room-generation-cutover-before-rollout.json \
            >> "$GITHUB_OUTPUT"

      - name: Verify full release honors immutable PRO generation floor
        if: >-
          inputs.target == 'all' &&
          steps.pro_room_generation_cutover_before_rollout.outputs.generation_floor == 'true'
        shell: bash
        run: |
          floor_release_sha="${{ steps.pro_room_generation_cutover_before_rollout.outputs.floor_release_sha }}"
          if [[ ! "$floor_release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The immutable PRO generation floor is missing or malformed."
            exit 1
          fi
          if ! git cat-file -e "${floor_release_sha}^{commit}" 2>/dev/null; then
            echo "::error::The immutable PRO generation floor commit is unavailable in this checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$floor_release_sha" "${{ github.sha }}"; then
            echo "::error::This full release predates or diverges from the immutable PRO generation floor."
            exit 1
          fi

      - name: Fence room-code reuse during dependency rollout
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'disabled', release_sha = NULL, updated_at = unixepoch() * 1000 WHERE contract_version = 1; SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-rollout-fenced.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-rollout-fenced.json \
            disabled

      - name: Verify partial release dependency compatibility
        if: inputs.target != 'all'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-deployment-state.mjs compatibility "$RELEASE_TARGET" "${{ github.sha }}"

      - name: Verify Developer API D1 migration credentials
        if: inputs.apply_developer_api_d1 && (inputs.target == 'all' || inputs.target == 'developer-api')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote \
            --command "UPDATE mxqr_developer_api_keys SET updated_at = updated_at WHERE 0" \
            --config cloudflare/wrangler.developer-api.toml

      - name: Prepare deployment records
        run: mkdir -p release-artifacts/deployments

      - name: Record current Developer API deployment for schema intent
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api.toml --json \
            > release-artifacts/deployments/developer-api-before.json

      - name: Verify Developer API schema release intent
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        run: |
          node scripts/check-developer-api-schema-release.mjs \
            release-artifacts/deployments/developer-api-before.json \
            "${{ github.sha }}" \
            "${{ inputs.apply_developer_api_d1 || inputs.apply_pro_room_generation_d1 }}"

      - name: Establish rollback-safe remote-share quota migration bridge
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.remote-share.toml --json \
            > release-artifacts/deployments/remote-share-migration-current.json
          bridge_required="$(node scripts/release-deployment-state.mjs \
            remote-share-bridge-required \
            release-artifacts/deployments/remote-share-migration-current.json)"
          if [[ "$bridge_required" == "true" ]]; then
            # Cloudflare cannot roll back across a Durable Object lifecycle
            # migration. First deploy the new class with legacy LIST admission,
            # then record that compatible version as the active deploy's
            # rollback baseline below.
            npm run --silent wrangler -- deploy \
              --config cloudflare/wrangler.remote-share.toml \
              --var REMOTE_SHARE_ATOMIC_QUOTA_ENABLED:false \
              --message "$RELEASE_MESSAGE bridge:remote-share-quota-v3"
            npm run smoke:live:remote-share
          fi

      - name: Record current remote-share deployment
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.remote-share.toml --json \
            > release-artifacts/deployments/remote-share-before.json
          node scripts/release-deployment-state.mjs prepare remote-share

      - name: Deploy and record remote-share Worker
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight remote-share
          node scripts/release-deployment-state.mjs attempt remote-share
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.remote-share.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.remote-share.toml --json \
            > release-artifacts/deployments/remote-share.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record remote-share
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          exit "$record_exit"

      - name: Smoke remote-share Worker
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        timeout-minutes: 5
        run: npm run smoke:live:remote-share

      - name: Record current PRO room deployment
        if: inputs.target == 'all' || inputs.target == 'pro-room'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.pro-room.toml --json \
            > release-artifacts/deployments/pro-room-before.json
          node scripts/release-deployment-state.mjs prepare pro-room

      - name: Deploy and record PRO room Worker
        id: pro_room_deployment
        if: inputs.target == 'all' || inputs.target == 'pro-room'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight pro-room
          node scripts/release-deployment-state.mjs attempt pro-room
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.pro-room.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.pro-room.toml --json \
            > release-artifacts/deployments/pro-room.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record pro-room
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mjs version pro-room)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke PRO room Worker
        if: inputs.target == 'all' || inputs.target == 'pro-room'
        timeout-minutes: 5
        env:
          MXQR_EXPECTED_PRO_ROOM_VERSION: ${{ steps.pro_room_deployment.outputs.version_id }}
        run: npm run smoke:live:pro-room

      - name: Record current signaling deployment
        if: inputs.target == 'all' || inputs.target == 'signaling'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.signaling.toml --json \
            > release-artifacts/deployments/signaling-before.json
          node scripts/release-deployment-state.mjs prepare signaling

      - name: Deploy and record signaling Worker
        id: signaling_deployment
        if: inputs.target == 'all' || inputs.target == 'signaling'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight signaling
          node scripts/release-deployment-state.mjs attempt signaling
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.signaling.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.signaling.toml --json \
            > release-artifacts/deployments/signaling.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record signaling
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mjs version signaling)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke signaling Worker
        if: inputs.target == 'all' || inputs.target == 'signaling'
        timeout-minutes: 5
        env:
          MXQR_EXPECTED_SIGNALING_VERSION: ${{ steps.signaling_deployment.outputs.version_id }}
        run: npm run smoke:live:signaling

      - name: Record current Developer API facade deployment
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api-facade.toml --json \
            > release-artifacts/deployments/developer-api-facade-before.json
          node scripts/release-deployment-state.mjs prepare developer-api-facade

      - name: Deploy and record Developer API facade Worker
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight developer-api-facade
          node scripts/release-deployment-state.mjs attempt developer-api-facade
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.developer-api-facade.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api-facade.toml --json \
            > release-artifacts/deployments/developer-api-facade.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record developer-api-facade
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          exit "$record_exit"

      - name: Record current Developer API deployment
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        run: |
          node scripts/release-deployment-state.mjs prepare developer-api

      - name: Apply Developer API base schema
        if: inputs.apply_developer_api_d1 && (inputs.target == 'all' || inputs.target == 'developer-api')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npm run developer-api:schema:remote

      - name: Deploy and record Developer API Worker
        id: developer_api_deployment
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight developer-api
          node scripts/release-deployment-state.mjs attempt developer-api
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.developer-api.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api.toml --json \
            > release-artifacts/deployments/developer-api.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record developer-api
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mjs version developer-api)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Expand Developer API effects scopes
        id: developer_api_effects_scope_migration
        if: inputs.apply_developer_api_d1 && (inputs.target == 'all' || inputs.target == 'developer-api')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          MXQR_EFFECTS_SCOPE_RELEASE_JOURNAL: release-artifacts/deployments/developer-api-effects-scope.json
        run: npm run developer-api:effects-scopes:remote

      - name: Smoke Developer API Worker
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        timeout-minutes: 5
        env:
          MXQR_DEVELOPER_API_SMOKE_KEY: ${{ secrets.MXQR_DEVELOPER_API_SMOKE_KEY }}
          MXQR_DEVELOPER_API_SMOKE_ROOM: '000001'
          MXQR_EXPECTED_DEVELOPER_API_VERSION: ${{ steps.developer_api_deployment.outputs.version_id }}
        run: npm run smoke:live:developer-api

      - name: Verify current signaling contract before app-only release
        if: inputs.target == 'app'
        timeout-minutes: 5
        run: npm run smoke:live:signaling

      - name: Record current app deployment
        if: inputs.target == 'all' || inputs.target == 'app'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.app.toml --json \
            > release-artifacts/deployments/app-before.json
          node scripts/release-deployment-state.mjs prepare app

      - name: Deploy and record app Worker with immutable dist
        if: inputs.target == 'all' || inputs.target == 'app'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight app
          node scripts/release-deployment-state.mjs attempt app
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.app.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.app.toml --json \
            > release-artifacts/deployments/app.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record app
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          exit "$record_exit"

      - name: Smoke app session endpoint
        if: inputs.target == 'all' || inputs.target == 'app'
        timeout-minutes: 5
        run: npm run smoke:live:app-session

      - name: Verify release still owns current production deployments
        id: final_verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-deployment-state.mjs verify-current

      - name: Verify initial 000002 and 000003 deletion evidence
        if: >-
          inputs.target == 'all' &&
          inputs.enable_pro_room_generation_cutover &&
          steps.pro_room_generation_cutover_before_rollout.outputs.ever_enabled == 'false'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command="$(cat scripts/sql/pro-room-generation-admin-deletion-evidence.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-admin-deletion-evidence.json
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote --json --config cloudflare/wrangler.developer-api.toml \
            --command="$(cat scripts/sql/pro-room-generation-developer-deletion-evidence.sql)" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-developer-deletion-evidence.json
          node scripts/pro-room-generation-cutover.mjs probe-public-deletion \
            release-artifacts/deployments/pro-room-generation-public-deletion-evidence.json
          node scripts/pro-room-generation-cutover.mjs verify-initial-deletion \
            release-artifacts/deployments/pro-room-generation-admin-deletion-evidence.json \
            release-artifacts/deployments/pro-room-generation-developer-deletion-evidence.json \
            release-artifacts/deployments/pro-room-generation-public-deletion-evidence.json

      - name: Enable immutable PRO room generation cutover
        id: pro_room_generation_cutover
        if: >-
          inputs.target == 'all' &&
          (inputs.enable_pro_room_generation_cutover ||
           steps.pro_room_generation_cutover_before_rollout.outputs.was_ready == 'true')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'ready', release_sha = '${{ github.sha }}', ever_enabled = 1, floor_release_sha = COALESCE(floor_release_sha, '${{ github.sha }}'), updated_at = unixepoch() * 1000 WHERE contract_version = 1 AND (ever_enabled = 1 OR ((SELECT COUNT(*) FROM mxqr_pro_room_registry WHERE room_code IN ('000002', '000003') AND room_generation = 0 AND status = 'decommissioned') = 2 AND (SELECT COUNT(*) FROM mxqr_pro_room_generation_history WHERE room_code IN ('000002', '000003') AND room_generation = 0 AND status = 'decommissioned' AND decommissioned_at <= (unixepoch() * 1000) - 4200000) = 2 AND (SELECT COUNT(*) FROM mxqr_pro_room_generation_allocations WHERE room_code IN ('000002', '000003') AND room_generation = 0) = 2 AND NOT EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_code IN ('000002', '000003') AND room_generation <> 0) AND NOT EXISTS (SELECT 1 FROM mxqr_pro_room_registry AS registry JOIN mxqr_pro_room_generation_history AS history ON history.room_code = registry.room_code AND history.room_generation = registry.room_generation WHERE registry.room_code IN ('000002', '000003') AND (registry.updated_at < history.decommissioned_at OR registry.updated_at > unixepoch() * 1000)) AND (SELECT COUNT(DISTINCT audit.room_code) FROM mxqr_pro_room_admin_audit AS audit WHERE audit.room_code IN ('000002', '000003') AND audit.room_generation = 0 AND audit.action = 'room.delete' AND audit.result = 'authorized' AND EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history AS history WHERE history.room_code = audit.room_code AND history.room_generation = 0 AND audit.created_at <= history.decommissioned_at)) = 2 AND NOT EXISTS (SELECT 1 FROM mxqr_pro_room_admin_audit AS audit JOIN mxqr_pro_room_generation_history AS history ON history.room_code = audit.room_code AND history.room_generation = audit.room_generation WHERE audit.room_code IN ('000002', '000003') AND audit.room_generation = 0 AND audit.action = 'room.delete' AND audit.result = 'authorized' AND audit.created_at > history.decommissioned_at))); SELECT contract_version, status, release_sha, ever_enabled, floor_release_sha, ever_enabled AS generation_floor FROM mxqr_pro_room_generation_cutover WHERE contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-ready.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-ready.json \
            ready \
            "${{ github.sha }}"

      - name: Disable PRO room generation cutover before failed-release rollback
        id: pro_room_generation_cutover_disable
        if: (failure() || cancelled()) && inputs.target == 'all'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'disabled', release_sha = NULL, updated_at = unixepoch() * 1000 WHERE contract_version = 1; SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-disabled.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-disabled.json \
            disabled
          node scripts/pro-room-generation-cutover.mjs cutover-outputs \
            release-artifacts/deployments/pro-room-generation-cutover-disabled.json \
            >> "$GITHUB_OUTPUT"

      - name: Restore Developer API schema after a failed release
        id: schema_rollback
        if: (failure() || cancelled()) && inputs.apply_developer_api_d1
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          MXQR_EFFECTS_SCOPE_RELEASE_JOURNAL: release-artifacts/deployments/developer-api-effects-scope.json
        run: npm run developer-api:effects-scopes:release-rollback

      - name: Restore Worker deployments after a failed release
        id: worker_rollback
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rollback_skip_targets=""
          if [[ "${{ steps.schema_rollback.outcome }}" == "failure" || \
                "${{ steps.schema_rollback.outcome }}" == "cancelled" ]]; then
            # A pre-effects Developer API Worker rejects the 64/128 scope bits
            # that can remain when the D1 rollback is incomplete. Preserve the
            # schema-compatible public Worker while restoring every independent
            # target in the normal reverse order.
            rollback_skip_targets="developer-api"
          fi
          if [[ "${{ steps.pro_room_generation_cutover_disable.outcome }}" == "failure" ||
                "${{ steps.pro_room_generation_cutover_disable.outcome }}" == "cancelled" ]]; then
            # If the global reuse fence cannot be proven disabled, never restore
            # a potentially generation-blind dependency while a room code may
            # still advance. Independent remote-share recovery remains safe.
            rollback_skip_targets="${rollback_skip_targets},pro-room,signaling,developer-api-facade,developer-api,app"
          fi
          if [[ "${{ steps.pro_room_generation_cutover_disable.outputs.generation_floor }}" == "true" ]]; then
            # Once any later generation may have existed, rolling back to an
            # unproven generation-blind Worker is permanently forbidden. Keep
            # the current stack and repair forward.
            rollback_skip_targets="${rollback_skip_targets},pro-room,signaling,developer-api-facade,developer-api,app"
          fi

          MXQR_ROLLBACK_SKIP_TARGETS="$rollback_skip_targets" \
            node scripts/release-deployment-state.mjs rollback
          echo "skipped_targets=${rollback_skip_targets}" >> "$GITHUB_OUTPUT"

      - name: Upload deployment records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployments-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/deployments/
          if-no-files-found: warn
          retention-days: 90

      - name: Release summary
        if: always()
        run: |
          echo "### MUSIXQUARE production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Wrangler: \`${WRANGLER_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: \`${RELEASE_VALIDATION_PROFILE}\` (full E2E runs on manual dispatch)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Developer API D1 changes requested: \`${{ inputs.apply_developer_api_d1 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PRO generation D1 changes requested: \`${{ inputs.apply_pro_room_generation_d1 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PRO generation cutover requested: \`${{ inputs.enable_pro_room_generation_cutover }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PRO generation cutover: \`${{ steps.pro_room_generation_cutover.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery PRO generation fence: \`${{ steps.pro_room_generation_cutover_disable.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Developer API effects-scope schema changed: \`${{ steps.developer_api_effects_scope_migration.outputs.applied || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final production ownership verification: \`${{ steps.final_verification.outcome || 'not-run' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery schema outcome: \`${{ steps.schema_rollback.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery Worker outcome: \`${{ steps.worker_rollback.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery schema-compatibility fence: \`${{ steps.worker_rollback.outputs.skipped_targets || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare deployment records are attached to this run." >> "$GITHUB_STEP_SUMMARY"
          node scripts/release-deployment-state.mjs summary

      - name: Fail release when automatic recovery is incomplete
        if: >-
          always() &&
          (steps.pro_room_generation_cutover_disable.outcome == 'failure' ||
           steps.pro_room_generation_cutover_disable.outcome == 'cancelled' ||
           steps.schema_rollback.outcome == 'failure' ||
           steps.schema_rollback.outcome == 'cancelled' ||
           steps.worker_rollback.outcome == 'failure' ||
           steps.worker_rollback.outcome == 'cancelled')
        run: |
          echo "::error::Automatic release recovery was incomplete. Inspect the rollback report before any manual action."
          exit 1
