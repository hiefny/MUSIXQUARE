[build]
  command = "npm run build"
  publish = "dist"

# ─── Domain migration: mxqr.netlify.app → musixquare.com ───
# Explicit robots.txt exception for GSC over Netlify domain
[[redirects]]
  from = "https://mxqr.netlify.app/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# Exact root match
[[redirects]]
  from = "https://mxqr.netlify.app"
  to = "https://musixquare.com"
  status = 301
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app"
  to = "https://musixquare.com"
  status = 301
  force = true

# Wildcard match for all sub-pages
[[redirects]]
  from = "https://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

# SPA fallback: serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Security headers (all routes) ───
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; media-src 'self' blob:; connect-src 'self' wss: ws: https: blob:; frame-src https://www.youtube.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'"

# Cache hashed Vite assets aggressively (immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must not be cached
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
