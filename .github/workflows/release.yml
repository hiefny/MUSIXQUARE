              echo '::error::Developer API authority_epoch trigger is missing; rerun with apply_developer_api_d1 enabled.'
              exit 1
            fi
            npm run --silent wrangler -- d1 execute musixquare-developer-api \
              --remote --config cloudflare/wrangler.developer-api.toml \
              --command "CREATE TRIGGER IF NOT EXISTS trg_mxqr_developer_api_keys_authority_epoch_immutable BEFORE UPDATE OF authority_epoch ON mxqr_developer_api_keys WHEN NEW.authority_epoch <> OLD.authority_epoch BEGIN SELECT RAISE(ABORT, 'developer_api_key_authority_epoch_immutable'); END"
          elif [[ "$column_count" != '1' || "$trigger_count" != '1' ]]; then
            echo "::error::Unexpected Developer API authority epoch schema state: column=$column_count trigger=$trigger_count"
            exit 1
          fi

          verify_file='release-artifacts/deployments/developer-api-authority-epoch-verified.json'
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote --json --config cloudflare/wrangler.developer-api.toml \
            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('mxqr_developer_api_keys') WHERE name = 'authority_epoch' AND \"notnull\" = 1 AND dflt_value = '0') AS column_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'mxqr_developer_api_keys' AND instr(lower(sql), 'authority_epoch integer not null default 0 check (authority_epoch >= 0)') > 0) AS constraint_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name = 'trg_mxqr_developer_api_keys_authority_epoch_immutable' AND instr(lower(sql), 'new.authority_epoch <> old.authority_epoch') > 0) AS trigger_count, (SELECT COUNT(*) FROM mxqr_developer_api_keys WHERE authority_epoch < 0) AS invalid_epoch_count" \
            | node scripts/capture-wrangler-d1-json.mjs "$verify_file"
          jq -e '
            .[0].results[0]
            | (.column_count | tonumber) == 1
              and (.constraint_count | tonumber) == 1
              and (.trigger_count | tonumber) == 1
              and (.invalid_epoch_count | tonumber) == 0
          ' "$verify_file" >/dev/null || {
            echo '::error::The production Developer API authority-epoch contract is incomplete.'
            jq '.[0].results[0]' "$verify_file"
            exit 1
          }

      - name: Verify Developer API D1 migration credentials
