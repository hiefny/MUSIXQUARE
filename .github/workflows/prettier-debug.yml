name: Temporary Prettier Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: corepack npm ci
      - name: Print canonical formatting
        run: npx prettier e2e/production-live/large-room-r2.test.ts
