name: One-shot Release - Media Session v276

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: musixquare-one-shot-release-media-session-v276
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'ops: arm production app release v276')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FIX_COMMIT: 589023dc6d8805fd13945ffd2c0235f0c5a108ca
      CACHE_VERSION: v276
      RELEASE_PR: '29'

    steps:
      - name: Checkout exact validated main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate one-shot release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FIX_COMMIT"
          git merge-base --is-ancestor "$FIX_COMMIT" HEAD
          grep -F "const CACHE_VERSION = '$CACHE_VERSION';" public/service-worker.js
          grep -F "const ACTIVE_CACHE_VERSION = '$CACHE_VERSION';" src/core/__tests__/service-worker-cache.test.ts

      - name: Dispatch approved production app release
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run release.yml \
            --ref main \
            -f target=app \
            -f apply_developer_api_d1=false \
            -f apply_pro_room_generation_d1=false \
            -f enable_pro_room_generation_cutover=false

          run_id=''
          for _ in $(seq 1 45); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=main&per_page=30" > /tmp/release-runs.json
            run_id="$(jq -r --arg sha "$release_sha" --arg since "$dispatched_at" '
              [.workflow_runs[] |
                select(.head_sha == $sha and .event == "workflow_dispatch" and .created_at >= $since)] |
              sort_by(.created_at) | last | .id // empty
            ' /tmp/release-runs.json)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo '::error::The production workflow was dispatched but its run ID was not observed.'
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

          gh pr comment "$RELEASE_PR" --body "Production app release dispatched for \`$release_sha\` (service-worker \`$CACHE_VERSION\`). Actions run ID: \`$run_id\`."

      - name: Wait for production release completion
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
            conclusion="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "failure"')"
            gh pr comment "$RELEASE_PR" --body "Production app release \`$RUN_ID\` finished with \`$conclusion\`. The one-shot workflow stopped before live verification."
            exit 1
          fi

      - name: Verify service worker v276 is live
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RELEASE_SHA: ${{ steps.dispatch.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          live='false'
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "https://musixquare.com/service-worker.js?release=$RELEASE_SHA" \
              --output /tmp/live-service-worker.js && \
              grep -Fq "const CACHE_VERSION = '$CACHE_VERSION';" /tmp/live-service-worker.js; then
              live='true'
              break
            fi
            sleep 5
          done

          if [[ "$live" != 'true' ]]; then
            gh pr comment "$RELEASE_PR" --body "Production workflow \`$RUN_ID\` succeeded, but live service-worker \`$CACHE_VERSION\` was not observable within the verification window."
            exit 1
          fi

          gh pr comment "$RELEASE_PR" --body "Production release complete. Commit \`$RELEASE_SHA\` is live and \`service-worker.js\` reports \`$CACHE_VERSION\`. Actions run ID: \`$RUN_ID\`."
