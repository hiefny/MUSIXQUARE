            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('mxqr_developer_api_keys') WHERE name = 'authority_epoch') AS column_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name = 'trg_mxqr_developer_api_keys_authority_epoch_immutable') AS trigger_count" \
            | node scripts/capture-wrangler-d1-json.mjs "$probe_file"
          column_count="$(jq -er '.[0].results[0].column_count | tonumber' "$probe_file")"
          trigger_count="$(jq -er '.[0].results[0].trigger_count | tonumber' "$probe_file")"
          if [[ "$column_count" == '0' ]]; then
