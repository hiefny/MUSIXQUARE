<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .frame {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 22px 24px;
      }
      .button {
        display: flex;
        height: 56px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--text-main);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
      }
      .button.primary {
        background: var(--primary);
        color: #fff;
      }
      .button svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .fab {
        display: flex;
        width: 64px;
        height: 64px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 50%;
        background: var(--play-fab-bg-idle);
        color: var(--bg);
      }
      .fab:active {
        background: var(--play-fab-bg-active);
        transform: scale(0.92);
      }
      .fab svg {
        width: 28px;
        height: 28px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <button class="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
          /></svg
        >Sync
      </button>
      <button class="button primary">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.16-1.75 4.45-4H15V6h4V3h-7Z"
          /></svg
        >Add media
      </button>
      <button class="fab" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
      </button>
    </div>
  </body>
</html>
