<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:22px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 22px;border-radius:20px;background:var(--surface-2);color:var(--text-main);font-size:15px;font-weight:600;border:none;cursor:pointer;}
.btn:hover{background:var(--surface-3);transform:translateY(-2px);}
.btn svg{width:22px;height:22px;fill:currentColor;}
.fab{width:64px;height:64px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.fab svg{width:28px;height:28px;fill:currentColor;}
.pill{height:40px;padding:0 18px;border-radius:100px;background:var(--primary);color:#fff;border:none;font-weight:700;font-size:13px;letter-spacing:0.02em;cursor:pointer;}
</style></head><body><div class="card">
<button class="btn"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>Sync</button>
<button class="btn"><svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM9 8l7 4-7 4V8z"/></svg>Play media</button>
<button class="fab" aria-label="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<button class="pill">LIVE</button>
</div></body></html>
