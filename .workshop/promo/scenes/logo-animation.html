<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSIXQUARE – Logo Animation</title>
<style>
@font-face {
  font-family: "Pretendard";
  src: url("/fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f8f9fa;
  --primary: #3b82f6;
  --primary-rgb: 59, 130, 246;
  --text-main: #212529;
  --text-sub: #495057;
}

body {
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.scene {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.note-icon-wrapper {
  margin-bottom: 48px;
  opacity: 0;
  transform: scale(0.5);
}
.note-icon {
  width: 96px;
  height: 96px;
}
.note-stroke {
  fill: none;
  stroke: var(--primary);
  stroke-width: 1.2;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
}
.note-fill-path {
  fill: var(--primary);
  opacity: 0;
}

.logo-welcome {
  height: 56px;
  fill: var(--text-main);
  display: block;
}
.logo-welcome > .wg {
  opacity: 0;
}
/* JavaScript progressively reveals each clipped writing stroke. */
.wl.wlr  { clip-path: inset(0 100% 0 0); }
.wl.wrl  { clip-path: inset(0 0 0 100%); }
.wl.wtb  { clip-path: inset(0 0 100% 0); }
.wl.wbt  { clip-path: inset(100% 0 0 0); }
.wl.wdiag { clip-path: inset(0 100% 100% 0); }

.tagline {
  font-size: 22px;
  font-weight: 500;
  color: var(--text-sub);
  margin-top: 36px;
  letter-spacing: -0.3px;
  opacity: 0;
  transform: translateY(16px);
}

.feature-pills {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  opacity: 0;
  transform: translateY(16px);
}
.pill {
  padding: 8px 20px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 600;
  background: rgba(var(--primary-rgb), 0.08);
  color: var(--primary);
}
</style>
</head>
