<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MUSIXQUARE Logo Animation — 4K Render</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 3840px;
    height: 2160px;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo-svg {
    height: 240px;
    width: auto;
    display: block;
    overflow: visible;
    color: #fff;
    fill: currentColor;
  }

  /* Ghost underlay */
  .logo-svg > .wg { opacity: 0.15; animation: ghostIn 400ms 2500ms both; }

  /* Per-bar directional reveal */
  .logo-svg > .wl {
    animation-duration: var(--wd, 150ms);
    animation-timing-function: cubic-bezier(0.15, 0.5, 0.05, 1);
    animation-delay: calc(var(--wt, 0ms) + 500ms);
    animation-fill-mode: both;
  }
  .logo-svg > .wlr { animation-name: wlr; }
  .logo-svg > .wrl { animation-name: wrl; }
  .logo-svg > .wtb { animation-name: wtb; }
  .logo-svg > .wbt { animation-name: wbt; }
  .logo-svg > .wdiag { animation-name: wdiag; }

  @keyframes ghostIn { to { opacity: 1; } }
  @keyframes wlr { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wrl { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wtb { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wbt { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wdiag { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0 0 0 0); } }
</style>
</head>

<script>
// Click to replay animation
document.body.addEventListener('click', () => {
  const svg = document.querySelector('.logo-svg');
  const clone = svg.cloneNode(true);
  svg.parentNode.replaceChild(clone, svg);
});
