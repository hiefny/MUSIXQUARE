<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .frame {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 24px;
        padding: 22px 24px;
      }
      .sample {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
      }
      .shape {
        width: 72px;
        height: 72px;
        background: var(--surface-2);
      }
      .small {
        border-radius: 14px;
      }
      .medium {
        border-radius: 20px;
      }
      .large {
        border-radius: 32px;
      }
      .capsule {
        width: 132px;
        height: 48px;
        border-radius: 999px;
      }
      .label {
        color: var(--text-sub);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-align: center;
      }
      .policy {
        flex-basis: 100%;
        color: var(--text-sub);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="sample">
        <div class="shape small"></div>
        <div class="label">14px · compact frame</div>
      </div>
      <div class="sample">
        <div class="shape medium"></div>
        <div class="label">20px · choice card</div>
      </div>
      <div class="sample">
        <div class="shape large"></div>
        <div class="label">32px · media/dialog</div>
      </div>
      <div class="sample">
        <div class="shape capsule"></div>
        <div class="label">999px · controls/list rows</div>
      </div>
      <div class="policy">
        Buttons and list-like rows default to capsules. Choice cards, navigation tabs, media frames,
        and dialogs keep their structural geometry.
      </div>
    </div>
  </body>
</html>
