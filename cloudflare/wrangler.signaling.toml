name = "musixquare-signaling"
main = "signaling-worker.js"
compatibility_date = "2026-05-04"
workers_dev = false
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Required at deploy time and intentionally never committed. Both values must
# be random and at least 32 characters, and must match their named counterpart:
#   npm run wrangler -- secret put PRO_SIGNALING_SECRET --config cloudflare/wrangler.signaling.toml
#   npm run wrangler -- secret put MXQR_STANDARD_ROOM_ACCOUNT_ASSERTION_SECRET --config cloudflare/wrangler.signaling.toml

[[routes]]
pattern = "signal.musixquare.com"
custom_domain = true

[[durable_objects.bindings]]
name = "MUSIXQUARE_ROOMS"
class_name = "MusixquareRoom"

[[durable_objects.bindings]]
name = "MUSIXQUARE_SERVICE_CONTROL"
class_name = "MusixquareServiceControl"
script_name = "musixquare-pro-room"

# Private cross-script authority boundary for privileged PRO realtime frames.
# Signaling derives the room/participant/incarnation from its admitted socket;
# browsers cannot address this Durable Object binding directly.
[[durable_objects.bindings]]
name = "PRO_ROOM_AUTHORITY_ROOMS"
class_name = "MusixquareProRoom"
script_name = "musixquare-pro-room"

# Shared PRO-room registry used to resolve the current room generation.
[[d1_databases]]
binding = "MUSIXQUARE_ADMIN_DB"
database_name = "musixquare-admin-metrics"
database_id = "d6cc9ceb-f0b6-40e4-99aa-8f28bec412ed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MusixquareRoom"]
