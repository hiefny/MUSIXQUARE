name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: musixquare-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.114.0
  VITE_MUSIXQUARE_LEGACY_BOUNDED: '1'
  VITE_MUSIXQUARE_FILE_ENGINE_V2: '0'
  VITE_MUSIXQUARE_FILE_ENGINE_UNIVERSAL_V1: '0'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

  tests:
    name: Unit and critical coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

  candidate:
    name: Production app candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # build:checked locates the latest committed CACHE_VERSION bump.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for focused candidate smoke
        run: npx playwright install --with-deps chromium

      - name: Build and verify production bundle
        run: npm run build:checked

      - name: Exercise bounded V1 fallback candidate
        run: npm run test:e2e:legacy-bounded-production:dist

      - name: Record immutable main-CI app candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TARGET: app
          RELEASE_VALIDATION_PROFILE: main-ci
        run: npm run release:manifest

      - name: Upload immutable main-CI app candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-production-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            release-artifacts/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The full browser E2E suite remains manually dispatched in e2e.yml.
