name: Materialize Native YouTube Control v277

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: musixquare-materialize-native-control-v277
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/fix-iframe-native-media-control-v277'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/fix-iframe-native-media-control-v277
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize final source overlay
        shell: bash
        run: |
          set -euo pipefail
          cat <<'B64' | base64 --decode > /tmp/native-youtube-control-v277.tar.gz
          [... ELLIPSIZATION ...]
          B64
          tar -xzf /tmp/native-youtube-control-v277.tar.gz -C .
          rm -f \
            .github/agent-apply-native-youtube-control-v277 \
            .github/workflows/agent-apply-native-youtube-control-v277.yml \
            scripts/apply-native-youtube-control-v277.py \
            src/player/__tests__/media-session-os-authority.test.ts

      - name: Format source
        run: |
          npx prettier --write \
            src/player/media-session.ts \
            src/youtube/native-control-origin.ts \
            src/youtube/native-control-policy.ts \
            src/youtube/native-control-authority.ts \
            src/youtube/__tests__/native-control-origin.test.ts \
            src/youtube/__tests__/native-control-policy.test.ts \
            src/youtube/__tests__/native-control-authority.test.ts

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            .github/agent-apply-native-youtube-control-v277 \
            .github/workflows/agent-apply-native-youtube-control-v277.yml \
            .github/workflows/ci.yml \
            public/service-worker.js \
            scripts/apply-native-youtube-control-v277.py \
            src/core/__tests__/service-worker-cache.test.ts \
            src/player/__tests__/media-session-os-authority.test.ts \
            src/player/media-session.ts \
            src/youtube/__tests__/native-control-authority.test.ts \
            src/youtube/__tests__/native-control-origin.test.ts \
            src/youtube/__tests__/native-control-policy.test.ts \
            src/youtube/native-control-authority.ts \
            src/youtube/native-control-origin.ts \
            src/youtube/native-control-policy.ts | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Unexpected v277 working-tree scope'
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

      - name: Production build
        run: npm run build

      - name: Commit clean v277 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MUSIXQUARE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(youtube): promote iframe-native media controls'

      - name: Verify committed production bundle
        run: npm run build:checked

      - name: Push feature branch
        run: git push origin HEAD:agent/fix-iframe-native-media-control-v277
