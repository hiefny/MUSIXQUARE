<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .frame {
        display: grid;
        gap: 18px;
        padding: 20px 24px;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .label {
        width: 104px;
        color: var(--text-sub);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .icon {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 999px;
        color: var(--text-main);
      }
      .icon.primary {
        color: var(--primary);
      }
      .icon.youtube {
        color: #ff0033;
      }
      .icon svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .icon.stroke svg {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="group">
        <span class="label">Filled default</span>
        <span class="icon primary" title="Home">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.16-1.75 4.45-4H15V6h4V3h-7Z"
            />
          </svg>
        </span>
        <span class="icon" title="Playlist">
          <svg viewBox="0 0 24 24">
            <path
              d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"
            />
          </svg>
        </span>
        <span class="icon" title="Connect">
          <svg viewBox="0 0 24 24">
            <path
              d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"
            />
          </svg>
        </span>
        <span class="icon" title="Settings">
          <svg viewBox="0 -960 960 960">
            <path
              d="M433-80q-27 0-46.5-18T363-142l-9-66q-13-5-24.5-12T307-235l-62 26q-25 11-50 2t-39-32l-47-82q-14-23-8-49t27-43l53-40q-1-7-1-13.5v-27q0-6.5 1-13.5l-53-40q-21-17-27-43t8-49l47-82q14-23 39-32t50 2l62 26q11-8 23-15t24-12l9-66q4-26 23.5-44t46.5-18h94q27 0 46.5 18t23.5 44l9 66q13 5 24.5 12t22.5 15l62-26q25-11 50-2t39 32l47 82q14 23 8 49t-27 43l-53 40q1 7 1 13.5v27q0 6.5-2 13.5l53 40q21 17 27 43t-8 49l-48 82q-14 23-39 32t-50-2l-60-26q-11 8-23 15t-24 12l-9 66q-4 26-23.5 44T527-80h-94Zm7-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"
            />
          </svg>
        </span>
        <span class="icon" title="Help">
          <svg viewBox="0 0 24 24">
            <path
              d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"
            />
          </svg>
        </span>
        <span class="icon" title="Play"
          ><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg
        ></span>
        <span class="icon youtube" title="YouTube">
          <svg viewBox="0 0 24 24">
            <path
              d="M21.582 6.186a2.5 2.5 0 0 0-1.768-1.768C18.254 4 12 4 12 4s-6.254 0-7.814.418a2.5 2.5 0 0 0-1.768 1.768C2 7.746 2 12 2 12s0 4.254.418 5.814a2.5 2.5 0 0 0 1.768 1.768C5.746 20 12 20 12 20s6.254 0 7.814-.418a2.5 2.5 0 0 0 1.768-1.768C22 16.254 22 12 22 12s0-4.254-.418-5.814ZM10 15.464V8.536L16 12l-6 3.464Z"
            />
          </svg>
        </span>
      </div>
      <div class="group">
        <span class="label">Stroke exceptions</span>
        <span class="icon stroke" title="Language">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path
              d="M3.5 12h17M12 3c2.4 2.4 3.6 5.4 3.6 9S14.4 18.6 12 21M12 3c-2.4 2.4-3.6 5.4-3.6 9s1.2 6.6 3.6 9"
            />
          </svg>
        </span>
        <span class="icon stroke" title="Device">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="5" width="16" height="12" rx="2.5" />
            <path d="M9 20h6M12 17v3" />
          </svg>
        </span>
        <span class="icon stroke" title="Reorder">
          <svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14" /></svg>
        </span>
        <span class="icon stroke" title="Chevron">
          <svg viewBox="0 0 24 24"><path d="m6.5 9 5.5 5.5L17.5 9" /></svg>
        </span>
      </div>
    </div>
  </body>
</html>
