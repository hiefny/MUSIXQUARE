name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: musixquare-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Dependency security audit
        run: npm run security:audit

      - name: Verify dependency registry signatures
        run: npm run security:signatures

      - name: Worker syntax check
        run: npm run check:workers

      - name: Import graph integrity
        run: npm run guard:import-graph

      - name: Dead export detection
        run: npm run guard:dead-exports

      - name: EventBus producer-consumer pairing
        run: npm run guard:bus-pairing

      - name: Source complexity safety limits
        run: npm run guard:source-complexity

      - name: Standard-room security and latency policy
        run: npm run guard:standard-room-hot-path

      - name: Room authority compatibility boundary
        run: npm run guard:room-authority-boundaries

      - name: Storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

  tests:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - '1/2'
          - '2/2'

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Unit tests
        run: npm test -- --shard=${{ matrix.shard }}

  broad-coverage:
    name: Broad unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Broad unit coverage ratchet
        run: npm run test:coverage

  coverage:
    name: Critical runtime coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

  worker-coverage:
    name: Worker runtime coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Worker runtime coverage
        run: npm run test:coverage:workers

  release-tooling-coverage:
    name: Release tooling coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # D1 and Durable Object guards verify append-only first-parent history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Release and operations tooling coverage
        run: npm run test:coverage:tooling

  candidate:
    name: Production release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build:checked locates the latest committed CACHE_VERSION bump.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Build and verify production bundle
        run: npm run build:checked

      - name: Upload production bundle for browser verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Stable across GitHub's 30-day rerun window so a failed browser job
          # can reuse the successful candidate from the original attempt. A
          # full rerun replaces that run-scoped artifact with a fresh candidate.
          name: browser-production-candidate-${{ github.sha }}-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Bundle every production Worker without deploying
        run: npm run check:worker-bundles

      - name: Record immutable main-CI production candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TARGET: all
          RELEASE_VALIDATION_PROFILE: main-ci
        run: npm run release:manifest

      - name: Upload immutable main-CI production candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            release-artifacts/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          # Match GitHub's rerun window so a successful candidate job can be
          # reused when only a later failed browser job is rerun.
          retention-days: 30

  browser-gate:
    name: Critical browser gate
    needs: candidate
    runs-on: ubuntu-latest
    # The explicit 47-minute step budget leaves eight minutes for runner
    # transitions and cancellation cleanup.
    timeout-minutes: 55

    steps:
      - name: Checkout exact candidate
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        timeout-minutes: 8
        run: corepack npm ci

      - name: Install Chromium
        timeout-minutes: 7
        # Azure's Ubuntu mirrors occasionally take several minutes to deliver
        # Playwright's font dependencies. Bound setup independently so mirror
        # slowness cannot consume the browser-test timeout or hang indefinitely.
        run: npx playwright install --with-deps chromium

      - name: Download exact production candidate
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-production-candidate-${{ github.sha }}-${{ github.run_id }}
          path: dist

      - name: Run production candidate browser and Service Worker smoke
        timeout-minutes: 6
        # Six serial tests share this six-minute wall-clock budget, including
        # server startup and teardown. Individual tests retain their 60-second
        # bounds; failure or cancellation artifacts are uploaded below.
        run: npm run test:e2e:candidate

      # This deterministic gate covers PRO owner recovery, OAuth callback
      # scrubbing, an actual browser WebSocket session, and Remote Share's
      # signed-PUT CORS/XHR leg, plus mobile background-resume recovery. The
      # secret-backed host assertion remains the strict live smoke in
      # release.yml so CI never needs production secrets.
      - name: Run critical browser paths
        timeout-minutes: 12
        # This wall-clock budget includes the E2E rebuild, preview startup,
        # nine serial 60-second tests, one 90-second background-resume test,
        # and teardown. It bounds the entire step independently of those
        # per-test limits; failure or cancellation artifacts are uploaded below.
        run: npm run test:e2e:critical

      - name: Upload critical browser failure artifacts
        timeout-minutes: 5
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Full Chromium E2E and the targeted WebKit smoke run weekly and remain
      # manually dispatchable in e2e.yml.
