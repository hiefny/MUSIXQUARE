<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>MUSIXQUARE · E2E Report</title>
<style>
  /* ── MUSIXQUARE design tokens (mirrored from /designsystem) ─────── */
  :root {
    --bg:         #121212;
    --surface-1:  #1A1A1A;
    --surface-2:  #222222;
    --surface-3:  #404040;
    --divider:    #262626;

    --primary:    #3b82f6;
    --primary-rgb: 59, 130, 246;

    --text-main:  #eeeeee;
    --text-sub:   #a1a1aa;
    --text-muted: #71717a;

    --pass:       #4ade80;
    --fail:       #f87171;
    --skip:       #facc15;

    --radius-s: 14px;
    --radius-m: 20px;
    --radius-pill: 100px;

    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);

    --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas,
                 "Liberation Mono", monospace;
  }

  /* Optional: load Pretendard if available (file:// + http both OK). */
  @font-face {
    font-family: "Pretendard";
    src: url("../public/designsystem/fonts/PretendardVariable.woff2")
         format("woff2-variations");
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text-main);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    padding: var(--space-6) var(--space-5);
    max-width: 1100px;
    margin: 0 auto;
    line-height: 1.45;
  }

  /* ── Header ─────────────────────────────────────────────────────── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-4);
    padding-bottom: var(--space-5);
    border-bottom: 1px solid var(--divider);
    margin-bottom: var(--space-5);
  }
  .header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .header h1 .muted {
    color: var(--text-muted);
    font-weight: 600;
  }
  .badge {
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }
  .badge.waiting { color: var(--text-muted); border-color: var(--divider); }
  .badge.running { color: var(--primary); border-color: rgba(var(--primary-rgb), 0.4); }
  .badge.passed  { color: var(--pass);    border-color: rgba(74, 222, 128, 0.35); }
  .badge.failed  { color: var(--fail);    border-color: rgba(248, 113, 113, 0.4); }

  /* ── Stats grid ─────────────────────────────────────────────────── */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--space-3);
    margin-bottom: var(--space-5);
  }
  .stat {
    background: var(--surface-1);
    border-radius: var(--radius-s);
    padding: var(--space-4) var(--space-3);
    text-align: left;
  }
  .stat .num {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat .label {
    margin-top: var(--space-2);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .stat.pass .num { color: var(--pass); }
  .stat.fail .num { color: var(--fail); }
  .stat.skip .num { color: var(--skip); }
  .stat.time .num { font-size: 22px; color: var(--text-sub); }

  /* ── Progress ───────────────────────────────────────────────────── */
  .progress-wrap { margin-bottom: var(--space-5); }
  .progress-bar {
    display: flex;
    height: 4px;
    background: var(--surface-1);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .progress-fill { height: 100%; transition: width 0.3s var(--ease-out); }
  .progress-fill.pass { background: var(--pass); }
  .progress-fill.fail { background: var(--fail); }
  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-top: var(--space-2);
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .running-test {
    margin-top: var(--space-3);
    padding: var(--space-2) var(--space-3);
    background: rgba(var(--primary-rgb), 0.08);
    border-radius: var(--radius-s);
    font-size: 13px;
    color: var(--primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .running-test::before { content: "→ "; opacity: 0.7; }

  /* ── Filters ────────────────────────────────────────────────────── */
  .filters {
    display: flex;
    gap: var(--space-2);
    margin-bottom: var(--space-4);
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid transparent;
    background: var(--surface-1);
    color: var(--text-sub);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: color 0.2s var(--ease-out), background 0.2s var(--ease-out),
                border-color 0.2s var(--ease-out);
  }
  .filter-btn:hover { color: var(--text-main); }
  .filter-btn.active {
    background: rgba(var(--primary-rgb), 0.12);
    border-color: rgba(var(--primary-rgb), 0.5);
    color: var(--primary);
  }
  .filter-btn .count {
    margin-left: 6px;
    opacity: 0.7;
    font-variant-numeric: tabular-nums;
  }

  /* ── Test list ──────────────────────────────────────────────────── */
  .test-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .test-item {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    align-items: center;
    gap: var(--space-3);
    padding: 10px var(--space-3);
    background: var(--surface-1);
    border-radius: var(--radius-s);
    cursor: pointer;
    transition: background 0.15s var(--ease-out);
  }
  .test-item:hover { background: var(--surface-2); }
  .test-item.expanded {
    background: var(--surface-2);
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
  }
  .icon {
    font-size: 14px;
    line-height: 1;
    text-align: center;
    font-weight: 700;
  }
  .icon.pass { color: var(--pass); }
  .icon.fail { color: var(--fail); }
  .icon.skip { color: var(--skip); }
  .icon.pending { color: var(--text-muted); }
  .test-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
    font-weight: 500;
  }
  .test-name .file {
    color: var(--text-muted);
    font-size: 12px;
    margin-left: 8px;
    font-weight: 400;
  }
  .test-time {
    color: var(--text-muted);
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .error-detail {
    display: none;
    padding: var(--space-3) var(--space-4);
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--surface-2);
    border-bottom-left-radius: var(--radius-s);
    border-bottom-right-radius: var(--radius-s);
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--fail);
    max-height: 320px;
    overflow-y: auto;
    line-height: 1.55;
  }
  .error-detail.show { display: block; }

  /* ── Copy CTA ───────────────────────────────────────────────────── */
  .copy-section {
    margin-top: var(--space-6);
    display: flex;
    justify-content: center;
  }
  .copy-btn {
    padding: 12px 28px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(var(--primary-rgb), 0.5);
    background: rgba(var(--primary-rgb), 0.1);
    color: var(--primary);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.2s var(--ease-out), color 0.2s var(--ease-out),
                border-color 0.2s var(--ease-out);
  }
  .copy-btn:hover { background: rgba(var(--primary-rgb), 0.18); }
  .copy-btn.copied {
    background: rgba(74, 222, 128, 0.12);
    border-color: rgba(74, 222, 128, 0.5);
    color: var(--pass);
  }

  /* ── Empty state ────────────────────────────────────────────────── */
  .no-data {
    text-align: center;
    padding: 80px var(--space-5);
    color: var(--text-sub);
  }
  .no-data .heading {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
  }
  .no-data .sub {
    margin-top: var(--space-2);
    font-size: 13px;
    color: var(--text-muted);
  }
  .no-data code {
    display: inline-block;
    margin-top: var(--space-5);
    padding: 10px var(--space-4);
    background: var(--surface-1);
    border-radius: var(--radius-s);
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--primary);
    user-select: all;
  }

  /* ── Responsive ─────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    body { padding: var(--space-5) var(--space-4); }
    .header { flex-wrap: wrap; }
    .header h1 { font-size: 20px; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .stat .num { font-size: 22px; }
    .stat.time .num { font-size: 18px; }
  }

  /* ── Reduced motion ─────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="header">
  <h1>MUSIXQUARE <span class="muted">· E2E Report</span></h1>
  <div id="badge" class="badge waiting">Waiting</div>
</header>

<section class="stats" aria-label="Test summary">
  <div class="stat total"><div id="s-total" class="num">0</div><div class="label">Total</div></div>
  <div class="stat pass"><div id="s-pass" class="num">0</div><div class="label">Passed</div></div>
  <div class="stat fail"><div id="s-fail" class="num">0</div><div class="label">Failed</div></div>
  <div class="stat skip"><div id="s-skip" class="num">0</div><div class="label">Skipped</div></div>
  <div class="stat time"><div id="s-time" class="num">-</div><div class="label">Duration</div></div>
</section>

<div class="progress-wrap">
  <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
    <div id="prog-pass" class="progress-fill pass" style="width:0"></div>
    <div id="prog-fail" class="progress-fill fail" style="width:0"></div>
  </div>
  <div class="progress-info">
    <span id="prog-text">0 / 0</span>
    <span id="prog-pct">0%</span>
  </div>
  <div id="running" class="running-test" style="display:none;"></div>
</div>

<div class="filters" id="filters" role="tablist">
  <button class="filter-btn active" data-filter="all">All <span class="count" id="f-all">0</span></button>
  <button class="filter-btn" data-filter="failed">Failed <span class="count" id="f-fail">0</span></button>
  <button class="filter-btn" data-filter="passed">Passed <span class="count" id="f-pass">0</span></button>
  <button class="filter-btn" data-filter="skipped">Skipped <span class="count" id="f-skip">0</span></button>
</div>

<div id="test-list" class="test-list"></div>

<div class="copy-section" id="copy-section" style="display:none;">
  <button class="copy-btn" id="copy-btn">Copy report for Claude</button>
</div>

<div id="no-data" class="no-data">
  <div class="heading">대기 중인 결과가 없어요</div>
  <div class="sub">아래 명령어로 테스트를 실행하면 결과가 여기 표시돼요.</div>
  <div><code>npx playwright test --reporter=./e2e/live-reporter.ts,line</code></div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentFilter = 'all';
let report = null;
let polling = null;

// Filters
$('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderTests();
});

function fmtTime(ms) {
  if (ms == null) return '-';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return m + 'm ' + s + 's';
}

function statusIcon(s) {
  if (s === 'passed') return '<span class="icon pass">✓</span>';
  if (s === 'failed' || s === 'timedOut') return '<span class="icon fail">✗</span>';
  if (s === 'skipped') return '<span class="icon skip">∘</span>';
  return '<span class="icon pending">·</span>';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTests() {
  if (!report) return;
  const list = $('test-list');
  const tests = report.tests.filter(t => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'failed') return t.status === 'failed' || t.status === 'timedOut';
    if (currentFilter === 'passed') return t.status === 'passed';
    if (currentFilter === 'skipped') return t.status === 'skipped';
    return true;
  });

  list.innerHTML = tests.map((t, i) => {
    const isFail = t.status === 'failed' || t.status === 'timedOut';
    return `
      <div class="test-item" onclick="toggleError(this)" data-idx="${i}">
        ${statusIcon(t.status)}
        <div class="test-name">${escHtml(t.title)}<span class="file">${escHtml(t.file)}</span></div>
        <div class="test-time">${fmtTime(t.duration)}</div>
      </div>
      ${isFail && t.error ? `<div class="error-detail" id="err-${i}">${escHtml(t.error)}</div>` : ''}
    `;
  }).join('');
}

window.toggleError = function(el) {
  const idx = el.dataset.idx;
  const detail = $('err-' + idx);
  if (!detail) return;
  el.classList.toggle('expanded');
  detail.classList.toggle('show');
};

function update(data) {
  report = data;
  const { total, passed, failed, skipped, completed, running, finishedAt, durationMs } = data;

  // Badge
  const badge = $('badge');
  if (finishedAt) {
    if (failed === 0) {
      badge.textContent = 'ALL PASSED';
      badge.className = 'badge passed';
    } else {
      badge.textContent = failed + ' FAILED';
      badge.className = 'badge failed';
    }
  } else {
    badge.textContent = 'RUNNING';
    badge.className = 'badge running';
  }

  // Stats
  $('s-total').textContent = total;
  $('s-pass').textContent = passed;
  $('s-fail').textContent = failed;
  $('s-skip').textContent = skipped;
  $('s-time').textContent = fmtTime(durationMs);

  // Progress
  const pct = total ? (completed / total * 100) : 0;
  const passPct = total ? (passed / total * 100) : 0;
  const failPct = total ? (failed / total * 100) : 0;
  $('prog-pass').style.width = passPct + '%';
  $('prog-fail').style.width = failPct + '%';
  $('prog-text').textContent = completed + ' / ' + total;
  $('prog-pct').textContent = pct.toFixed(0) + '%';
  const bar = document.querySelector('.progress-bar');
  if (bar) bar.setAttribute('aria-valuenow', String(Math.round(pct)));

  // Running
  if (running) {
    $('running').style.display = 'block';
    $('running').textContent = running;
  } else {
    $('running').style.display = 'none';
  }

  // Filter counts
  const failCount = data.tests.filter(t => t.status === 'failed' || t.status === 'timedOut').length;
  $('f-all').textContent = completed;
  $('f-fail').textContent = failCount;
  $('f-pass').textContent = passed;
  $('f-skip').textContent = skipped;

  // Hide empty state
  $('no-data').style.display = 'none';

  // Copy section
  $('copy-section').style.display = finishedAt ? 'flex' : 'none';

  renderTests();

  if (finishedAt && polling) {
    clearInterval(polling);
    polling = null;
  }
}

// Poll by reloading the JS script tag (works with file:// protocol)
function poll() {
  const old = document.getElementById('report-script');
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = 'report-script';
  s.src = './e2e-report-data.js?t=' + Date.now();
  s.onload = () => {
    if (window.__E2E_REPORT__) update(window.__E2E_REPORT__);
  };
  s.onerror = () => {};
  document.body.appendChild(s);
}

polling = setInterval(poll, 1000);
poll();

// Copy report
$('copy-btn').addEventListener('click', () => {
  if (!report) return;
  const failedTests = report.tests.filter(t => t.status === 'failed' || t.status === 'timedOut');

  let text = '## E2E Test Report\n';
  text += '- **Total**: ' + report.total + '\n';
  text += '- **Passed**: ' + report.passed + '\n';
  text += '- **Failed**: ' + report.failed + '\n';
  text += '- **Skipped**: ' + report.skipped + '\n';
  text += '- **Duration**: ' + fmtTime(report.durationMs) + '\n\n';

  if (failedTests.length > 0) {
    text += '### Failed Tests\n\n';
    failedTests.forEach((t, i) => {
      text += '**' + (i + 1) + '. ' + t.title + '** (' + t.file + ')\n';
      if (t.error) {
        const lines = t.error.split('\n').slice(0, 3).join('\n');
        text += '```\n' + lines + '\n```\n\n';
      }
    });
  } else {
    text += 'All tests passed.\n';
  }

  navigator.clipboard.writeText(text).then(() => {
    const btn = $('copy-btn');
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy report for Claude';
      btn.classList.remove('copied');
    }, 2000);
  });
});
</script>

</body>
</html>
