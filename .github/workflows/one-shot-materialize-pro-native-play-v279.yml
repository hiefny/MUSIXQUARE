name: One-shot Materialize PRO Native YouTube PLAY v279

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

concurrency:
  group: musixquare-one-shot-materialize-pro-native-play-v279
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor == 'hiefny' &&
      github.event.issue.number == 39 &&
      github.event.comment.body == '/materialize-pro-native-play-v279'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/fix-pro-native-play-autoplay-guard-v279
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused v279 patch
        run: python scripts/apply-pro-native-youtube-play-v279.py

      - name: Remove temporary patch script
        run: rm scripts/apply-pro-native-youtube-play-v279.py

      - name: Format changed TypeScript
        run: npx prettier --write src/youtube/native-control-authority.ts src/youtube/iframe.ts src/youtube/__tests__/native-control-pro-autoplay-guard.test.ts

      - name: Verify focused source scope
        shell: bash
        run: |
          expected="$(printf '%s\n' \
            public/service-worker.js \
            scripts/apply-pro-native-youtube-play-v279.py \
            src/core/__tests__/service-worker-cache.test.ts \
            src/youtube/__tests__/native-control-pro-autoplay-guard.test.ts \
            src/youtube/iframe.ts \
            src/youtube/native-control-authority.ts | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Unexpected working-tree scope'
            echo 'Expected:'
            printf '%s\n' "$expected"
            echo 'Actual:'
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

      - name: Production build
        run: npm run build:checked

      - name: Commit and push clean v279 source
        id: commit
        shell: bash
        run: |
          git config user.name 'MUSIXQUARE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(youtube): let PRO OS play cross autoplay guard'
          git push origin HEAD:agent/fix-pro-native-play-autoplay-guard-v279
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report materialized source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: gh issue comment 39 --body "Validated clean v279 source committed at \`$SOURCE_SHA\`."
