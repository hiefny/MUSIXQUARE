<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:#222;color:var(--text-main);font-family:var(--font-sans);min-height:180px;background-image:radial-gradient(circle at 30% 30%, #3b82f6 0%, transparent 40%),radial-gradient(circle at 70% 60%, #a855f7 0%, transparent 40%);background-color:#111;}
.card{padding:24px;}
.glass{background:rgba(38,38,38,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;width:fit-content;}
.dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,0.2);}
.txt{font-size:12px;font-weight:700;letter-spacing:0.02em;}
.sm{font-size:9px;font-weight:800;color:var(--text-sub);letter-spacing:0.14em;text-transform:uppercase;margin-top:12px;}
</style></head><body><div class="card">
<div class="glass"><span class="txt">rgba(38,38,38,0.75) + blur(16px)</span></div>
<div class="sm">Glass chrome — used only on fixed header & bottom nav</div>
</div></body></html>
