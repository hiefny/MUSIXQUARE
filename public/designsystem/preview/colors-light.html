<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.sw{width:92px;height:92px;border-radius:var(--radius-s);padding:8px 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;font-weight:700;outline:1px solid rgba(0,0,0,.06);outline-offset:-1px;}
.sw .nm{mix-blend-mode:difference;color:#fff;}
.sw .hx{mix-blend-mode:difference;color:#fff;opacity:.8;font-weight:600;}
</style></head><body><div class="card"><div class="row">
<div class="sw" style="background:#f8f9fa"><span class="nm">bg</span><span class="hx">#F8F9FA</span></div>
<div class="sw" style="background:#ffffff"><span class="nm">surface-1</span><span class="hx">#FFFFFF</span></div>
<div class="sw" style="background:#f1f3f5"><span class="nm">surface-2</span><span class="hx">#F1F3F5</span></div>
<div class="sw" style="background:#D4D6D8"><span class="nm">divider</span><span class="hx">#D4D6D8</span></div>
<div class="sw" style="background:#B7B9BB"><span class="nm">surface-3</span><span class="hx">#B7B9BB</span></div>
<div class="sw" style="background:#3b82f6"><span class="nm" style="color:#fff;mix-blend-mode:normal">primary</span><span class="hx" style="color:#fff;mix-blend-mode:normal;opacity:.85">#3B82F6</span></div>
</div></div></body></html>
