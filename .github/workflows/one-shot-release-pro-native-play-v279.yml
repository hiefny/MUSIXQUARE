name: One-shot Release - PRO Native YouTube PLAY v279

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: musixquare-one-shot-release-pro-native-play-v279
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.actor == 'hiefny' &&
      github.event.issue.number == 40 &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/release-pro-native-play-v279'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FIX_COMMIT: 5ef5e14807be7ae63e55d7cbe8ce6221c0eb55a5
      CACHE_VERSION: v279
      RELEASE_PR: '40'

    steps:
      - name: Checkout exact current main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate one-shot release identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FIX_COMMIT" HEAD
          grep -F "const CACHE_VERSION = '$CACHE_VERSION';" public/service-worker.js
          grep -F "const ACTIVE_CACHE_VERSION = '$CACHE_VERSION';" src/core/__tests__/service-worker-cache.test.ts
          test -f src/youtube/__tests__/native-control-pro-autoplay-guard.test.ts
          grep -F "preserveNativeProControllerPlayBeforeAutoplayGuard" src/youtube/iframe.ts

      - name: Dispatch approved production app release
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run release.yml \
            --ref main \
            -f target=app \
            -f apply_developer_api_d1=false \
            -f apply_pro_room_generation_d1=false \
            -f enable_pro_room_generation_cutover=false

          run_id=''
          for _ in $(seq 1 45); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=main&per_page=30" > /tmp/release-runs.json
            run_id="$(jq -r --arg sha "$release_sha" --arg since "$dispatched_at" '
              [.workflow_runs[] |
                select(.head_sha == $sha and .event == "workflow_dispatch" and .created_at >= $since)] |
              sort_by(.created_at) | last | .id // empty
            ' /tmp/release-runs.json)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo '::error::The production workflow was dispatched but its run ID was not observed.'
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          gh pr comment "$RELEASE_PR" --body "Production app release dispatched for \`$release_sha\` (service-worker \`$CACHE_VERSION\`). Actions run ID: \`$run_id\`."

      - name: Wait quietly for production release completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 720); do
            state="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion)"
            status="$(jq -r '.status' <<< "$state")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$state")"
            if [[ "$status" == 'completed' ]]; then
              if [[ "$conclusion" != 'success' ]]; then
                gh pr comment "$RELEASE_PR" --body "Production app release \`$RUN_ID\` finished with \`$conclusion\`. Live verification was not performed."
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          gh pr comment "$RELEASE_PR" --body "Production app release \`$RUN_ID\` did not complete within the one-hour verification window."
          exit 1

      - name: Verify service worker v279 is live
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RELEASE_SHA: ${{ steps.dispatch.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          live='false'
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "https://musixquare.com/service-worker.js?release=$RELEASE_SHA" \
              --output /tmp/live-service-worker.js && \
              grep -Fq "const CACHE_VERSION = '$CACHE_VERSION';" /tmp/live-service-worker.js; then
              live='true'
              break
            fi
            sleep 5
          done

          if [[ "$live" != 'true' ]]; then
            gh pr comment "$RELEASE_PR" --body "Production workflow \`$RUN_ID\` succeeded, but live service-worker \`$CACHE_VERSION\` was not observable within the verification window."
            exit 1
          fi

          gh pr comment "$RELEASE_PR" --body "Production release complete. Commit \`$RELEASE_SHA\` is live and \`service-worker.js\` reports \`$CACHE_VERSION\`. Actions run ID: \`$RUN_ID\`."
