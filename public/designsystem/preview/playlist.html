<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .frame {
        padding: 18px 24px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .item {
        display: flex;
        min-height: 56px;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border-radius: 999px;
        background: transparent;
      }
      button {
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .leading {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        margin: -8px -10px;
        padding: 0;
        border-radius: 999px;
        color: var(--text-muted);
      }
      .idx,
      .state,
      .grip {
        grid-area: 1 / 1;
      }
      .idx {
        width: 40px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }
      .state {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .grip {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 1.8;
        opacity: 0;
      }
      .item:hover .idx,
      .item:hover .state {
        opacity: 0;
      }
      .item:hover .grip {
        opacity: 1;
      }
      .name {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 8px;
        padding: 0;
        font-size: 15px;
        font-weight: 500;
        text-align: left;
      }
      .name span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .source {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        fill: currentColor;
      }
      .youtube {
        color: #ff0033;
      }
      .remove {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        margin: -8px -10px;
        padding: 0;
        border-radius: 999px;
        color: var(--text-muted);
      }
      .remove svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .item.active,
      .item.active .leading,
      .item.active .name {
        color: var(--primary);
      }
      .item.active .name {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="list">
        <div class="item">
          <button class="leading" aria-label="Reorder Aurora Hymn">
            <span class="idx">1</span>
            <svg class="grip" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8h14M5 12h14M5 16h14" />
            </svg>
          </button>
          <button class="name">
            <svg class="source" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.16-1.75 4.45-4H15V6h4V3h-7Z"
              />
            </svg>
            <span>Aurora Hymn</span>
          </button>
          <button class="remove" aria-label="Remove Aurora Hymn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"
              />
            </svg>
          </button>
        </div>
        <div class="item active">
          <button class="leading" aria-label="Reorder Midnight Protocol">
            <svg class="state" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z" transform="translate(-1.5 0)" />
            </svg>
            <svg class="grip" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8h14M5 12h14M5 16h14" />
            </svg>
          </button>
          <button class="name" aria-current="true">
            <svg class="source youtube" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21.582 6.186a2.5 2.5 0 0 0-1.768-1.768C18.254 4 12 4 12 4s-6.254 0-7.814.418a2.5 2.5 0 0 0-1.768 1.768C2 7.746 2 12 2 12s0 4.254.418 5.814a2.5 2.5 0 0 0 1.768 1.768C5.746 20 12 20 12 20s6.254 0 7.814-.418a2.5 2.5 0 0 0 1.768-1.768C22 16.254 22 12 22 12s0-4.254-.418-5.814ZM10 15.464V8.536L16 12l-6 3.464Z"
              />
            </svg>
            <span>Midnight Protocol</span>
          </button>
          <button class="remove" aria-label="Remove Midnight Protocol">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"
              />
            </svg>
          </button>
        </div>
        <div class="item">
          <button class="leading" aria-label="Reorder Coastal Drift">
            <span class="idx">3</span>
            <svg class="grip" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8h14M5 12h14M5 16h14" />
            </svg>
          </button>
          <button class="name">
            <svg class="source youtube" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z" />
            </svg>
            <span>Coastal Drift · Night Mix</span>
          </button>
          <button class="remove" aria-label="Remove Coastal Drift">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
