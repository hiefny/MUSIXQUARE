name: Materialize Native YouTube Control v277

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: musixquare-materialize-native-control-v277
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/fix-iframe-native-media-control-v277'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/fix-iframe-native-media-control-v277
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/native-control-v277
          mkdir -p /tmp/native-control-v277
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8616483608/zip" > /tmp/native-control-v277.zip
          unzip -q /tmp/native-control-v277.zip -d /tmp/native-control-v277
          cp -R /tmp/native-control-v277/public/. public/
          cp -R /tmp/native-control-v277/src/. src/
          while IFS= read -r path; do
            [[ -z "$path" ]] || rm -f "$path"
          done < /tmp/native-control-v277/delete-paths.txt

      - name: Apply reviewed final refinements
        run: patch -p0 < scripts/native-youtube-control-v277-final.patch

      - name: Remove temporary branch machinery and restore standard CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/agent-apply-native-youtube-control-v277 \
            .github/workflows/agent-apply-native-youtube-control-v277.yml \
            scripts/apply-native-youtube-control-v277.py \
            scripts/native-youtube-control-v277-final.patch
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Format source
        run: |
          npx prettier --write \
            src/player/media-session.ts \
            src/youtube/native-control-origin.ts \
            src/youtube/native-control-policy.ts \
            src/youtube/native-control-authority.ts \
            src/youtube/__tests__/native-control-origin.test.ts \
            src/youtube/__tests__/native-control-policy.test.ts \
            src/youtube/__tests__/native-control-authority.test.ts

      - name: Verify focused source scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github/agent-apply-native-youtube-control-v277|.github/workflows/agent-apply-native-youtube-control-v277.yml|.github/workflows/ci.yml|public/service-worker.js|scripts/apply-native-youtube-control-v277.py|scripts/native-youtube-control-v277-final.patch|src/core/__tests__/service-worker-cache.test.ts|src/player/__tests__/media-session-os-authority.test.ts|src/player/media-session.ts|src/youtube/__tests__/native-control-authority.test.ts|src/youtube/__tests__/native-control-origin.test.ts|src/youtube/__tests__/native-control-policy.test.ts|src/youtube/native-control-authority.ts|src/youtube/native-control-origin.ts|src/youtube/native-control-policy.ts)$'
          while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || { echo "::error::Unexpected changed path: $path"; exit 1; }
          done < <(git status --short | sed -E 's/^.. //')
          grep -F "const CACHE_VERSION = 'v277';" public/service-worker.js
          grep -F "const ACTIVE_CACHE_VERSION = 'v277';" src/core/__tests__/service-worker-cache.test.ts
          test ! -e src/player/__tests__/media-session-os-authority.test.ts
          test ! -e scripts/apply-native-youtube-control-v277.py
          test ! -e scripts/native-youtube-control-v277-final.patch
          git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

      - name: Production build
        run: npm run build

      - name: Commit clean v277 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MUSIXQUARE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(youtube): promote iframe-native media controls'

      - name: Verify committed production bundle
        run: npm run build:checked

      - name: Push feature branch
        run: git push origin HEAD:agent/fix-iframe-native-media-control-v277
