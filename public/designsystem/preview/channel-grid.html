<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .frame {
        padding: 22px 24px;
      }
      .grid {
        display: grid;
        width: min(360px, 100%);
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px 0;
      }
      .option {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 18px 12px;
        border: 2px solid transparent;
        border-radius: 20px;
        background: var(--surface-2);
        color: var(--text-sub);
        font: inherit;
        font-size: 14px;
        font-weight: 700;
      }
      .option svg {
        width: 32px;
        height: 32px;
        fill: currentColor;
      }
      .option.active {
        border-color: transparent;
        background: rgba(var(--primary-rgb), 0.13);
        color: var(--primary);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="grid">
        <button class="option">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg
          >Left
        </button>
        <button class="option">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z" /></svg
          >Right
        </button>
        <button class="option active" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.16-1.75 4.45-4H15V6h4V3h-7Z"
            /></svg
          >Center
        </button>
        <button class="option">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14a6 6 0 100 12 6 6 0 000-12z"
            /></svg
          >Subwoofer
        </button>
      </div>
    </div>
  </body>
</html>
