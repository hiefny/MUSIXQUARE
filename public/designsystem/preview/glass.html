<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .frame {
        display: grid;
        gap: 12px;
        padding: 24px;
      }
      .chrome {
        display: flex;
        min-height: 60px;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border: 0;
        border-radius: 0;
        background: var(--surface-1);
        box-shadow: none;
      }
      .name {
        font-size: 14px;
        font-weight: 800;
      }
      code {
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--text-sub);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .note {
        color: var(--text-sub);
        font-size: 12px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="chrome">
        <span class="name">Solid app chrome</span>
        <code>surface-1 · blur(0px)</code>
      </div>
      <div class="note">
        “Glass” remains only as a compatibility token name. Current fixed header and bottom
        navigation are opaque surface-1, with no backdrop blur, halo, border, or floating card
        shape.
      </div>
    </div>
  </body>
</html>
