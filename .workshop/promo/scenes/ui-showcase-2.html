<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSIXQUARE - UI Showcase 2.0</title>
<style>
@font-face {
  font-family: "Pretendard";
  src: url("/fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.16)),
    linear-gradient(145deg, #f7f8fb 0%, #eef6f2 54%, #f6f8ff 100%);
  color: #111827;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(17, 24, 39, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(17, 24, 39, 0.03) 1px, transparent 1px);
  background-size: 96px 96px;
  mask-image: linear-gradient(180deg, transparent 0%, black 22%, black 72%, transparent 100%);
  opacity: 0.48;
}

#scene {
  position: fixed;
  inset: 0;
  display: block;
  width: 100vw;
  height: 100vh;
}

.brand {
  position: fixed;
  top: 54px;
  left: 64px;
  display: flex;
  align-items: center;
  gap: 16px;
  color: rgba(17, 24, 39, 0.74);
  font-size: 21px;
  font-weight: 850;
  pointer-events: none;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: #2563eb;
  color: #fff;
  font-size: 22px;
  font-weight: 900;
}

.caption {
  position: fixed;
  left: 50%;
  top: 118px;
  width: min(850px, calc(100vw - 120px));
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.caption-title {
  margin: 0;
  font-size: 64px;
  line-height: 1.16;
  font-weight: 900;
  letter-spacing: 0;
  color: #111827;
}

.caption-sub {
  margin: 18px 0 0;
  font-size: 25px;
  line-height: 1.45;
  font-weight: 650;
  color: rgba(31, 41, 55, 0.58);
}

.floor-line {
  position: fixed;
  left: 50%;
  bottom: 185px;
  width: 520px;
  height: 1px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, rgba(17,24,39,0.18), transparent);
  pointer-events: none;
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: #f7f8fb;
  color: rgba(17, 24, 39, 0.45);
  font-size: 18px;
  font-weight: 750;
  transition: opacity 0.35s ease;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 720px) {
  .brand { top: 34px; left: 34px; font-size: 17px; }
  .caption { top: 88px; width: calc(100vw - 56px); }
  .caption-title { font-size: 42px; }
  .caption-sub { font-size: 18px; }
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="brand"><span class="brand-mark">♪</span><span>MUSIXQUARE</span></div>
<div class="caption" id="caption">
  <h1 class="caption-title" id="caption-title"></h1>
  <p class="caption-sub" id="caption-sub"></p>
</div>
<div class="floor-line" id="floor-line"></div>
<div class="loading" id="loading">Loading 3D scene</div>

<script type="module" src="./ui-showcase-2.js"></script>
</body>
</html>
