name: One-shot Materialize Native YouTube Play Resume v278

on:
  push:
    branches:
      - agent/fix-native-youtube-play-resume-v278
    paths:
      - .github/agent-run-native-youtube-play-resume-v278

permissions:
  contents: write

concurrency:
  group: musixquare-native-youtube-play-resume-v278
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.head_commit.message == 'chore: run native YouTube play resume v278'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/fix-native-youtube-play-resume-v278
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused native-play authority fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          authority = Path('src/youtube/native-control-authority.ts')
          replace_once(
              authority,
              """function pauseUntilAuthority(player: YouTubePlayerInstance): void {
            try {
              player.pauseVideo?.();
            } catch (error) {
              log.debug('[YouTube Native Control] Corrective authority pause failed', error);
            }
          }

          """.replace('          ', ''),
              '',
              'remove eager authority pause helper',
          )
          replace_once(
              authority,
              """  setLocalYouTubePaused(false);
            if (action === 'play' && route !== 'standard-host') pauseUntilAuthority(player);

          """.replace('            ', '  '),
              """  setLocalYouTubePaused(false);

          """.replace('            ', '  '),
              'preserve trusted native play',
          )
          replace_once(
              authority,
              """  if (route === 'pro-controller') {
            routeProPlaybackCommand(
              { kind: action, queueItemId, positionSeconds },
              { wasPlaying: previous === 'playing' },
            );
            log.info(`[YouTube Native Control] Routed ${action} through PRO authority`);
            return;
          }
          """.replace('            ', '  '),
              """  if (route === 'pro-controller') {
            if (action === 'play') {
              // The iframe is already playing under a trusted OS media gesture.
              // Keep that playback alive while the server establishes the
              // canonical timeline; pausing first makes iOS reject the later
              // asynchronous playVideo() commit.
              routeProPlaybackCommand({ kind: 'play', queueItemId, positionSeconds });
            } else {
              routeProPlaybackCommand(
                { kind: 'pause', queueItemId, positionSeconds },
                { wasPlaying: previous === 'playing' },
              );
            }
            log.info(`[YouTube Native Control] Routed ${action} through PRO authority`);
            return;
          }
          """.replace('            ', '  '),
              'PRO native play routing',
          )
          replace_once(
              authority,
              """  if (route === 'standard-controller') {
            if (!hostConn?.open) return;
            safeSend(hostConn, {
              type: action === 'play' ? MSG.REQUEST_YOUTUBE_PLAY : MSG.REQUEST_YOUTUBE_PAUSE,
              queueItemId,
            });
            log.info(`[YouTube Native Control] Requested standard-room ${action}`);
            return;
          }
          """.replace('            ', '  '),
              """  if (route === 'standard-controller') {
            if (!hostConn?.open) return;
            const sent = safeSend(hostConn, {
              type: action === 'play' ? MSG.REQUEST_YOUTUBE_PLAY : MSG.REQUEST_YOUTUBE_PAUSE,
              queueItemId,
            });
            if (!sent && action === 'play') {
              // Fail closed only when the authority request could not leave this
              // endpoint. A successfully sent OS PLAY must remain audible so
              // iOS keeps the trusted media gesture alive until host sync lands.
              try {
                player.pauseVideo?.();
              } catch (error) {
                log.debug('[YouTube Native Control] Failed to restore pause after send failure', error);
              }
            }
            log.info(`[YouTube Native Control] Requested standard-room ${action}`);
            return;
          }
          """.replace('            ', '  '),
              'standard controller native play routing',
          )

          test_path = Path('src/youtube/__tests__/native-control-play-resume.test.ts')
          if test_path.exists():
              raise SystemExit(f'{test_path} already exists')
          test_path.write_text(
              """/**
               * @vitest-environment jsdom
               */

              import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';

              const mocks = vi.hoisted(() => ({
                routeProPlaybackCommand: vi.fn(() => true),
                safeSend: vi.fn(() => true),
              }));

              vi.mock('../../pro-room/playback-authority-hooks.ts', () => ({
                routeProPlaybackCommand: mocks.routeProPlaybackCommand,
              }));

              vi.mock('../../network/peer.ts', () => ({
                safeSend: mocks.safeSend,
              }));

              import { bus } from '../../core/events.ts';
              import { MSG } from '../../core/constants.ts';
              import { resetState, setState } from '../../core/state.ts';
              import { clearAllManagedTimers } from '../../core/timers.ts';
              import { setPlaybackYouTubePaused, setPlaybackYouTubePlaying } from '../../player/ownership.ts';
              import type { PlaylistItem, QueueItemId } from '../../types/index.ts';
              import {
                markYtPlayerReady,
                resetYouTubeModuleState,
                setLocalYouTubePaused,
                setYouTubePlayer,
                setYtAutoplayIntent,
                type YouTubePlayerInstance,
              } from '../_state.ts';
              import { initYouTubeNativeControlAuthority } from '../native-control-authority.ts';

              const QUEUE_ITEM_ID = '00000000-0000-4000-8000-000000000001' as QueueItemId;
              const VIDEO_ID = 'abcdefghijk';

              interface FakePlayer extends YouTubePlayerInstance {
                state: number;
              }

              function createPlayer(initialState = 2): FakePlayer {
                let state = initialState;
                return {
                  get state() {
                    return state;
                  },
                  set state(value: number) {
                    state = value;
                  },
                  playVideo: () => {
                    state = 1;
                  },
                  pauseVideo: () => {
                    state = 2;
                  },
                  loadVideoById: () => {
                    state = 1;
                  },
                  loadPlaylist: () => {
                    state = 1;
                  },
                  cueVideoById: () => {
                    state = 2;
                  },
                  cuePlaylist: () => {
                    state = 2;
                  },
                  stopVideo: () => {
                    state = 0;
                  },
                  destroy: () => undefined,
                  seekTo: () => undefined,
                  getCurrentTime: () => 42.25,
                  getDuration: () => 300,
                  getPlayerState: () => state,
                  getPlaylistIndex: () => 0,
                  getVideoData: () => ({ video_id: VIDEO_ID, title: 'Video' }),
                  getPlaylist: () => [VIDEO_ID],
                  setVolume: () => undefined,
                };
              }

              function installPausedYouTube(player: FakePlayer): void {
                const item = {
                  queueItemId: QUEUE_ITEM_ID,
                  type: 'youtube',
                  name: 'Video',
                  title: 'Video',
                  videoId: VIDEO_ID,
                  playlistId: null,
                } as PlaylistItem;
                setState('playlist.items', [item]);
                setState('playlist.currentQueueItemId', QUEUE_ITEM_ID);
                setYouTubePlayer(player);
                markYtPlayerReady(player);
                setYtAutoplayIntent(false);
                setPlaybackYouTubePaused();
                initYouTubeNativeControlAuthority();
                bus.emit('youtube:player-ready');
              }

              function emitNativePlay(player: FakePlayer): void {
                player.state = 1;
                setPlaybackYouTubePlaying();
              }

              beforeEach(() => {
                clearAllManagedTimers();
                bus.clear();
                resetState();
                resetYouTubeModuleState();
                setLocalYouTubePaused(false);
                vi.clearAllMocks();
              });

              afterEach(() => {
                clearAllManagedTimers();
              });

              describe('iframe-native YouTube PLAY authority', () => {
                it('keeps a standard-room controller playing while requesting host rendezvous', () => {
                  const hostConn = { open: true, peer: 'host', send: vi.fn() } as never;
                  setState('network.appRole', 'guest');
                  setState('network.hostConn', hostConn);
                  setState('network.isOperator', true);
                  setState('network.standardRoomCapabilities', ['playback.control']);
                  const player = createPlayer();
                  installPausedYouTube(player);

                  emitNativePlay(player);

                  expect(player.state).toBe(1);
                  expect(mocks.safeSend).toHaveBeenCalledWith(hostConn, {
                    type: MSG.REQUEST_YOUTUBE_PLAY,
                    queueItemId: QUEUE_ITEM_ID,
                  });
                });

                it('keeps a PRO controller playing while the server establishes canonical playback', () => {
                  setState('room.context', {
                    kind: 'pro',
                    roomId: '000001',
                    role: 'member',
                    coordinatorId: null,
                    epoch: 7,
                    snapshotRevision: 11,
                    capabilities: ['playback.control'],
                  });
                  const player = createPlayer();
                  installPausedYouTube(player);

                  emitNativePlay(player);

                  expect(player.state).toBe(1);
                  expect(mocks.routeProPlaybackCommand).toHaveBeenCalledWith({
                    kind: 'play',
                    queueItemId: QUEUE_ITEM_ID,
                    positionSeconds: 42.25,
                  });
                });

                it('restores pause when a standard controller cannot send the authority request', () => {
                  mocks.safeSend.mockReturnValueOnce(false);
                  const hostConn = { open: true, peer: 'host', send: vi.fn() } as never;
                  setState('network.appRole', 'guest');
                  setState('network.hostConn', hostConn);
                  setState('network.isOperator', true);
                  setState('network.standardRoomCapabilities', ['playback.control']);
                  const player = createPlayer();
                  installPausedYouTube(player);

                  emitNativePlay(player);

                  expect(player.state).toBe(2);
                });
              });
              """.replace('\n              ', '\n').lstrip(),
              encoding='utf-8',
          )

          replace_once(
              Path('public/service-worker.js'),
              "const CACHE_VERSION = 'v277';",
              "const CACHE_VERSION = 'v278';",
              'service worker cache generation',
          )
          replace_once(
              Path('src/core/__tests__/service-worker-cache.test.ts'),
              "const ACTIVE_CACHE_VERSION = 'v277';",
              "const ACTIVE_CACHE_VERSION = 'v278';",
              'service worker test generation',
          )

          Path('.github/workflows/one-shot-materialize-native-youtube-play-resume-v278.yml').unlink()
          Path('.github/agent-run-native-youtube-play-resume-v278').unlink()
          PY

      - name: Format changed TypeScript
        run: npx prettier --write src/youtube/native-control-authority.ts src/youtube/__tests__/native-control-play-resume.test.ts

      - name: Verify focused scope
        shell: bash
        run: |
          expected="$(printf '%s\n' \
            .github/agent-run-native-youtube-play-resume-v278 \
            .github/workflows/one-shot-materialize-native-youtube-play-resume-v278.yml \
            public/service-worker.js \
            src/core/__tests__/service-worker-cache.test.ts \
            src/youtube/__tests__/native-control-play-resume.test.ts \
            src/youtube/native-control-authority.ts | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Unexpected working-tree scope'
            echo 'Expected:'
            printf '%s\n' "$expected"
            echo 'Actual:'
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

      - name: Production build
        run: npm run build:checked

      - name: Commit validated v278 source
        shell: bash
        run: |
          git config user.name 'MUSIXQUARE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(youtube): preserve native controller play through authority sync'
          git push origin HEAD:agent/fix-native-youtube-play-resume-v278
