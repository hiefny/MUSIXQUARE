            --force
          cors_state="$(npm run --silent wrangler -- r2 bucket cors list \
            musixquare-remote-share \
            --config cloudflare/wrangler.remote-share.toml)"
          for required_header in \
            content-type \
            x-amz-meta-cleanup-token \
            x-amz-meta-expires-at \
            x-amz-meta-format-version \
            x-amz-meta-mime \
            x-amz-meta-name \
            x-amz-meta-object-id \
            x-amz-meta-room-id \
            x-amz-meta-stored-size; do
            if ! grep -Eiq "(^|[^[:alnum:]-])${required_header}([^[:alnum:]-]|$)" <<<"$cors_state"; then
              echo "::error::Remote-share R2 CORS read-back is missing ${required_header}."
              exit 1
            fi
          done
          metadata_header_count="$(grep -Eio 'x-amz-meta-[[:alnum:]-]+' <<<"$cors_state" | sort -u | wc -l | tr -d '[:space:]')"
