<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient Display</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      :root {
        --grain-opacity: 0.25;
        --font-sans: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        /* Same double-tap policy as the app shell; double-tap closes this display. */
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #02081b;
        color: #ffffff;
        font-family: var(--font-sans);
        cursor: default;
      }

      .background-grain {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background-repeat: repeat;
        background-size: 190px 190px;
        mix-blend-mode: soft-light;
        opacity: 0;
      }

      .film-grain-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        opacity: var(--grain-opacity);
        mix-blend-mode: overlay;
        background-repeat: repeat;
        background-size: 190px 190px;
      }

      .clock-stage {
        position: relative;
        z-index: 15;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #opticalClockCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 16;
      }

      #speckleFieldCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 20;
      }

      [hidden] {
        display: none !important;
      }
      .display-chrome {
        position: fixed;
        z-index: 40;
        inset: 0;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      .display-chrome button {
        pointer-events: auto;
        border: 0;
        color: #eee;
        font: 500 clamp(11px, 2.4vmin, 15px) var(--font-sans);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .display-back {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: max-content;
        max-width: 94vw;
        min-height: 44px;
        padding: 10px 16px;
        border-radius: 12px;
        background: transparent;
      }
      .display-back:hover {
        background: transparent;
        color: #fff;
      }
      .back-chevron {
        width: 7px;
        height: 7px;
        flex: none;
        border-left: 1.6px solid currentColor;
        border-bottom: 1.6px solid currentColor;
        transform: rotate(45deg);
        margin-inline-end: 2px;
      }
      [dir='rtl'] .back-chevron {
        transform: rotate(225deg);
      }
      .back-copy {
        min-width: 0;
        overflow-wrap: anywhere;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      .brand-wordmark {
        width: clamp(84px, 20vmin, 134px);
        height: auto;
        overflow: visible;
        flex: none;
      }
      #backBefore,
      #backAfter {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .display-music-info {
        position: absolute;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        max-width: 84vw;
        width: max-content;
        text-align: center;
        color: #eee;
      }
      .display-music-info[hidden] {
        display: none;
      }
      .music-title,
      .music-subtitle {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .music-title {
        font: 500 clamp(11px, 2.4vmin, 16px)/1.45 var(--font-sans);
      }
      .music-subtitle {
        margin-top: 3px;
        font: 500 clamp(10px, 2vmin, 13px)/1.4 var(--font-sans);
        color: rgba(255, 255, 255, 0.64);
      }
      .display-chrome button:focus-visible {
        outline: 2px solid #d5ecff;
        outline-offset: 4px;
      }
      .chrome-hidden .display-chrome {
        opacity: 0;
      }
      .chrome-hidden .display-chrome button {
        pointer-events: none;
      }
      .chrome-hidden {
        cursor: none;
      }
      @media (max-height: 280px) {
        .display-back {
          top: max(2px, env(safe-area-inset-top));
          padding: 4px 8px;
          min-height: 32px;
        }
        .display-music-info {
          bottom: max(4px, env(safe-area-inset-bottom));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .display-chrome {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="backgroundGrain" class="background-grain" aria-hidden="true"></div>

    <div id="grainLayer" class="film-grain-overlay" aria-hidden="true"></div>

      <canvas id="opticalClockCanvas" role="img" aria-label="Current time"></canvas>
      <canvas id="speckleFieldCanvas" aria-hidden="true"></canvas>
    </main>
