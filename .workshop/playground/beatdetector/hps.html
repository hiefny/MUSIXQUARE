<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPS (Harmonic-Percussive Separation) Beat Engine</title>
    <style>
        :root {
            --bg: #030303; --fg: #fff; --hl: #00ffcc; --hl2: #ff00ff;
            --ui-bg: rgba(10, 10, 10, 0.98);
        }
        body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #ui { position: absolute; left: 15px; top: 15px; background: var(--ui-bg); padding: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; width: 280px; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .control-group { display: flex; flex-direction: column; gap: 2px; }
        label { font-size: 8px; text-transform: uppercase; color: #555; font-weight: bold; letter-spacing: 1px; }
        .val-display { color: #eee; font-size: 10px; float: right; font-family: monospace; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--hl); margin: 3px 0; }
        select { background:#151515; color:white; border:1px solid #333; font-size:10px; padding:3px; outline:none; }

        #panel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        #lamp { position: absolute; top: 0; width: 100%; height: 10px; background: #111; z-index: 101; }
        #lamp.active { background: var(--hl); box-shadow: 0 0 20px var(--hl); }

        #viz-container { position: relative; width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; }
        canvas { position: absolute; }
        #main-circle { width: 100px; height: 100px; background: #fff; border-radius: 50%; z-index: 10; transition: transform 0.05s; }
        #barrier-ring { position: absolute; width: 100px; height: 100px; border: 2px dashed var(--hl); border-radius: 50%; z-index: 5; }

        #monitor-group { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .label-tag { font-size: 8px; color: #444; text-transform: uppercase; margin-bottom: 2px; }
        .monitor { display: flex; align-items: flex-end; gap: 1px; height: 40px; background: rgba(255,255,255,0.02); padding: 5px; }
        .bar { width: 2px; background: #333; }
        .bar.p { background: var(--hl); } /* Percussive */
        .bar.h { background: var(--hl2); } /* Harmonic suppressed? */
    </style>
</head>
<body>
    <div id="lamp"></div>
    <div id="ui">
        <label style="color:var(--hl); border-bottom: 2px solid var(--hl); padding-bottom: 5px; margin-bottom: 5px;">HPS Realtime Separator v1</label>
        <div class="control-group"><label>Source</label><input type="file" id="audioInput" accept="audio/*"></div>
        <div class="control-group">
            <label>FFT Size <span class="val-display" id="fftVal">1024</span></label>
            <select id="fftSelect">
                <option value="512">512</option><option value="1024" selected>1024</option>
                <option value="2048">2048</option><option value="4096">4096</option>
            </select>
        </div>
        <div class="control-group">
            <label>HPS Buffer (Frames) <span class="val-display" id="bufSizeVal">12</span></label>
            <input type="range" id="bufSizeRange" min="2" max="30" step="1" value="12">
        </div>
        <div class="control-group">
            <label>Hertz Range <span class="val-display" id="minHzVal">0</span> - <span id="maxHzVal">150</span>Hz</label>
            <div style="display:flex; gap:10px;">
                <input type="range" id="minHzRange" min="0" max="300" step="1" value="0">
                <input type="range" id="maxHzRange" min="20" max="800" step="1" value="150">
            </div>
        </div>
        <div class="control-group">
            <label>Barrier Lag <span class="val-display" id="lagVal">10%</span></label>
            <input type="range" id="lagRange" min="1" max="100" step="1" value="10">
        </div>
        <div class="control-group">
            <label>Force Margin <span class="val-display" id="forceVal">20%</span></label>
            <input type="range" id="forceRange" min="1" max="150" step="1" value="20">
        </div>
        <div class="control-group">
            <label>Sensitivity <span class="val-display" id="sensVal">5.0</span></label>
            <input type="range" id="sensRange" min="1" max="25" step="0.5" value="5">
        </div>
    </div>

    <div id="panel">
        <div id="viz-container">
            <div id="barrier-ring"></div>
            <div id="main-circle"></div>
        </div>
    </div>

    <div id="monitor-group">
        <div><div class="label-tag">Raw Spectrum (Input)</div><div id="raw-monitor" class="monitor"></div></div>
        <div><div class="label-tag" style="color:var(--hl);">Percussive Spectrum (HPS Isolated)</div><div id="hps-monitor" class="monitor"></div></div>
    </div>

    <script>
        const audioInput = document.getElementById('audioInput'), lamp = document.getElementById('lamp'), mainCircle = document.getElementById('main-circle'), barrierRing = document.getElementById('barrier-ring');
        const rawMonitor = document.getElementById('raw-monitor'), hpsMonitor = document.getElementById('hps-monitor');
        const s = { fft: 1024, hpsBufSize: 12, minHz: 0, maxHz: 150, lag: 0.1, force: 20, sens: 5 };
        
        let audioCtx, analyser, dataArray, source, isLooping = false;
        let spectrogram = []; // HPS Buffer
        let currentPeakEnergy = 0, smoothedBarrier = 0;

        // UI Setup
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', (e) => {
                const id = e.target.id; const val = e.target.value;
                if(id==='fftSelect') { s.fft = parseInt(val); if(analyser) { analyser.fftSize = s.fft; dataArray=new Uint8Array(analyser.frequencyBinCount); createMonitors(); spectrogram=[]; }}
                if(id==='bufSizeRange') { s.hpsBufSize = parseInt(val); spectrogram=[]; document.getElementById('bufSizeVal').textContent = val; }
                if(id==='minHzRange') { s.minHz = parseInt(val); document.getElementById('minHzVal').textContent = val; }
                if(id==='maxHzRange') { s.maxHz = parseInt(val); document.getElementById('maxHzVal').textContent = val; }
                if(id==='lagRange') { s.lag = parseInt(val)/100; document.getElementById('lagVal').textContent = val+"%"; }
                if(id==='forceRange') { s.force = parseInt(val); document.getElementById('forceVal').textContent = val+"%"; }
                if(id==='sensRange') { s.sens = parseFloat(val); document.getElementById('sensVal').textContent = val; }
            });
        });

        audioInput.onchange = function() {
            if(!this.files.length) return;
            if(!audioCtx) { audioCtx = new AudioContext(); analyser=audioCtx.createAnalyser(); analyser.fftSize=s.fft; analyser.smoothingTimeConstant=0.2; dataArray=new Uint8Array(analyser.frequencyBinCount); createMonitors(); }
            const reader = new FileReader();
            reader.onload = (e) => {
                audioCtx.decodeAudioData(e.target.result, (buf) => {
                    if(source) source.stop();
                    source = audioCtx.createBufferSource(); source.buffer = buf; source.connect(analyser); analyser.connect(audioCtx.destination); source.start(0);
                    if(!isLooping) { isLooping=true; update(); }
                });
            };
            reader.readAsArrayBuffer(this.files[0]);
        };

        function createMonitors() {
            const size = 64; 
            rawMonitor.innerHTML = hpsMonitor.innerHTML = '';
            for(let i=0; i<size; i++) {
                const b1 = document.createElement('div'); b1.className = 'bar'; rawMonitor.appendChild(b1);
                const b2 = document.createElement('div'); b2.className = 'bar p'; hpsMonitor.appendChild(b2);
            }
        }

        function getMedian(arr) {
            const sorted = [...arr].sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
        }

        function update() {
            requestAnimationFrame(update);
            if(!analyser) return;
            analyser.getByteFrequencyData(dataArray);

            // 1. HPS Buffer Management (Push new spectrum)
            spectrogram.push(new Uint8Array(dataArray));
            if(spectrogram.length > s.hpsBufSize) spectrogram.shift();

            // 2. Perform Simplified HPS (Time-Median Subtraction)
            const percussiveSpectrum = new Uint8Array(dataArray.length);
            if(spectrogram.length >= 2) {
                for(let k=0; k<dataArray.length; k++) {
                    const history = spectrogram.map(frame => frame[k]);
                    const median = getMedian(history);
                    // Percussive = Current - Median (Only positive jumps)
                    percussiveSpectrum[k] = Math.max(0, dataArray[k] - median);
                }
            }

            // 3. Energy Calculation in Hertz Range (Applied on Percussive Spectrum!)
            const binHz = audioCtx.sampleRate / s.fft;
            const minBin = Math.floor(s.minHz / binHz), maxBin = Math.floor(s.maxHz / binHz);
            let pSum = 0, count = 0;
            const rBars = rawMonitor.children, pBars = hpsMonitor.children;
            
            for(let i=0; i<rBars.length; i++) {
                if(rBars[i]) rBars[i].style.height = (dataArray[i]/255*40)+'px';
                if(pBars[i]) pBars[i].style.height = (percussiveSpectrum[i]/255*60)+'px';
                if(i >= minBin && i <= maxBin) { pSum += percussiveSpectrum[i]; count++; }
            }

            // 4. Trigger Logic (Using isolated Percussive Energy)
            const pEnergy = count > 0 ? pSum / count : 0;
            currentPeakEnergy = Math.max(currentPeakEnergy * 0.96, pEnergy);
            const targetBarrier = currentPeakEnergy * (1 + s.force / 100);
            smoothedBarrier += (targetBarrier - smoothedBarrier) * s.lag;

            // Visualization
            const coreS = 1 + (pEnergy / 255) * s.sens;
            const barS = 1 + (smoothedBarrier / 255) * s.sens;
            mainCircle.style.transform = `scale(${coreS})`;
            barrierRing.style.transform = `scale(${barS})`;

            if(pEnergy > smoothedBarrier && pEnergy > 5) { // Lower threshold because HPS is cleaner
                lamp.classList.add('active');
            } else {
                lamp.classList.remove('active');
            }
        }
    </script>
</body>
</html>
