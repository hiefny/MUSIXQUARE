<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSIXQUARE - UI Showcase 2.0</title>
<style>
@font-face {
  font-family: "Pretendard";
  src: url("/fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.16)),
    linear-gradient(145deg, #f7f8fb 0%, #eef6f2 54%, #f6f8ff 100%);
  color: #111827;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(17, 24, 39, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(17, 24, 39, 0.03) 1px, transparent 1px);
  background-size: 96px 96px;
  mask-image: linear-gradient(180deg, transparent 0%, black 22%, black 72%, transparent 100%);
  opacity: 0.48;
}

#scene {
  position: fixed;
  inset: 0;
  display: block;
  width: 100vw;
  height: 100vh;
}

.brand {
  position: fixed;
  top: 54px;
  left: 64px;
  display: flex;
  align-items: center;
  gap: 16px;
  color: rgba(17, 24, 39, 0.74);
  font-size: 21px;
  font-weight: 850;
  pointer-events: none;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: #2563eb;
  color: #fff;
  box-shadow: 0 14px 34px rgba(37, 99, 235, 0.28);
  font-size: 22px;
  font-weight: 900;
}

.caption {
  position: fixed;
  left: 50%;
  top: 118px;
  width: min(850px, calc(100vw - 120px));
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.caption-title {
  margin: 0;
  font-size: 64px;
  line-height: 1.16;
  font-weight: 900;
  letter-spacing: 0;
  color: #111827;
}

.caption-sub {
  margin: 18px 0 0;
  font-size: 25px;
  line-height: 1.45;
  font-weight: 650;
  color: rgba(31, 41, 55, 0.58);
}

.floor-line {
  position: fixed;
  left: 50%;
  bottom: 185px;
  width: 520px;
  height: 1px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, rgba(17,24,39,0.18), transparent);
  pointer-events: none;
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: #f7f8fb;
  color: rgba(17, 24, 39, 0.45);
  font-size: 18px;
  font-weight: 750;
  transition: opacity 0.35s ease;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 720px) {
  .brand { top: 34px; left: 34px; font-size: 17px; }
  .caption { top: 88px; width: calc(100vw - 56px); }
  .caption-title { font-size: 42px; }
  .caption-sub { font-size: 18px; }
}
</style>
</head>

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const hw = w / 2;
  const hh = h / 2;
  s.moveTo(-hw + r, -hh);
  s.lineTo(hw - r, -hh);
  s.quadraticCurveTo(hw, -hh, hw, -hh + r);
  s.lineTo(hw, hh - r);
  s.quadraticCurveTo(hw, hh, hw - r, hh);
  s.lineTo(-hw + r, hh);
  s.quadraticCurveTo(-hw, hh, -hw, hh - r);
  s.lineTo(-hw, -hh + r);
  s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  return s;
}

function roundedPlaneGeometry(w, h, r) {
  const geom = new THREE.ShapeGeometry(roundedRectShape(w, h, r), 28);
  const uv = geom.attributes.uv.array;
  for (let i = 0; i < uv.length; i += 2) {
    uv[i] = (uv[i] + w / 2) / w;
    uv[i + 1] = (uv[i + 1] + h / 2) / h;
  }
  geom.attributes.uv.needsUpdate = true;
  return geom;
}

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function mix(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp01(t); return t * t * (3 - 2 * t); }
function smoother(t) { t = clamp01(t); return t * t * t * (t * (t * 6 - 15) + 10); }
function phase(ms, start, end) { return clamp01((ms - start) / (end - start)); }
function wave(ms, speed = 1, offset = 0) { return Math.sin(ms * 0.001 * speed + offset); }

function setVec(obj, from, to, p) {
  obj.position.set(
    mix(from[0], to[0], p),
    mix(from[1], to[1], p),
    mix(from[2], to[2], p),
  );
}

function setRot(obj, from, to, p) {
  obj.rotation.set(
    mix(from[0], to[0], p),
    mix(from[1], to[1], p),
    mix(from[2], to[2], p),
  );
}

function setMaterialOpacity(group, opacity) {
  group.visible = opacity > 0.01;
  group.traverse(child => {
    if (!child.material) return;
    const mats = Array.isArray(child.material) ? child.material : [child.material];
    mats.forEach(mat => {
      if (mat.userData.baseOpacity === undefined) mat.userData.baseOpacity = mat.opacity;
      mat.transparent = true;
      mat.opacity = mat.userData.baseOpacity * opacity;
      mat.needsUpdate = true;
    });
  });
}

function makeTextureCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  return c;
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function fillRound(ctx, x, y, w, h, r, fill) {
  roundRect(ctx, x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
}

function strokeRound(ctx, x, y, w, h, r, stroke, lineWidth = 2) {
  roundRect(ctx, x, y, w, h, r);
  ctx.strokeStyle = stroke;
  ctx.lineWidth = lineWidth;
  ctx.stroke();
}

function drawText(ctx, text, x, y, size, weight = 700, color = '#111827', align = 'left') {
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px Pretendard, -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillText(text, x, y);
}

function drawCenteredText(ctx, text, x, y, size, weight = 700, color = '#111827') {
  drawText(ctx, text, x, y, size, weight, color, 'center');
}

function drawHeader(ctx, title = 'MUSIXQUARE', badge = 'HOST') {

  const start = 91;
  items.forEach((it, i) => {

    ctx.fillStyle = isActive ? '#2563eb' : '#94a3b8';

    ctx.fillText(it[0], x, 1496);
    drawCenteredText(ctx, it[1], x, 1542, 18, 700, isActive ? '#2563eb' : '#64748b');

}

}

  screenCtx.beginPath();

  screenCtx.fill();
  screenCtx.beginPath();
  screenCtx.arc(cx, cy, 62, 0, Math.PI * 2);

  screenCtx.lineTo(668, 920);
  screenCtx.stroke();

  screenCtx.beginPath();
  screenCtx.moveTo(92, 920);
  screenCtx.lineTo(272 + pulse * 36, 920);
  screenCtx.stroke();

function drawQr(ctx, x, y, size) {
  fillRound(ctx, x - 28, y - 28, size + 56, size + 56, 34, '#ffffff');
  const n = 21;
  const cell = size / n;
  ctx.fillStyle = '#111827';
  const finder = (fx, fy) => {
    ctx.fillRect(x + fx * cell, y + fy * cell, cell * 7, cell * 7);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + (fx + 1) * cell, y + (fy + 1) * cell, cell * 5, cell * 5);
    ctx.fillStyle = '#111827';
    ctx.fillRect(x + (fx + 2) * cell, y + (fy + 2) * cell, cell * 3, cell * 3);
  };
  finder(0, 0);
  finder(14, 0);
  finder(0, 14);
  for (let yy = 0; yy < n; yy++) {
    for (let xx = 0; xx < n; xx++) {
      const inFinder = (xx < 7 && yy < 7) || (xx > 13 && yy < 7) || (xx < 7 && yy > 13);
      if (inFinder) continue;
      const on = ((xx * 7 + yy * 11 + xx * yy) % 5 === 0) || ((xx + yy * 3) % 7 === 0);
      if (on) ctx.fillRect(x + xx * cell, y + yy * cell, cell * 0.92, cell * 0.92);
    }
  }
}

function makeFloatingPanel(name, ratio, draw) {
  const h = 640;
  const w = Math.round(h * ratio);
  const source = makeTextureCanvas(w, h, draw);
  const texture = new THREE.CanvasTexture(source);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const group = new THREE.Group();
  group.name = name;
  const panelW = ratio * 1.56;
  const panelH = 1.56;
  const back = new THREE.Mesh(
    roundedPlaneGeometry(panelW, panelH, 0.09),
    new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.0,
      clearcoat: 0.8,
      clearcoatRoughness: 0.18,
      transparent: true,
      opacity: 0.82,
    }),
  );
  back.position.z = -0.018;
  group.add(back);
  const front = new THREE.Mesh(
    roundedPlaneGeometry(panelW * 0.965, panelH * 0.965, 0.08),
    new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      toneMapped: false,
      opacity: 1,
      depthWrite: false,
    }),
  );
  front.position.z = 0.018;
  group.add(front);
  setMaterialOpacity(group, 0);
  root.add(group);
  return group;
}

const connectorMat = new THREE.LineBasicMaterial({

const captionEntries = [
  { start: 0, end: 3600, title: 'MUSIXQUARE', sub: '작은 기기들이 하나의 공간을 채웁니다' },
  { start: 3600, end: 8600, title: '기기들이 하나의 사운드로', sub: '역할을 고르면 같은 음악이 동시에 재생됩니다' },
  { start: 8600, end: 13600, title: '재생목록은 함께 움직이고', sub: '방장이 넘기는 순간 모두의 화면이 따라옵니다' },
  { start: 13600, end: 18600, title: 'QR 하나로 바로 연결', sub: '초대 코드를 공유하고 곧장 같은 세션으로' },
  { start: 18600, end: 23600, title: '내 공간에 맞게 조정', sub: '테마, 역할, 사운드를 가볍게 커스텀하세요' },
  { start: 23600, end: DURATION, title: '작게, 선명하게, 바로 시작', sub: 'MUSIXQUARE로 공간형 플레이를 시작하세요' },
];

let lastScreenMode = '';

function updateCaption(ms) {
  const entry = captionEntries.find(c => ms >= c.start && ms < c.end) || captionEntries[captionEntries.length - 1];
  titleEl.textContent = entry.title;
  subEl.textContent = entry.sub;
  const fade = 520;
  const inP = smooth((ms - entry.start) / fade);
  const outP = smooth((entry.end - ms) / fade);
  const opacity = Math.min(inP, outP);
  titleEl.style.opacity = String(opacity);
  subEl.style.opacity = String(opacity * 0.86);
  titleEl.style.transform = `translateY(${18 * (1 - inP)}px)`;
  subEl.style.transform = `translateY(${12 * (1 - inP)}px)`;
}

function updatePhone(ms) {
  const intro = smoother(phase(ms, 0, 2600));
  const final = smoother(phase(ms, 23600, 27000));
  phoneGroup.position.set(
    mix(0, 0, intro),
    mix(-0.35, -0.72, final),
    mix(-2.6, 0.0, intro),
  );
  const orbit = wave(ms, 0.55) * 0.035;
  phoneGroup.rotation.x = mix(0.52, -0.035, intro) + wave(ms, 0.45, 1.7) * 0.012;
  phoneGroup.rotation.y = mix(-0.86, -0.17, intro) + orbit + final * 0.12;
  phoneGroup.rotation.z = mix(0.12, -0.03, intro) + wave(ms, 0.35) * 0.006;
  const scale = mix(0.64, 1.0, intro) * mix(1.0, 0.92, final);
  phoneGroup.scale.setScalar(scale);
  shadow.material.opacity = mix(0.0, 0.42, intro) * mix(1.0, 0.78, final);
  shadow.scale.setScalar(mix(0.55, 1.0, intro));
  floorLine.style.opacity = String(mix(0.0, 1.0, intro) * 0.76);
}

function updatePanels(ms) {
  const finalP = smoother(phase(ms, 23600, 26800));
  panels.forEach((panel, index) => {
    const { group } = panel;
    const introP = smoother(phase(ms, panel.start, panel.start + 900));
    const dockP = smoother(phase(ms, panel.end - 1250, panel.end - 300));
    const fadeOut = smoother(phase(ms, panel.end - 620, panel.end));
    let opacity = introP * (1 - fadeOut);
    if (ms < panel.start || ms > panel.end) opacity = 0;

    const activePos = [
      panel.active[0],
      panel.active[1] + wave(ms, 0.8, index) * 0.1,
      panel.active[2] + wave(ms, 0.55, index * 0.6) * 0.07,
    ];
    const activeRot = [
      panel.rActive[0] + wave(ms, 0.45, index) * 0.02,
      panel.rActive[1] + wave(ms, 0.38, index + 2) * 0.03,
      panel.rActive[2],
    ];

    setVec(group, panel.from, activePos, introP);
    setRot(group, panel.rFrom, activeRot, introP);
    if (dockP > 0) {
      setVec(group, group.position.toArray(), panel.dock, dockP);
      setRot(group, group.rotation.toArray(), panel.rDock, dockP);
      group.scale.setScalar(mix(1.0, 0.42, dockP));
    } else {
      group.scale.setScalar(1);
    }

    if (finalP > 0.01) {
      const reveal = smoother(phase(ms, 23800 + index * 190, 25800 + index * 190));
      const currentPos = group.position.toArray();
      setVec(group, currentPos, panel.final, finalP);
      setRot(group, group.rotation.toArray(), panel.rFinal, finalP);
      group.scale.setScalar(mix(group.scale.x, 0.74, finalP));
      opacity = Math.max(opacity, reveal * 0.9);
    }

    setMaterialOpacity(group, opacity);

    const line = connectorLines[index];
    const lineOpacity = opacity * (1 - dockP) * (1 - finalP * 0.25);
    line.material.opacity = lineOpacity * 0.38;
    line.visible = lineOpacity > 0.05;
    const pos = line.geometry.attributes.position;
    pos.setXYZ(0, group.position.x, group.position.y, group.position.z - 0.06);
    pos.setXYZ(1, phoneGroup.position.x, phoneGroup.position.y + 0.15, phoneGroup.position.z + 0.04);
    pos.needsUpdate = true;
  });
}

function updateScreen(ms) {
  const mode = screenModeAt(ms);
  if (mode !== lastScreenMode || mode === 'player') {
    screenDrawers[mode](ms);
    screenTexture.needsUpdate = true;
    lastScreenMode = mode;
  }
}

function updateCamera(ms) {
  const p = smoother(phase(ms, 0, 2600));
  const final = smoother(phase(ms, 23600, 27000));
  camera.position.x = mix(0.2, 0, p) + wave(ms, 0.22) * 0.035;
  camera.position.y = mix(0.62, 0.28, p) + final * -0.12;
  camera.position.z = mix(13.8, 11.8, p) + final * 0.65;
  camera.lookAt(0, -0.18 - final * 0.3, 0);
}

function updateLights(ms) {
  const pulse = 0.5 + 0.5 * wave(ms, 1.1);
  blueLight.intensity = 24 + pulse * 8;
  mintLight.intensity = 19 + (1 - pulse) * 7;
}

function renderAt(ms) {
  const t = Math.max(0, Math.min(DURATION, ms));
  updateCaption(t);
  updateCamera(t);
  updatePhone(t);
  updatePanels(t);
  updateScreen(t);
  updateLights(t);
  renderer.render(scene, camera);
}

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderAt(window.__promoCurrentTime || 0);
}

window.addEventListener('resize', resize);

window.__promoSetTime = function(ms) {
  window.__promoCurrentTime = ms;
  renderAt(ms);
};

function startAutoplay() {
  const started = performance.now();
  const loop = () => {
    const elapsed = (performance.now() - started) % DURATION;
    window.__promoSetTime(elapsed);
    requestAnimationFrame(loop);
  };
  loop();
}

await document.fonts.ready;
renderAt(0);
loading.classList.add('hidden');
window.sceneReady = true;

const params = new URLSearchParams(location.search);
if (params.get('autoplay') === 'true') startAutoplay();
