<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:22px 24px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;}
.section{background:var(--surface-1);border-radius:20px;padding:18px 20px;min-width:260px;}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.title{font-size:15px;font-weight:700;}
.badge{font-size:9px;font-weight:800;letter-spacing:0.1em;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--text-sub);text-transform:uppercase;}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub);font-weight:600;margin-bottom:6px;}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:32px;background:transparent;border-radius:100px;outline:none;cursor:pointer;--range-progress:0%;}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:100px;background:linear-gradient(to right,var(--range-fill-idle) 0%,var(--range-fill-idle) var(--range-progress),var(--surface-2) var(--range-progress),var(--surface-2) 100%);}
input[type=range]:active::-webkit-slider-runnable-track{height:8px;background:linear-gradient(to right,var(--range-fill-active) 0%,var(--range-fill-active) var(--range-progress),var(--surface-2) var(--range-progress),var(--surface-2) 100%);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border:0;opacity:0;}
input[type=range]::-moz-range-track{height:6px;border-radius:100px;background:linear-gradient(to right,var(--range-fill-idle) 0%,var(--range-fill-idle) var(--range-progress),var(--surface-2) var(--range-progress),var(--surface-2) 100%);}
input[type=range]:active::-moz-range-track{height:8px;background:linear-gradient(to right,var(--range-fill-active) 0%,var(--range-fill-active) var(--range-progress),var(--surface-2) var(--range-progress),var(--surface-2) 100%);}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0;opacity:0;}
</style></head><body><div class="card">
<div class="section">
  <div class="hdr"><span class="title">Reverb</span><span class="badge">HOST-CTRL</span></div>
  <div class="row"><span>Mix</span><span>35%</span></div>
  <input type="range" value="35" style="--range-progress:35%">
</div>
<div class="section">
  <div class="hdr"><span class="title">Equalizer</span><span class="badge">SELF-CTRL</span></div>
  <div class="row"><span>Low-pass</span><span>12.5 kHz</span></div>
  <input type="range" value="60" style="--range-progress:60%">
</div>
</div></body></html>
