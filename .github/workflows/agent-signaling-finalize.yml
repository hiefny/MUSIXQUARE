name: Dispatch Main Signaling Liveness Repair

on:
  push:
    branches:
      - agent/signaling-liveness-recovery
    paths:
      - '.github/workflows/agent-signaling-finalize.yml'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: dispatch-main-signaling-liveness-repair
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the main repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run agent-signaling-finalize-v4.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh pr comment 82 --repo "$GITHUB_REPOSITORY" --body "Dispatched the main signaling repair workflow from ${GITHUB_SHA}. The main workflow will report its exact run URL and final result here." || true
