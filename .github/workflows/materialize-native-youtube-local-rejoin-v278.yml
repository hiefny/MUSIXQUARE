name: Materialize Native YouTube Local Rejoin v278

on:
  push:
    branches:
      - agent/localize-native-youtube-controls-v278
    paths:
      - .github/agent-materialize-native-youtube-local-rejoin-v278

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: musixquare-materialize-native-youtube-local-rejoin-v278
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEASE_PR: '36'
      FEATURE_BRANCH: agent/localize-native-youtube-controls-v278

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused v278 patch
        run: python scripts/apply-native-youtube-local-rejoin-v278.py

      - name: Remove temporary materializer
        run: |
          rm .github/agent-materialize-native-youtube-local-rejoin-v278
          rm .github/workflows/materialize-native-youtube-local-rejoin-v278.yml
          rm scripts/apply-native-youtube-local-rejoin-v278.py

      - name: Format changed TypeScript
        run: >-
          npx prettier --write
          src/youtube/native-control-authority.ts
          src/youtube/native-control-policy.ts
          src/youtube/__tests__/native-control-authority.test.ts
          src/youtube/__tests__/native-control-policy.test.ts

      - name: Verify focused source scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            .github/agent-materialize-native-youtube-local-rejoin-v278 \
            .github/workflows/materialize-native-youtube-local-rejoin-v278.yml \
            public/service-worker.js \
            scripts/apply-native-youtube-local-rejoin-v278.py \
            src/core/__tests__/service-worker-cache.test.ts \
            src/youtube/__tests__/native-control-authority.test.ts \
            src/youtube/__tests__/native-control-policy.test.ts \
            src/youtube/native-control-authority.ts \
            src/youtube/native-control-policy.ts | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Unexpected working-tree scope'
            echo 'Expected:'
            printf '%s\n' "$expected"
            echo 'Actual:'
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

      - name: Production build
        run: npm run build:checked

      - name: Commit clean v278 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MUSIXQUARE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(youtube): keep native media controls endpoint-local'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push feature branch
        run: git push origin HEAD:${{ env.FEATURE_BRANCH }}

      - name: Report successful materialization
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: >-
          gh pr comment "$RELEASE_PR"
          --body "Clean v278 source materialized and fully validated at \`$COMMIT_SHA\`. Temporary workflow/script files were removed; normal PR CI can now verify the production-only diff."

      - name: Report materialization failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment "$RELEASE_PR"
          --body "v278 materialization failed in Actions run \`$GITHUB_RUN_ID\`. No production source was merged or deployed."
