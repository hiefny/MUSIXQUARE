name: One-shot Signaling Liveness Production Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-signaling-production.yml'
      - 'scripts/one-shot-signaling-liveness-patch.mjs'
      - 'scripts/one-shot-signaling-liveness-patch-base.mjs'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: musixquare-one-shot-signaling-production
  cancel-in-progress: true

jobs:
  repair-validate-deploy-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Publish starting status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 82 --body "Signaling liveness production repair started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Require unchanged main ownership
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Apply exact WebSocket liveness repair and remove transient files
        run: node scripts/one-shot-signaling-liveness-patch.mjs

      - name: Advance release identity and write design record
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ('package.json', 'package-lock.json'):
              path = Path(name)
              document = json.loads(path.read_text(encoding='utf-8'))
              if document.get('version') != '8.3.72':
                  raise SystemExit(f'{name}: unexpected version {document.get("version")!r}')
              document['version'] = '8.3.73'
              if name == 'package-lock.json':
                  root = document.get('packages', {}).get('')
                  if not isinstance(root, dict) or root.get('version') != '8.3.72':
                      raise SystemExit('package-lock.json: unexpected root package version')
                  root['version'] = '8.3.73'
              path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cat > docs/design/signaling-liveness.md <<'EOF'
          # Signaling WebSocket Liveness and Invite Recovery

          - **Status:** Accepted
          - **Decision date:** 2026-08-19
          - **Applies to:** Cloudflare standard-room and PRO signaling transports

          ## Problem

          Windows Chromium can retain a signaling WebSocket in the `OPEN` state after the
          network route disappears. Existing WebRTC data channels may continue to work,
          but the room can no longer admit a new device. Waiting only for WebSocket
          `close` or `error` therefore leaves the QR invite action showing **Copy invite
          link** while the signaling path is unusable.

          ## Decision

          The signaling Worker advertises protocol version 1 in the authenticated
          `peer-open` frame. Upgraded clients then send one fixed application-level ping
          on the exact admitted WebSocket every five seconds. Cloudflare Durable Objects
          answer the fixed frame with `setWebSocketAutoResponse()` so the room object does
          not need to wake for normal probes; local and compatibility runtimes retain an
          explicit fallback response.

          A socket that does not produce a pong or any other server message within the
          bounded timeout is identity-fenced out of transport state before it is closed.
          The existing `disconnected` lifecycle then drives the 1/2/4/8/15-second retry
          budget and `network.signalingHealth`, so the current QR action changes to
          **Recovering** without a second UI state machine. Browser `offline` starts the
          same recovery immediately, and `online` requests an immediate retry.

          ## Compatibility and lifecycle

          - Monitoring starts only after the Worker advertises support, so either side of
            a rolling deployment remains compatible.
          - A late pong or close from a superseded socket cannot mutate its replacement.
          - Existing WebRTC data channels and system-audio media are preserved while only
            the signaling socket generation is rebuilt.
          - Long background timer gaps re-arm monitoring instead of declaring a false
            outage.
          - UI layout, copy, and room flows are unchanged.
          - Media loading remains best-effort and RAM-only. The 200 MiB value remains a
            transfer/private-storage protocol ceiling, not a device-memory admission
            limit.

          ## Verification

          Focused transport and Worker tests cover unresponsive sockets, healthy pong
          traffic, legacy Workers, browser offline/online transitions, superseded socket
          generations, and the Durable Object fallback. Full type, lint, unit, browser,
          Worker, production-build, and release-candidate checks remain deployment gates.
          EOF

      - name: Format touched sources
        run: >-
          npx prettier --write
          src/network/transport/signaling-liveness.ts
          src/network/transport/__tests__/signaling-liveness.test.ts
          src/network/transport/cloudflare-signaling.ts
          src/network/transport/types.ts
          src/network/peer.ts
          cloudflare/signaling-worker.ts
          .github/workflows/ci.yml
          scripts/release-evidence.mts
          scripts/service-worker-asset.ts
          docs/design/signaling-liveness.md
          package.json
          package-lock.json
          index.html

      - name: Verify clean patch shape
        run: |
          test ! -e .github/workflows/one-shot-signaling-production.yml
          test ! -e scripts/one-shot-signaling-liveness-patch.mjs
          test ! -e scripts/one-shot-signaling-liveness-patch-base.mjs
          git diff --check

      - name: Focused signaling tests
        run: >-
          npx vitest run
          src/network/transport/__tests__/signaling-liveness.test.ts
          src/network/transport/__tests__/cloudflare-signaling.test.ts
          src/network/transport/__tests__/cloudflare-signaling-worker.test.ts
          src/network/__tests__/signaling-health.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and formatting contracts
        run: |
          npm run lint
          npm run format:check

      - name: Full unit suite
        run: npm test

      - name: Checked production build
        run: npm run build:checked

      - name: Bundle every production Worker
        run: npm run check:worker-bundles

      - name: Commit validated clean source to main
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: detect half-open signaling outages'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "final_sha=${final_sha}" >> "$GITHUB_OUTPUT"
          gh pr comment 82 --body "Clean signaling repair committed to main at ${final_sha}; exact-SHA CI is starting."

      - name: Dispatch and wait for exact-SHA CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          gh workflow run ci.yml --ref main
          run_id=''
          for _ in $(seq 1 90); do
            run_id="$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --commit "$FINAL_SHA" --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          gh pr comment 82 --body "Exact-SHA CI: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh run watch "$run_id" --exit-status --interval 10

      - name: Dispatch and wait for full production release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          gh workflow run release.yml --ref main -f target=all -f apply_developer_api_d1=false
          run_id=''
          for _ in $(seq 1 90); do
            run_id="$(gh run list --workflow release.yml --branch main --event workflow_dispatch --commit "$FINAL_SHA" --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          gh pr comment 82 --body "Full app+signaling production release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh run watch "$run_id" --exit-status --interval 15

      - name: Verify live SW and signaling capability
        id: live
        env:
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          sw_ok='false'
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://musixquare.com/service-worker.js?verify=${FINAL_SHA}" | grep -q 'v460'; then
              sw_ok='true'
              break
            fi
            sleep 5
          done
          test "$sw_ok" = 'true'

          node --input-type=module <<'NODE' > live-signaling-verification.json
          import { randomBytes, randomInt, randomUUID } from 'node:crypto';
          import WebSocket from 'ws';

          const roomId = String(randomInt(100000, 1000000));
          const peerId = `verify-${randomUUID().replaceAll('-', '').slice(0, 20)}`;
          const secret = randomBytes(24).toString('base64url');
          const url = new URL(`wss://signal.musixquare.com/api/rooms/${roomId}/ws`);
          url.searchParams.set('role', 'host');
          url.searchParams.set('peerId', peerId);
          const ping = '{"type":"signaling-liveness-ping","version":1}';
          const pong = '{"type":"signaling-liveness-pong","version":1}';

          const result = await new Promise((resolve, reject) => {
            const socket = new WebSocket(url, { origin: 'https://musixquare.com' });
            let workerVersionId = '';
            let capability = 0;
            const timer = setTimeout(() => {
              socket.terminate();
              reject(new Error('LIVE_SIGNALING_LIVENESS_TIMEOUT'));
            }, 15000);
            const finish = (value) => {
              clearTimeout(timer);
              try { socket.close(1000, 'verification complete'); } catch {}
              resolve(value);
            };
            socket.once('open', () => {
              socket.send(JSON.stringify({ type: 'host-auth', secret }));
            });
            socket.on('message', (data) => {
              const raw = data.toString();
              if (raw === pong) {
                finish({ workerVersionId, signalingLivenessVersion: capability, pong: true });
                return;
              }
              let message;
              try { message = JSON.parse(raw); } catch { return; }
              if (message?.type !== 'peer-open') return;
              workerVersionId = typeof message.workerVersionId === 'string' ? message.workerVersionId : '';
              capability = message.signalingLivenessVersion;
              if (capability !== 1) {
                clearTimeout(timer);
                socket.terminate();
                reject(new Error(`LIVE_SIGNALING_CAPABILITY_${String(capability)}`));
                return;
              }
              socket.send(ping);
            });
            socket.once('error', reject);
          });

          console.log(JSON.stringify(result));
          NODE

          cat live-signaling-verification.json

      - name: Close superseded PR and cancel branch runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          for status in queued in_progress waiting requested; do
            gh run list --branch agent/signaling-liveness-recovery --status "$status" --limit 50 --json databaseId --jq '.[].databaseId' | while read -r run_id; do
              [ -z "$run_id" ] || gh run cancel "$run_id" || true
            done
          done
          gh pr close 82 --comment "Superseded by deployed main commit ${FINAL_SHA}. SW v460 and signaling liveness capability v1 were verified live." --delete-branch

      - name: Publish completion status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          gh pr comment 82 --body "Production verification complete for ${FINAL_SHA}: SW v460 is live and the signaling Worker advertises capability v1 with a successful pong."

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 82 --body "Production repair failed closed. No later gate was advanced after the failing step: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
