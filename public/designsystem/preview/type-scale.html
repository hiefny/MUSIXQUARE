<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:18px 24px;display:grid;grid-template-columns:90px 1fr;gap:6px 18px;align-items:baseline;}
.tag{font-size:10px;font-weight:800;color:var(--text-sub);letter-spacing:0.08em;text-transform:uppercase;}
.s28{font-size:28px;font-weight:800;letter-spacing:-0.03em;}
.s24{font-size:24px;font-weight:800;letter-spacing:-0.03em;}
.s20{font-size:20px;font-weight:700;letter-spacing:-0.5px;}
.s16{font-size:16px;font-weight:500;}
.s14{font-size:14px;font-weight:600;}
.s12{font-size:12px;font-weight:600;color:var(--text-sub);}
</style></head><body><div class="card">
<div class="tag">28/800</div><div class="s28">메인 · Home</div>
<div class="tag">24/800</div><div class="s24">Set this device's role</div>
<div class="tag">20/700</div><div class="s20">Track title (Pretendard)</div>
<div class="tag">16/500</div><div class="s16">Enter 6-digit code</div>
<div class="tag">14/600</div><div class="s14">Load local file</div>
<div class="tag">12/600</div><div class="s12">00:42 / 03:18</div>
</div></body></html>
