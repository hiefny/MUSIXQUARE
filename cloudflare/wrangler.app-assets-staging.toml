# Isolated routing probe for the Static Assets experiment.
# It has no production route, cron, D1, R2, KV, Durable Object, service binding,
# or secret. Deploying it can only expose the copied staging asset directory.
name = "musixquare-app-assets-staging"
main = "app-assets-staging-worker.js"
compatibility_date = "2026-05-04"
workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1.0

[assets]
directory = "../scratch/app-assets-staging-dist"
binding = "ASSETS"
html_handling = "none"
# Negative patterns take precedence. The three extensions are the complete
# current Vite /assets output; the preparation guard rejects a new extension
# until its MIME and security behavior is reviewed explicitly.
run_worker_first = ["/*", "!/assets/*.js", "!/assets/*.css", "!/assets/*.woff2"]
