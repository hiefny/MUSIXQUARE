name: One-shot Media Session Authority Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-media-session-hotfix.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: musixquare-agent-media-session-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    if: >-
      github.event.head_commit.message == 'chore: run media-session authority hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply native media-control authority hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          media_path = Path("src/player/media-session.ts")
          source = media_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              "import type { PlaybackActivityValue } from '../core/constants.ts';",
              "import { MSG, type PlaybackActivityValue } from '../core/constants.ts';",
              "constants import",
          )
          source = replace_once(
              source,
              "import { getRoomContext, hasRoomCapability } from '../rooms/authority.ts';",
              "import { getRoomContext, hasRoomCapability } from '../rooms/authority.ts';\n"
              "import { routeProPlaybackCommand } from '../pro-room/playback-authority-hooks.ts';",
              "PRO authority import",
          )

          authority_helpers = r"""
          type YouTubeMediaAction = 'play' | 'pause';
          type YouTubeActivity = 'playing' | 'paused';

          // A YouTube iframe may apply a hardware/lock-screen action before the
          // top-level Media Session callback runs. Remember only the exact
          // paused<->playing edge for a short window, then consume it once.
          // This recovers the user's explicit desired action without turning
          // duplicate Bluetooth wrapper callbacks into a second room command.
          const NATIVE_YOUTUBE_ACTION_WINDOW_MS = 2_500;
          let observedPlaybackMode = getState('playback.mode');
          let observedPlaybackActivity = getState('playback.activity');
          let recentYouTubeTransition: {
            from: YouTubeActivity;
            to: YouTubeActivity;
            at: number;
            consumed: boolean;
          } | null = null;
          let lastRoutedYouTubeAction: { action: YouTubeMediaAction; at: number } | null = null;

          bus.on('state:playback.mode', () => {
            observedPlaybackMode = getState('playback.mode');
            if (observedPlaybackMode !== 'youtube') recentYouTubeTransition = null;
          });
          bus.on('state:playback.activity', () => {
            const nextMode = getState('playback.mode');
            const nextActivity = getState('playback.activity');
            if (
              nextMode === 'youtube' &&
              observedPlaybackMode === 'youtube' &&
              ((observedPlaybackActivity === 'playing' && nextActivity === 'paused') ||
                (observedPlaybackActivity === 'paused' && nextActivity === 'playing'))
            ) {
              recentYouTubeTransition = {
                from: observedPlaybackActivity as YouTubeActivity,
                to: nextActivity as YouTubeActivity,
                at: Date.now(),
                consumed: false,
              };
            }
            observedPlaybackMode = nextMode;
            observedPlaybackActivity = nextActivity;
          });

          const markRoutedYouTubeAction = (action: YouTubeMediaAction): void => {
            lastRoutedYouTubeAction = { action, at: Date.now() };
          };

          const consumePreappliedYouTubeAction = (action: YouTubeMediaAction): boolean => {
            const desiredActivity: YouTubeActivity = action === 'play' ? 'playing' : 'paused';
            const priorActivity: YouTubeActivity = action === 'play' ? 'paused' : 'playing';
            if (
              getState('playback.mode') !== 'youtube' ||
              getState('playback.activity') !== desiredActivity
            ) {
              return false;
            }

            const transition = recentYouTubeTransition;
            const now = Date.now();
            if (
              !transition ||
              transition.consumed ||
              transition.from !== priorActivity ||
              transition.to !== desiredActivity ||
              now < transition.at ||
              now - transition.at > NATIVE_YOUTUBE_ACTION_WINDOW_MS
            ) {
              return false;
            }

            transition.consumed = true;
            return !(
              lastRoutedYouTubeAction?.action === action &&
              now >= lastRoutedYouTubeAction.at &&
              now - lastRoutedYouTubeAction.at <= NATIVE_YOUTUBE_ACTION_WINDOW_MS
            );
          };

          const getYouTubePosition = (): number => {
            let positionSeconds = 0;
            bus.emit('youtube:get-position', (position) => {
              if (Number.isFinite(position)) positionSeconds = Math.max(0, position);
            });
            return positionSeconds;
          };

          const requestAuthoritativeYouTubeAction = (action: YouTubeMediaAction): void => {
            const queueItemId = getCurrentQueueItemId();
            if (!queueItemId) return;

            const positionSeconds = getYouTubePosition();
            const room = getRoomContext();
            if (room.kind === 'pro') {
              routeProPlaybackCommand(
                {
                  kind: action,
                  queueItemId,
                  positionSeconds,
                },
                { wasPlaying: action === 'pause' },
              );
              return;
            }

            const hostConn = getState('network.hostConn');
            if (hostConn) {
              if (!hasRoomCapability('playback.control') || hostConn.open === false) return;
              try {
                hostConn.send({
                  type:
                    action === 'play'
                      ? MSG.REQUEST_YOUTUBE_PLAY
                      : MSG.REQUEST_YOUTUBE_PAUSE,
                  queueItemId,
                });
              } catch (error) {
                log.warn(`[MediaSession] Failed to relay YouTube ${action} intent`, error);
              }
              return;
            }

            // Standard-room host: use the same scheduled state path as the
            // in-app controls. PLAY therefore includes hostPlayAt and guests
            // enter rendezvous instead of accepting the iframe's immediate,
            // unscheduled PLAYING observation.
            bus.emit('youtube:auto-play', {
              targetTime: positionSeconds,
              skipSeek: false,
              state: action === 'play' ? 1 : 2,
            });
          };
          """.strip("\n")

          source = replace_once(
              source,
              "  const isNonOperatorGuest = isPlaybackBlocked;\n",
              "  const isNonOperatorGuest = isPlaybackBlocked;\n\n"
              + "\n".join("  " + line if line else "" for line in authority_helpers.splitlines())
              + "\n",
              "authority helper insertion",
          )

          source = replace_once(
              source,
              """      if (isPlaybackPlayingYouTube()) return;
              togglePlay();
              return;""",
              """      if (isPlaybackPlayingYouTube()) {
                if (!consumePreappliedYouTubeAction('play')) return;
                markRoutedYouTubeAction('play');
                requestAuthoritativeYouTubeAction('play');
                return;
              }
              markRoutedYouTubeAction('play');
              togglePlay();
              return;""",
              "YouTube play handler",
          )

          source = replace_once(
              source,
              """      if (!isPlaybackPlayingYouTube()) return;
              togglePlay();
              return;""",
              """      if (!isPlaybackPlayingYouTube()) {
                if (!consumePreappliedYouTubeAction('pause')) return;
                markRoutedYouTubeAction('pause');
                requestAuthoritativeYouTubeAction('pause');
                return;
              }
              markRoutedYouTubeAction('pause');
              togglePlay();
              return;""",
              "YouTube pause handler",
          )

          media_path.write_text(source, encoding="utf-8")

          test_path = Path("src/player/__tests__/media-session-os-authority.test.ts")
          if test_path.exists():
              raise SystemExit(f"{test_path} already exists")
          test_path.write_text(
              r"""/**
           * @vitest-environment jsdom
           */
          import { beforeEach, describe, expect, it, vi } from 'vitest';

          const mocks = vi.hoisted(() => ({
            togglePlay: vi.fn(),
            routeProPlaybackCommand: vi.fn(() => true),
            pendingInterruption: vi.fn(() => false),
            resumeInterruption: vi.fn(async () => ({ running: true, rejoinEmitted: false })),
          }));

          vi.mock('../transport.ts', () => ({
            togglePlay: mocks.togglePlay,
            stopPlayback: vi.fn(),
            skipTime: vi.fn(),
            pause: vi.fn(),
          }));

          vi.mock('../../pro-room/playback-authority-hooks.ts', () => ({
            routeProPlaybackCommand: mocks.routeProPlaybackCommand,
          }));

          vi.mock('../../audio/context-recovery.ts', () => ({
            hasPendingAudioContextInterruption: mocks.pendingInterruption,
            resumePendingAudioContextInterruptionFromGesture: mocks.resumeInterruption,
          }));

          const handlers: Record<string, (details?: Record<string, unknown>) => void> = {};
          Object.defineProperty(navigator, 'mediaSession', {
            value: {
              metadata: null,
              playbackState: 'none',
              setActionHandler: vi.fn(
                (action: string, handler: ((details?: Record<string, unknown>) => void) | null) => {
                  if (handler) handlers[action] = handler;
                  else delete handlers[action];
                },
              ),
            },
            configurable: true,
            writable: true,
          });

          globalThis.MediaMetadata = class MediaMetadata {
            title: string;
            artist: string;
            album: string;
            artwork: MediaImage[];

            constructor(init: {
              title?: string;
              artist?: string;
              album?: string;
              artwork?: MediaImage[];
            } = {}) {
              this.title = init.title ?? '';
              this.artist = init.artist ?? '';
              this.album = init.album ?? '';
              this.artwork = init.artwork ?? [];
            }
          } as unknown as typeof MediaMetadata;

          import { bus } from '../../core/events.ts';
          import { resetState, setState } from '../../core/state.ts';
          import { MSG } from '../../core/constants.ts';
          import { initMediaSession } from '../media-session.ts';

          const QUEUE_ITEM_ID = '00000000-0000-4000-8000-000000000001';
          const POSITION_SECONDS = 42.25;

          function setYouTubeState(activity: 'paused' | 'playing'): void {
            setState('playback.mode', 'youtube');
            setState('playback.activity', activity);
          }

          beforeEach(() => {
            resetState();
            bus.clear();
            vi.clearAllMocks();
            for (const action of Object.keys(handlers)) delete handlers[action];
            navigator.mediaSession.playbackState = 'none';

            initMediaSession();
            setState('playlist.currentQueueItemId', QUEUE_ITEM_ID);
            bus.on('youtube:get-position', (callback) => callback(POSITION_SECONDS));
          });

          describe('native YouTube OS media actions', () => {
            it('turns a standard-host preapplied PLAY into a scheduled rendezvous', () => {
              const autoPlay = vi.fn();
              bus.on('youtube:auto-play', autoPlay);
              setYouTubeState('paused');
              setState('playback.activity', 'playing');

              handlers.play?.();

              expect(autoPlay).toHaveBeenCalledWith({
                targetTime: POSITION_SECONDS,
                skipSeek: false,
                state: 1,
              });
              expect(mocks.togglePlay).not.toHaveBeenCalled();
            });

            it('turns a standard-host preapplied PAUSE into an authoritative paused state', () => {
              const autoPlay = vi.fn();
              bus.on('youtube:auto-play', autoPlay);
              setYouTubeState('playing');
              setState('playback.activity', 'paused');

              handlers.pause?.();

              expect(autoPlay).toHaveBeenCalledWith({
                targetTime: POSITION_SECONDS,
                skipSeek: false,
                state: 2,
              });
              expect(mocks.togglePlay).not.toHaveBeenCalled();
            });

            it('routes a PRO controller preapplied PAUSE through server authority', () => {
              setState('room.context', {
                kind: 'pro',
                roomId: '000001',
                role: 'member',
                coordinatorId: null,
                epoch: 7,
                snapshotRevision: 11,
                capabilities: ['playback.control'],
              });
              setYouTubeState('playing');
              setState('playback.activity', 'paused');

              handlers.pause?.();

              expect(mocks.routeProPlaybackCommand).toHaveBeenCalledWith(
                {
                  kind: 'pause',
                  queueItemId: QUEUE_ITEM_ID,
                  positionSeconds: POSITION_SECONDS,
                },
                { wasPlaying: true },
              );
              expect(mocks.togglePlay).not.toHaveBeenCalled();
            });

            it('routes a PRO controller preapplied PLAY through server authority', () => {
              setState('room.context', {
                kind: 'pro',
                roomId: '000001',
                role: 'member',
                coordinatorId: null,
                epoch: 7,
                snapshotRevision: 11,
                capabilities: ['playback.control'],
              });
              setYouTubeState('paused');
              setState('playback.activity', 'playing');

              handlers.play?.();

              expect(mocks.routeProPlaybackCommand).toHaveBeenCalledWith(
                {
                  kind: 'play',
                  queueItemId: QUEUE_ITEM_ID,
                  positionSeconds: POSITION_SECONDS,
                },
                { wasPlaying: false },
              );
              expect(mocks.togglePlay).not.toHaveBeenCalled();
            });

            it('consumes a preapplied transition only once when a wrapper repeats the action', () => {
              const autoPlay = vi.fn();
              bus.on('youtube:auto-play', autoPlay);
              setYouTubeState('paused');
              setState('playback.activity', 'playing');

              handlers.play?.();
              handlers.play?.();

              expect(autoPlay).toHaveBeenCalledOnce();
            });

            it('keeps an ordinary paused PLAY on the established toggle path', () => {
              setYouTubeState('paused');

              handlers.play?.();

              expect(mocks.togglePlay).toHaveBeenCalledOnce();
              expect(mocks.routeProPlaybackCommand).not.toHaveBeenCalled();
            });

            it('relays a preapplied standard-room administrator PLAY explicitly', () => {
              const send = vi.fn();
              setState('network.hostConn', { open: true, send } as never);
              setState('network.isOperator', true);
              setState('network.standardRoomCapabilities', ['playback.control']);
              setYouTubeState('paused');
              setState('playback.activity', 'playing');

              handlers.play?.();

              expect(send).toHaveBeenCalledWith({
                type: MSG.REQUEST_YOUTUBE_PLAY,
                queueItemId: QUEUE_ITEM_ID,
              });
              expect(mocks.togglePlay).not.toHaveBeenCalled();
            });
          });
          """.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

          sw_path = Path("public/service-worker.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = replace_once(
              sw,
              "const CACHE_VERSION = 'v275';",
              "const CACHE_VERSION = 'v276';",
              "service-worker cache version",
          )
          sw_path.write_text(sw, encoding="utf-8")

          sw_test_path = Path("src/core/__tests__/service-worker-cache.test.ts")
          sw_test = sw_test_path.read_text(encoding="utf-8")
          sw_test = replace_once(
              sw_test,
              "const ACTIVE_CACHE_VERSION = 'v275';",
              "const ACTIVE_CACHE_VERSION = 'v276';",
              "service-worker test cache version",
          )
          sw_test_path.write_text(sw_test, encoding="utf-8")

          Path(".github/workflows/agent-media-session-hotfix.yml").unlink()
          PY

      - name: Format changed TypeScript
        run: npx prettier --write src/player/media-session.ts src/player/__tests__/media-session-os-authority.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build and verify production bundle
        run: npm run build:checked

      - name: Verify exact hotfix scope
        shell: bash
        run: |
          expected="$(
            printf '%s\n'               .github/workflows/agent-media-session-hotfix.yml               public/service-worker.js               src/core/__tests__/service-worker-cache.test.ts               src/player/__tests__/media-session-os-authority.test.ts               src/player/media-session.ts               | sort
          )"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected working-tree scope"
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Commit validated hotfix to main
        shell: bash
        run: |
          git config user.name "MUSIXQUARE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/player/media-session.ts \
                  src/player/__tests__/media-session-os-authority.test.ts \
                  public/service-worker.js \
                  src/core/__tests__/service-worker-cache.test.ts \
                  .github/workflows/agent-media-session-hotfix.yml
          git commit -m "fix(media-session): synchronize native YouTube controls"
          git push origin HEAD:main

      - name: Dispatch production app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f target=app
