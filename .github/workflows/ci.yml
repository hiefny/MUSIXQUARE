name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: musixquare-native-control-v277-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-validated-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused v277 patch
        run: python scripts/apply-native-youtube-control-v277.py

      - name: Normalize generated authority types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          authority_path = Path('src/youtube/native-control-authority.ts')
          authority = authority_path.read_text(encoding='utf-8')

          def replace_authority_once(old: str, new: str, label: str) -> None:
              global authority
              count = authority.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              authority = authority.replace(old, new, 1)

          replace_authority_once(
              "import { getCurrentQueueItemId, getQueueItemById } from '../player/queue-model.ts';\n",
              "import { getCurrentQueueItemId, getQueueItemById } from '../player/queue-model.ts';\n"
              "import { isPlaybackActivityValue } from '../player/ownership.ts';\n",
              'ownership import',
          )
          replace_authority_once(
              "bus.emit('youtube:set-local-paused', false, 'iframe-native-play');",
              "bus.emit('youtube:set-local-paused', false, 'media-session-play');",
              'local rejoin reason',
          )
          replace_authority_once(
              "function handlePlaybackActivity(nextActivity: PlaybackActivityValue): void {\n"
              "  const previous = stableActivity(previousActivity);\n",
              "function handlePlaybackActivity(nextActivity: unknown): void {\n"
              "  if (!isPlaybackActivityValue(nextActivity)) return;\n"
              "  const previous = stableActivity(previousActivity);\n",
              'activity runtime guard',
          )
          authority_path.write_text(authority, encoding='utf-8')

          test_path = Path('src/youtube/__tests__/native-control-origin.test.ts')
          test_source = test_path.read_text(encoding='utf-8')
          old_block = """function createPlayer(initialState: number): YouTubePlayerInstance & { state: number } {
            const player = {
              state: initialState,
              playVideo() {
                this.state = 1;
              },
              pauseVideo() {
                this.state = 2;
              },
              getPlayerState() {
                return this.state;
              },
            } as unknown as YouTubePlayerInstance & { state: number };
            return player;
          }
          """.replace('\n          ', '\n').lstrip()
          new_block = """function createPlayer(initialState: number): YouTubePlayerInstance & { state: number } {
            let state = initialState;
            const player = {
              get state() {
                return state;
              },
              set state(value: number) {
                state = value;
              },
              playVideo: () => {
                state = 1;
              },
              pauseVideo: () => {
                state = 2;
              },
              getPlayerState: () => state,
            } as unknown as YouTubePlayerInstance & { state: number };
            return player;
          }
          """.replace('\n          ', '\n').lstrip()
          if test_source.count(old_block) != 1:
              raise SystemExit('origin test player: expected one match')
          test_path.write_text(test_source.replace(old_block, new_block, 1), encoding='utf-8')
          PY

      - name: Remove temporary branch machinery
        run: |
          rm scripts/apply-native-youtube-control-v277.py
          rm .github/workflows/agent-apply-native-youtube-control-v277.yml
          rm .github/agent-apply-native-youtube-control-v277

      - name: Format changed TypeScript
        run: |
          npx prettier --write \
            src/player/media-session.ts \
            src/youtube/native-control-origin.ts \
            src/youtube/native-control-policy.ts \
            src/youtube/native-control-authority.ts \
            src/youtube/__tests__/native-control-origin.test.ts \
            src/youtube/__tests__/native-control-policy.test.ts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-v277.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-youtube-control-v277-typecheck
          path: typecheck-v277.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after typecheck failure
        if: steps.typecheck.outcome != 'success'
        run: exit 1

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Playback and storage static invariants
        run: npm run guard:chunk-pump && npm run guard:lifecycle-writes

      - name: Unit tests
        run: npm test

      - name: Critical runtime coverage
        run: npm run test:coverage:critical

      - name: Production build
        run: npm run build

      - name: Assemble exact patch artifact
        shell: bash
        run: |
          set -euo pipefail
          files=(
            public/service-worker.js
            src/core/__tests__/service-worker-cache.test.ts
            src/player/media-session.ts
            src/youtube/native-control-origin.ts
            src/youtube/native-control-policy.ts
            src/youtube/native-control-authority.ts
            src/youtube/__tests__/native-control-origin.test.ts
            src/youtube/__tests__/native-control-policy.test.ts
          )
          rm -rf patch-artifact
          for path in "${files[@]}"; do
            mkdir -p "patch-artifact/$(dirname "$path")"
            cp "$path" "patch-artifact/$path"
          done
          printf '%s\n' 'src/player/__tests__/media-session-os-authority.test.ts' > patch-artifact/delete-paths.txt

      - name: Upload validated patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-youtube-control-v277-patch
          path: patch-artifact/
          if-no-files-found: error
          retention-days: 3
