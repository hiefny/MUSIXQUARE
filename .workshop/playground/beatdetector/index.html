<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Lag Barrier Beat Detector</title>
    <style>
        :root {
            --bg: #000; --fg: #fff; --hl: #f00;
            --peak-color: rgba(255, 255, 255, 0.15);
            --trig-color: rgba(255, 255, 255, 0.35);
            --ui-bg: rgba(20, 20, 20, 0.98);
        }
        body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; letter-spacing: -0.4px; }
        #ui { position: absolute; left: 15px; top: 15px; background: var(--ui-bg); padding: 18px; display: flex; flex-direction: column; gap: 7px; z-index: 100; width: 270px; border: 1px solid #333; }
        .control-group { display: flex; flex-direction: column; gap: 2px; }
        label { font-size: 8px; text-transform: uppercase; color: #666; font-weight: bold; }
        .val-display { color: #eee; font-size: 10px; float: right; font-family: monospace; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--hl); margin: 2px 0; }
        select { background:#222; color:white; border:1px solid #333; font-size:10px; outline:none; padding:3px; }
        #lamp { position: absolute; top: 0; width: 100%; height: 12px; background: #111; }
        #lamp.active { background: var(--hl); }
        #stage { position: relative; display: flex; align-items: center; justify-content: center; }
        #circle { width: 120px; height: 120px; background: var(--fg); border-radius: 50%; transform: scale(1); z-index: 3; }
        #peak-circle { position: absolute; width: 120px; height: 120px; border: 1.2px solid var(--peak-color); border-radius: 50%; transform: scale(1); z-index: 2; }
        #trigger-circle { position: absolute; width: 120px; height: 120px; border: 1.5px dashed var(--trig-color); border-radius: 50%; transform: scale(1); z-index: 1; }
        #monitor { position: absolute; bottom: 20px; left: 20px; display: flex; align-items: flex-end; gap: 2px; height: 30px; }
        .bar { width: 3px; background: #222; }
        .bar.in-range { background: #555; }
    </style>
</head>
<body>
    <div id="lamp"></div>
    <div id="ui">
        <label style="color:var(--hl); border-bottom: 1px solid #333; padding-bottom: 4px;">Ultimate Controller - All Sliders</label>
        <div class="control-group"><label>1. Audio Source</label><input type="file" id="audioInput" accept="audio/*"></div>
        <div class="control-group">
            <label>FFT Size <span class="val-display" id="fftVal">512</span></label>
            <select id="fftSelect">
                <option value="32">32</option><option value="64">64</option><option value="128">128</option>
                <option value="256">256</option><option value="512" selected>512</option>
                <option value="1024">1024</option><option value="2048">2048</option>
                <option value="4096">4096</option><option value="8192">8192</option>
            </select>
        </div>
        <div class="control-group">
            <label>Smoothness <span class="val-display" id="smoothVal">0.40</span></label>
            <input type="range" id="smoothRange" min="0" max="0.95" step="0.01" value="0.40">
        </div>
        <div class="control-group">
            <label>Peak Decay <span class="val-display" id="decayVal">0.960</span></label>
            <input type="range" id="decayRange" min="0.80" max="0.999" step="0.001" value="0.960">
        </div>
        <div class="control-group">
            <label>Hertz Range <span class="val-display"><span id="minHzVal">0</span> - <span id="maxHzVal">150</span>Hz</span></label>
            <div style="display:flex; gap:10px;">
                <input type="range" id="minHzRange" min="0" max="300" step="1" value="0"><input type="range" id="maxHzRange" min="1" max="800" step="1" value="150">
            </div>
        </div>
        <div class="control-group">
            <label>Barrier Lag (%) <span class="val-display" id="lagVal">20%</span></label>
            <input type="range" id="lagRange" min="1" max="100" step="1" value="20">
        </div>
        <div class="control-group">
            <label>Force Margin (%) <span class="val-display" id="forceVal">15%</span></label>
            <input type="range" id="forceRange" min="1" max="100" step="1" value="15">
        </div>
        <div class="control-group">
            <label>Sensitivity <span class="val-display" id="sensVal">3.5</span></label>
            <input type="range" id="sensRange" min="0.1" max="15.0" step="0.1" value="3.5">
        </div>
    </div>
    <div id="stage"><div id="trigger-circle"></div><div id="peak-circle"></div><div id="circle"></div></div>
    <div id="monitor"></div>
    <script>
        const audioInput = document.getElementById('audioInput'), lamp = document.getElementById('lamp'), circle = document.getElementById('circle'), peakCircle = document.getElementById('peak-circle'), triggerCircle = document.getElementById('trigger-circle'), monitor = document.getElementById('monitor');
        const fftSelect = document.getElementById('fftSelect'), smoothRange = document.getElementById('smoothRange'), decayRange = document.getElementById('decayRange'), minHzRange = document.getElementById('minHzRange'), maxHzRange = document.getElementById('maxHzRange'), lagRange = document.getElementById('lagRange'), forceRange = document.getElementById('forceRange'), sensRange = document.getElementById('sensRange');
        const fftVal = document.getElementById('fftVal'), smoothVal = document.getElementById('smoothVal'), decayVal = document.getElementById('decayVal'), minHzVal = document.getElementById('minHzVal'), maxHzVal = document.getElementById('maxHzVal'), lagVal = document.getElementById('lagVal'), forceVal = document.getElementById('forceVal'), sensVal = document.getElementById('sensVal');
        let audioCtx, analyser, source, dataArray, isLooping = false, currentPeakEnergy = 0, smoothedTriggerEnergy = 0;
        const settings = { fft: 512, smooth: 0.40, decay: 0.96, minHz: 20, maxHz: 150, lag: 0.20, force: 15, sens: 3.5 };
        fftSelect.onchange = (e) => { settings.fft = parseInt(e.target.value); fftVal.textContent = settings.fft; if (analyser) { analyser.fftSize = settings.fft; dataArray = new Uint8Array(analyser.frequencyBinCount); } };
        smoothRange.oninput = (e) => { settings.smooth = parseFloat(e.target.value); smoothVal.textContent = settings.smooth.toFixed(2); if (analyser) analyser.smoothingTimeConstant = settings.smooth; };
        decayRange.oninput = (e) => { settings.decay = parseFloat(e.target.value); decayVal.textContent = settings.decay.toFixed(3); };
        minHzRange.oninput = (e) => { settings.minHz = parseInt(e.target.value); minHzVal.textContent = settings.minHz; };
        maxHzRange.oninput = (e) => { settings.maxHz = parseInt(e.target.value); maxHzVal.textContent = settings.maxHz; };
        lagRange.oninput = (e) => { settings.lag = parseInt(e.target.value) / 100; lagVal.textContent = (settings.lag * 100).toFixed(0) + "%"; };
        forceRange.oninput = (e) => { settings.force = parseInt(e.target.value); forceVal.textContent = settings.force + "%"; };
        sensRange.oninput = (e) => { settings.sens = parseFloat(e.target.value); sensVal.textContent = settings.sens.toFixed(1); };
        audioInput.onchange = function() {
            if (!this.files.length) return;
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); analyser.fftSize = settings.fft; analyser.smoothingTimeConstant = settings.smooth; dataArray = new Uint8Array(analyser.frequencyBinCount); createMonitorBars(); }
            const reader = new FileReader(); reader.onload = (e) => { audioCtx.decodeAudioData(e.target.result, (buffer) => { if (source) source.stop(); source = audioCtx.createBufferSource(); source.buffer = buffer; source.connect(analyser); analyser.connect(audioCtx.destination); source.start(0); if (!isLooping) { isLooping = true; update(); } }); }; reader.readAsArrayBuffer(this.files[0]);
        };
        function createMonitorBars() { monitor.innerHTML = ''; for (let i = 0; i < 64; i++) { const bar = document.createElement('div'); bar.className = 'bar'; monitor.appendChild(bar); } }
        function update() {
            requestAnimationFrame(update); if (!analyser) return; analyser.getByteFrequencyData(dataArray);
            const binSize = audioCtx.sampleRate / settings.fft, minBin = Math.floor(settings.minHz / binSize), maxBin = Math.floor(settings.maxHz / binSize);
            let sum = 0, count = 0; const bars = monitor.children;
            for (let i = 0; i < bars.length; i++) {
                const val = dataArray[i]; if (bars[i]) bars[i].style.height = (val / 255 * 30) + 'px';
                if (i >= minBin && i <= maxBin) { sum += val; count++; if (bars[i]) bars[i].className = 'bar in-range'; } else { if (bars[i]) bars[i].className = 'bar'; }
            }
            const energy = count > 0 ? sum / count : 0;
            currentPeakEnergy = Math.max(currentPeakEnergy * settings.decay, energy);
            const targetTrigger = currentPeakEnergy * (1 + settings.force / 100);
            smoothedTriggerEnergy += (targetTrigger - smoothedTriggerEnergy) * settings.lag;
            const coreScale = 1 + (energy / 255) * settings.sens, peakScale = 1 + (currentPeakEnergy / 255) * settings.sens, triggerScale = 1 + (smoothedTriggerEnergy / 255) * settings.sens;
            circle.style.transform = `scale(${coreScale})`; peakCircle.style.transform = `scale(${peakScale})`; triggerCircle.style.transform = `scale(${triggerScale})`;
            if (energy > smoothedTriggerEnergy && energy > 20) lamp.classList.add('active'); else lamp.classList.remove('active');
        }
    </script>
</body>
</html>
