name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker syntax check
        run: npm run check:workers

      - name: Test
        run: npm test

      - name: Build and verify production bundle
        run: npm run build:checked

      # E2E suite lives in its own workflow (e2e.yml, manual dispatch).
      # The serial suite is intentionally long-running; keep fast CI gating
      # to typecheck + lint + unit tests + build, and run E2E on demand.
