<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:20px 24px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;}
.w{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
.sp{font-size:32px;line-height:1;letter-spacing:-0.02em;}
.lab{font-size:10px;font-weight:700;color:var(--text-sub);letter-spacing:0.08em;text-transform:uppercase;}
</style></head><body><div class="card">
<div class="w"><span class="sp" style="font-weight:400">Aa</span><span class="lab">400 · Regular</span></div>
<div class="w"><span class="sp" style="font-weight:500">Aa</span><span class="lab">500 · Medium</span></div>
<div class="w"><span class="sp" style="font-weight:600">Aa</span><span class="lab">600 · Semibold</span></div>
<div class="w"><span class="sp" style="font-weight:700">Aa</span><span class="lab">700 · Bold</span></div>
<div class="w"><span class="sp" style="font-weight:800">Aa</span><span class="lab">800 · Extrabold</span></div>
</div></body></html>
