name: Build Host Signaling Watchdog Candidate v2

on:
  push:
    branches:
      - agent/host-watchdog-builder-v2

permissions:
  contents: write

concurrency:
  group: host-signaling-watchdog-builder-v2
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout temporary builder branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rebase patch inputs onto clean main
        run: |
          mkdir -p /tmp/musixquare-host-watchdog-patches
          cp scripts/one-shot-signaling-liveness-patch-base.mjs /tmp/musixquare-host-watchdog-patches/
          cp scripts/one-shot-signaling-liveness-patch.mjs /tmp/musixquare-host-watchdog-patches/
          cp scripts/patch-host-signaling-runtime-v2.mjs /tmp/musixquare-host-watchdog-patches/
          cp scripts/finalize-host-signaling-watchdog-v2.mjs /tmp/musixquare-host-watchdog-patches/
          cp scripts/align-host-signaling-release-v2.mjs /tmp/musixquare-host-watchdog-patches/
          git fetch origin main
          git reset --hard origin/main
          mkdir -p scripts .github/workflows
          cp /tmp/musixquare-host-watchdog-patches/*.mjs scripts/
          : > .github/workflows/agent-signaling-liveness.yml

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Apply host-only signaling repair
        run: |
          node scripts/one-shot-signaling-liveness-patch.mjs
          node scripts/patch-host-signaling-runtime-v2.mjs
          node scripts/finalize-host-signaling-watchdog-v2.mjs
          node scripts/align-host-signaling-release-v2.mjs
          git checkout origin/main -- .github/workflows/ci.yml scripts/release-evidence.mts
          rm -f scripts/patch-host-signaling-runtime-v2.mjs
          rm -f scripts/finalize-host-signaling-watchdog-v2.mjs
          rm -f scripts/align-host-signaling-release-v2.mjs

      - name: Format changed product files
        shell: bash
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACM origin/main -- |
              grep -E '\.(ts|mts|js|mjs|json|md|html|yml|yaml)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            npx prettier --write "${changed_files[@]}"
          fi

      - name: Verify product-only change shape
        run: |
          git diff --check
          if git diff --name-only origin/main -- .github/workflows | grep -q .; then
            echo '::error::Existing CI or release workflows changed.'
            exit 1
          fi
          if ! git diff --quiet origin/main -- scripts/release-evidence.mts; then
            echo '::error::Release evidence logic changed.'
            exit 1
          fi
          if git diff --name-only origin/main -- | grep -E '^(css/|src/storage/|src/audio/decode-admission\.ts$)'; then
            echo '::error::UI or media admission policy changed.'
            exit 1
          fi
          if git diff --name-only origin/main -- | grep -E '^scripts/(one-shot|patch-host|finalize-host|align-host)'; then
            echo '::error::Transient builder scripts remain in the product candidate.'
            exit 1
          fi
          git diff --stat origin/main --

      - name: Focused signaling and boundary tests
        run: >-
          npx vitest run
          src/network/transport/__tests__/signaling-liveness.test.ts
          src/network/transport/__tests__/cloudflare-signaling.test.ts
          src/network/transport/__tests__/cloudflare-signaling-worker.test.ts
          src/network/__tests__/signaling-health.test.ts
          src/core/__tests__/room-authority-boundaries.test.ts
          src/core/__tests__/app-worker-cors.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and formatting contracts
        run: |
          npm run lint
          npm run format:check

      - name: Full unit suite
        run: npm test

      - name: Checked production build
        run: npm run build:checked

      - name: Bundle every production Worker
        run: npm run check:worker-bundles

      - name: Publish clean product candidate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C agent/host-signaling-watchdog-candidate-v3
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::No product change was produced.'
            exit 1
          fi
          git commit -m 'fix: recover half-open host signaling sessions'
          git push origin HEAD:refs/heads/agent/host-signaling-watchdog-candidate-v3
