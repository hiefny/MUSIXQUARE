          fi

          verify_file='release-artifacts/deployments/admin-suspension-reason-verified.json'
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('mxqr_pro_room_registry') WHERE name = 'suspension_reason') AS column_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('mxqr_pro_room_registry_suspension_reason_insert_guard', 'mxqr_pro_room_registry_suspension_reason_update_guard')) AS trigger_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('mxqr_pro_room_registry_suspension_reason_insert_guard', 'mxqr_pro_room_registry_suspension_reason_update_guard') AND instr(lower(sql), 'new.suspension_reason is null') > 0) AS null_guard_count, (SELECT COUNT(*) FROM mxqr_pro_room_registry WHERE status = 'suspended' AND (suspension_reason IS NULL OR suspension_reason NOT IN ('operator_suspended', 'owner_account_deleted', 'ownership_transfer_pending'))) AS invalid_suspended_count, (SELECT COUNT(*) FROM mxqr_pro_room_registry WHERE status <> 'suspended' AND suspension_reason IS NOT NULL) AS invalid_active_count" \
            | node scripts/capture-wrangler-d1-json.mjs "$verify_file"
          jq -e '
            .[0].results[0]
            | (.column_count | tonumber) == 1
              and (.trigger_count | tonumber) == 2
              and (.null_guard_count | tonumber) == 2
              and (.invalid_suspended_count | tonumber) == 0
              and (.invalid_active_count | tonumber) == 0
