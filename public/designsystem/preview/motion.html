<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:18px 24px;display:grid;grid-template-columns:130px 1fr 1fr;gap:8px 16px;align-items:center;}
.tag{font-size:10px;font-weight:800;letter-spacing:0.08em;color:var(--text-sub);text-transform:uppercase;}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-main);background:var(--surface-2);padding:3px 6px;border-radius:6px;}
.use{font-size:11px;color:var(--text-sub);}
</style></head><body><div class="card">
<div class="tag">ease-out</div><code>cubic-bezier(0.2, 0.8, 0.2, 1)</code><div class="use">default interactions</div>
<div class="tag">emphasized</div><code>cubic-bezier(0.22, 1, 0.36, 1)</code><div class="use">entrances, view transitions</div>
<div class="tag">spring</div><code>cubic-bezier(0.08, 0.82, 0.17, 1)</code><div class="use">toasts, logo flip</div>
<div class="tag">durations</div><code>200 · 300 · 600–900ms</code><div class="use">press · state · entrance</div>
</div></body></html>
