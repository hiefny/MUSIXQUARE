name = "musixquare-signaling"
main = "signaling-worker.js"
compatibility_date = "2026-05-04"
workers_dev = false
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Required at deploy time and intentionally never committed:
#   npx wrangler secret put PRO_SIGNALING_SECRET --config cloudflare/wrangler.signaling.toml
#   npx wrangler secret put MXQR_STANDARD_ROOM_ACCOUNT_ASSERTION_SECRET --config cloudflare/wrangler.signaling.toml
#   npx wrangler secret put PRO_ROOM_DECOMMISSION_VERIFY_SECRET --config cloudflare/wrangler.signaling.toml

[[routes]]
pattern = "signal.musixquare.com"
custom_domain = true

[[durable_objects.bindings]]
name = "MUSIXQUARE_ROOMS"
class_name = "MusixquareRoom"

# Private cross-script authority boundary for privileged PRO realtime frames.
# Signaling derives the room/participant/incarnation from its admitted socket;
# browsers cannot address this Durable Object binding directly.
[[durable_objects.bindings]]
name = "PRO_ROOM_AUTHORITY_ROOMS"
class_name = "MusixquareProRoom"
script_name = "musixquare-pro-room"

[[durable_objects.bindings]]
name = "DEVELOPER_API_LIMITERS"
class_name = "DeveloperApiRateLimiter"
script_name = "musixquare-developer-api"

[[r2_buckets]]
binding = "PRO_MEDIA_BUCKET"
bucket_name = "musixquare-pro-media"

# Admin dashboard metrics shared with the app Worker.
[[d1_databases]]
binding = "MUSIXQUARE_ADMIN_DB"
database_name = "musixquare-admin-metrics"
database_id = "d6cc9ceb-f0b6-40e4-99aa-8f28bec412ed"

[[d1_databases]]
binding = "DEVELOPER_API_DB"
database_name = "musixquare-developer-api"
database_id = "237d63d2-6eea-4b01-b396-7784b5b8b6f0"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MusixquareRoom"]
