name: Trigger One-shot Media Session Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/agent-media-session-hotfix-trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: musixquare-agent-media-session-hotfix-trigger
  cancel-in-progress: false

jobs:
  hotfix:
    if: >-
      github.event.head_commit.message == 'chore: trigger media-session authority hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact main state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract and apply reviewed hotfix
        shell: bash
        run: |
          awk '
            /^          python - <<'\''PY'\''$/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/agent-media-session-hotfix.yml > /tmp/media-session-hotfix.py
          test -s /tmp/media-session-hotfix.py
          python /tmp/media-session-hotfix.py
          rm -f .github/workflows/agent-media-session-hotfix-trigger.yml
          rm -f .github/agent-media-session-hotfix-trigger

      - name: Format changed TypeScript
        run: npx prettier --write src/player/media-session.ts src/player/__tests__/media-session-os-authority.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build and verify production bundle
        run: npm run build:checked

      - name: Verify exact hotfix scope
        shell: bash
        run: |
          expected="$(
            printf '%s\n' \
              .github/agent-media-session-hotfix-trigger \
              .github/workflows/agent-media-session-hotfix-trigger.yml \
              .github/workflows/agent-media-session-hotfix.yml \
              public/service-worker.js \
              src/core/__tests__/service-worker-cache.test.ts \
              src/player/__tests__/media-session-os-authority.test.ts \
              src/player/media-session.ts \
              | sort
          )"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected working-tree scope"
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Commit validated hotfix to main
        shell: bash
        run: |
          git config user.name "MUSIXQUARE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(media-session): synchronize native YouTube controls"
          git push origin HEAD:main

      - name: Dispatch production app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f target=app
