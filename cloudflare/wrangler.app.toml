name = "musixquare-app"
main = "app-worker.js"
compatibility_date = "2026-05-04"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[routes]]
pattern = "musixquare.com"
custom_domain = true

[[routes]]
pattern = "www.musixquare.com"
custom_domain = true

[assets]
directory = "../dist"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/*"]

[triggers]
crons = ["0 */6 * * *"]

[[r2_buckets]]
binding = "SORO_IMAGE_BUCKET"
bucket_name = "musixquare-soro-images"

[[kv_namespaces]]
binding = "SORO_RSS_BACKUP"
id = "fd1a24bab0524b5688d168e9bdb6c038"

# Admin dashboard metrics shared with the signaling Worker.
[[d1_databases]]
binding = "MUSIXQUARE_ADMIN_DB"
database_name = "musixquare-admin-metrics"
database_id = "d6cc9ceb-f0b6-40e4-99aa-8f28bec412ed"

# Cross-script Durable Object binding for Access + admin-session protected PRO
# provisioning. The PRO Worker's public router cannot reach these root-level
# internal endpoints, and activation claims are never persisted in D1.
[[durable_objects.bindings]]
name = "PRO_ROOM_ADMIN_ROOMS"
class_name = "MusixquareProRoom"
script_name = "musixquare-pro-room"

[vars]
YOUTUBE_SEARCH_MAX_RESULTS = "10"
YOUTUBE_SAFE_SEARCH = "moderate"
CLOUDFLARE_TURN_TTL = "172800"
# Human verification is disabled. Capability minting instead uses a short-lived,
# IP/scope-bound proof-of-work challenge plus per-IP rate limits.
MXQR_TURNSTILE_DISABLED = "true"
# Optional tuning; defaults are difficulty 16 and challenge TTL 120 seconds.
# MXQR_CAPABILITY_POW_DIFFICULTY = "16"
# MXQR_CAPABILITY_POW_TTL = "120"
# Optional comma/space-separated exact origins for trusted deploy previews.
# TRUSTED_CORS_ORIGINS = "https://example-preview.pages.dev"
# Required production secrets:
# - MXQR_CAPABILITY_SECRET
# Local/emergency only; production guards reject these:
# - MXQR_ALLOW_UNGUARDED_PAID_APIS = "true"
