name: Production Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker scope to deploy
        required: true
        default: app
        type: choice
        options:
          - app
          - signaling
          - pro-room
          - developer-api
          - remote-share
          - all
      apply_developer_api_d1:
        description: Apply the current Developer API D1 baseline
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: musixquare-production-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.114.0

jobs:
  validate:
    name: Validate release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_artifact_name: ${{ steps.candidate_source.outputs.artifact_name }}
      candidate_run_attempt: ${{ steps.candidate_source.outputs.run_attempt }}
      candidate_run_id: ${{ steps.candidate_source.outputs.run_id }}
      candidate_validation_profile: ${{ steps.candidate_source.outputs.validation_profile }}

    steps:
      - name: Validate release options
        run: |
          if [[ "${{ inputs.apply_developer_api_d1 }}" == "true" &&
                "${{ inputs.target }}" != "all" &&
                "${{ inputs.target }}" != "developer-api" ]]; then
            echo "::error::Developer API D1 changes require target 'developer-api' or 'all'."
            exit 1
          fi

      - name: Select exact-SHA validated candidate
        id: candidate_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 720))
          while (( SECONDS < deadline )); do
            runs="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="$GITHUB_SHA" \
                -f per_page=20
            )"
            run_id="$(
              jq -r \
                '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.run_attempt) | last | .id // empty' \
                <<< "$runs"
            )"
            if [[ -n "$run_id" ]]; then
              artifacts="$(
                gh api --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                  -f per_page=100
              )"
              artifact_prefix="production-candidate-$GITHUB_SHA-$run_id-"
              artifact_name="$(
                jq -r --arg prefix "$artifact_prefix" \
                  '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at) | last | .name // empty' \
                  <<< "$artifacts"
              )"
              if [[ -z "$artifact_name" ]]; then
                echo "::error::Successful CI run $run_id has no unexpired exact-SHA production candidate."
                exit 1
              fi
              run_attempt="${artifact_name##*-}"
              if [[ ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Production candidate $artifact_name has an invalid source attempt."
                exit 1
              fi
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
              echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
              echo "validation_profile=main-ci" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            active_count="$(
              jq -r \
                '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' \
                <<< "$runs"
            )"
            completed_url="$(
              jq -r \
                '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_attempt) | last | .html_url // empty' \
                <<< "$runs"
            )"
            if [[ "$active_count" == "0" && -n "$completed_url" ]]; then
              echo "::error::The exact main commit did not pass CI: $completed_url"
              exit 1
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for successful CI on exact commit $GITHUB_SHA."
          exit 1

  deploy:
    name: Deploy validated candidate
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://musixquare.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_MESSAGE: git:${{ github.sha }} run:${{ github.run_id }} source:${{ needs.validate.outputs.candidate_run_id }} target:${{ inputs.target }}
      RELEASE_ROLLBACK_MESSAGE: rollback:${{ github.sha }} run:${{ github.run_id }} attempt:${{ github.run_attempt }}
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_SOURCE_RUN_ATTEMPT: ${{ needs.validate.outputs.candidate_run_attempt }}
      RELEASE_SOURCE_RUN_ID: ${{ needs.validate.outputs.candidate_run_id }}
      RELEASE_VALIDATION_PROFILE: ${{ needs.validate.outputs.candidate_validation_profile }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          # The schema-intent fence compares this release with the immutable
          # SHA recorded on the previous deployment. Keep that commit object
          # available instead of failing closed on a shallow checkout.
          fetch-depth: 0

      - name: Verify release commit is still current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced to $current_main after this release was dispatched. Run the release again for the current commit."
            exit 1
          fi

      - name: Require a full release for remote-share contract cutovers
        shell: bash
        run: |
          contract_marker='cloudflare/remote-share-contract-version.txt'
          parent_sha="$(git rev-parse "${GITHUB_SHA}^")"
          if git diff --quiet "$parent_sha" "$GITHUB_SHA" -- "$contract_marker"; then
            exit 0
          fi
          if [[ "${{ inputs.target }}" != 'all' ]]; then
            echo "::error::A remote-share public contract cutover requires target 'all' so the app and Worker deploy together."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated production candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.validate.outputs.candidate_artifact_name }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.candidate_run_id }}

      - name: Verify candidate hashes and commit
        run: npm run release:verify

      - name: Verify Cloudflare credentials
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run --silent wrangler -- whoami

      - name: Verify partial release dependency compatibility
        if: inputs.target != 'all'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-deployment-state.mjs compatibility "$RELEASE_TARGET" "${{ github.sha }}"

      - name: Install app smoke browser
        if: inputs.target == 'all' || inputs.target == 'app'
        run: npx playwright install --with-deps chromium

      - name: Prepare deployment records
        run: mkdir -p release-artifacts/deployments

      - name: Read PRO room generation cutover before dependency rollout
        timeout-minutes: 10
        id: pro_room_generation_cutover_before_rollout
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-before-rollout.json
          node scripts/pro-room-generation-cutover.mjs cutover-outputs \
            release-artifacts/deployments/pro-room-generation-cutover-before-rollout.json \
            >> "$GITHUB_OUTPUT"

      - name: Verify full release honors immutable PRO generation floor
        if: inputs.target == 'all'
        shell: bash
        run: |
          if [[ "${{ steps.pro_room_generation_cutover_before_rollout.outputs.generation_floor }}" != "true" ]]; then
            echo "::error::The immutable PRO generation floor is not established. Repair production forward; the completed first-generation ceremony cannot be replayed."
            exit 1
          fi
          floor_release_sha="${{ steps.pro_room_generation_cutover_before_rollout.outputs.floor_release_sha }}"
          if [[ ! "$floor_release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The immutable PRO generation floor is missing or malformed."
            exit 1
          fi
          if ! git cat-file -e "${floor_release_sha}^{commit}" 2>/dev/null; then
            echo "::error::The immutable PRO generation floor commit is unavailable in this checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$floor_release_sha" "${{ github.sha }}"; then
            echo "::error::This full release predates or diverges from the immutable PRO generation floor."
            exit 1
          fi

      - name: Fence room-code reuse during dependency rollout
        timeout-minutes: 10
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'disabled', release_sha = NULL, updated_at = unixepoch() * 1000 WHERE contract_version = 1; SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-rollout-fenced.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-rollout-fenced.json \
            disabled

      - name: Verify Developer API D1 migration credentials
        timeout-minutes: 10
        if: inputs.apply_developer_api_d1 && (inputs.target == 'all' || inputs.target == 'developer-api')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          npm run --silent wrangler -- d1 execute musixquare-developer-api \
            --remote \
            --command "UPDATE mxqr_developer_api_keys SET updated_at = updated_at WHERE 0" \
            --config cloudflare/wrangler.developer-api.toml

      - name: Record current Developer API deployment for schema intent
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api.toml --json \
            > release-artifacts/deployments/developer-api-before.json

      - name: Verify Developer API schema release intent
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        run: |
          node scripts/check-developer-api-schema-release.mjs \
            release-artifacts/deployments/developer-api-before.json \
            "${{ github.sha }}" \
            "${{ inputs.apply_developer_api_d1 }}"

      - name: Apply remote-share R2 CORS policy
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- r2 bucket cors set musixquare-remote-share \
            --file cloudflare/r2-cors.remote-share.json \
            --config cloudflare/wrangler.remote-share.toml \
            --force
          cors_state="$(npm run --silent wrangler -- r2 bucket cors list \
            musixquare-remote-share \
            --config cloudflare/wrangler.remote-share.toml)"
          for required_header in \
            content-type \
            x-amz-meta-cleanup-token \
            x-amz-meta-expires-at \
            x-amz-meta-format-version \
            x-amz-meta-mime \
            x-amz-meta-name \
            x-amz-meta-object-id \
            x-amz-meta-room-id \
            x-amz-meta-stored-size; do
            if ! grep -Eiq "(^|[^[:alnum:]-])${required_header}([^[:alnum:]-]|$)" <<<"$cors_state"; then
              echo "::error::Remote-share R2 CORS read-back is missing ${required_header}."
              exit 1
            fi
          done
          metadata_header_count="$(grep -Eio 'x-amz-meta-[[:alnum:]-]+' <<<"$cors_state" | sort -u | wc -l | tr -d '[:space:]')"
          if [[ "$metadata_header_count" -ne 8 ]]; then
            echo "::error::Remote-share R2 CORS read-back must expose exactly the eight configured metadata headers."
            exit 1
          fi

      - name: Apply and verify remote-share R2 lifecycle policy
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- r2 bucket lifecycle set musixquare-remote-share \
            --file cloudflare/r2-lifecycle.remote-share.json \
            --config cloudflare/wrangler.remote-share.toml \
            --force
          lifecycle_state="$(npm run --silent wrangler -- r2 bucket lifecycle list \
            musixquare-remote-share \
            --config cloudflare/wrangler.remote-share.toml)"
          if ! grep -Fq 'prefix:   room/' <<<"$lifecycle_state"; then
            echo "::error::Remote-share R2 lifecycle read-back is missing room/."
            exit 1
          fi
          if [[ "$(grep -Fc 'action:   Expire objects after 1 days' <<<"$lifecycle_state")" -ne 1 ]]; then
            echo "::error::Remote-share R2 lifecycle read-back must contain exactly one room/ one-day expiry rule."
            exit 1
          fi

      - name: Apply PRO media R2 CORS policy
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'pro-room' || inputs.target == 'app'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- r2 bucket cors set musixquare-pro-media \
            --file cloudflare/r2-cors.pro-media.json \
            --config cloudflare/wrangler.pro-room.toml \
            --force
          cors_state="$(npm run --silent wrangler -- r2 bucket cors list musixquare-pro-media \
            --config cloudflare/wrangler.pro-room.toml)"
          for required_header in range accept-ranges content-encoding content-range etag; do
            if ! grep -Eiq "(^|[^[:alnum:]-])${required_header}([^[:alnum:]-]|$)" <<<"$cors_state"; then
              echo "::error::PRO media R2 CORS read-back is missing ${required_header}."
              exit 1
            fi
          done
          npm run smoke:live:pro-media-cors

      - name: Record current PRO room deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'pro-room'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.pro-room.toml --json \
            > release-artifacts/deployments/pro-room-before.json
          node scripts/release-deployment-state.mjs prepare pro-room

      - name: Deploy and record PRO room Worker
        timeout-minutes: 15
        id: pro_room_deployment
        if: inputs.target == 'all' || inputs.target == 'pro-room'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight pro-room
          node scripts/release-deployment-state.mjs attempt pro-room
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.pro-room.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.pro-room.toml --json \
            > release-artifacts/deployments/pro-room.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record pro-room
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mjs version pro-room)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke PRO room Worker
        if: inputs.target == 'all' || inputs.target == 'pro-room'
        timeout-minutes: 5
        env:
          MXQR_EXPECTED_PRO_ROOM_VERSION: ${{ steps.pro_room_deployment.outputs.version_id }}
        run: npm run smoke:live:pro-room

      # The global maintenance Durable Object is owned by the PRO Worker.
      # Deploy it before every cross-script caller, including remote-share.
      - name: Record current remote-share deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.remote-share.toml --json \
            > release-artifacts/deployments/remote-share-before.json
          node scripts/release-deployment-state.mjs prepare remote-share

      - name: Deploy and record remote-share Worker
        timeout-minutes: 15
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight remote-share
          node scripts/release-deployment-state.mjs attempt remote-share
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.remote-share.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.remote-share.toml --json \
            > release-artifacts/deployments/remote-share.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record remote-share
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          exit "$record_exit"

      - name: Smoke remote-share Worker
        if: inputs.target == 'all' || inputs.target == 'remote-share'
        timeout-minutes: 5
        run: npm run smoke:live:remote-share

      - name: Record current signaling deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'signaling'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.signaling.toml --json \
            > release-artifacts/deployments/signaling-before.json
          node scripts/release-deployment-state.mjs prepare signaling

      - name: Deploy and record signaling Worker
        timeout-minutes: 15
        id: signaling_deployment
        if: inputs.target == 'all' || inputs.target == 'signaling'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight signaling
          node scripts/release-deployment-state.mjs attempt signaling
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.signaling.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.signaling.toml --json \
            > release-artifacts/deployments/signaling.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record signaling
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mjs version signaling)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke signaling Worker
        if: inputs.target == 'all' || inputs.target == 'signaling'
        timeout-minutes: 5
        env:
          MXQR_EXPECTED_SIGNALING_VERSION: ${{ steps.signaling_deployment.outputs.version_id }}
        run: npm run smoke:live:signaling

      - name: Record current Developer API facade deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api-facade.toml --json \
            > release-artifacts/deployments/developer-api-facade-before.json
          node scripts/release-deployment-state.mjs prepare developer-api-facade

      - name: Deploy and record Developer API facade Worker
        timeout-minutes: 15
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight developer-api-facade
          node scripts/release-deployment-state.mjs attempt developer-api-facade
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.developer-api-facade.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api-facade.toml --json \
            > release-artifacts/deployments/developer-api-facade.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record developer-api-facade
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          exit "$record_exit"

      - name: Record current Developer API deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        run: |
          node scripts/release-deployment-state.mjs prepare developer-api

      - name: Apply Developer API base schema
        timeout-minutes: 10
        if: inputs.apply_developer_api_d1 && (inputs.target == 'all' || inputs.target == 'developer-api')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npm run developer-api:schema:remote

      - name: Deploy and record Developer API Worker
        timeout-minutes: 15
        id: developer_api_deployment
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/release-deployment-state.mjs preflight developer-api
          node scripts/release-deployment-state.mjs attempt developer-api
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.developer-api.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.developer-api.toml --json \
            > release-artifacts/deployments/developer-api.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record developer-api
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          if (( record_exit != 0 )); then exit "$record_exit"; fi
          version_id="$(node scripts/release-deployment-state.mjs version developer-api)"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke Developer API Worker
        if: inputs.target == 'all' || inputs.target == 'developer-api'
        timeout-minutes: 5
        env:
          MXQR_DEVELOPER_API_SMOKE_KEY: ${{ secrets.MXQR_DEVELOPER_API_SMOKE_KEY }}
          MXQR_DEVELOPER_API_SMOKE_ROOM: '000001'
          MXQR_EXPECTED_DEVELOPER_API_VERSION: ${{ steps.developer_api_deployment.outputs.version_id }}
        run: npm run smoke:live:developer-api

      - name: Record current app deployment
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'app'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.app.toml --json \
            > release-artifacts/deployments/app-before.json
          node scripts/release-deployment-state.mjs prepare app

      - name: Deploy and record app Worker with immutable dist
        timeout-minutes: 15
        if: inputs.target == 'all' || inputs.target == 'app'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced to $current_main before the app deployment. Run the release again for the current commit."
            exit 1
          fi
          node scripts/release-deployment-state.mjs preflight app
          node scripts/release-deployment-state.mjs attempt app
          set +e
          npm run --silent wrangler -- deploy \
            --config cloudflare/wrangler.app.toml \
            --message "$RELEASE_MESSAGE"
          deploy_exit=$?
          npm run --silent wrangler -- deployments status \
            --config cloudflare/wrangler.app.toml --json \
            > release-artifacts/deployments/app.json
          status_exit=$?
          record_exit=0
          if (( status_exit == 0 )); then
            node scripts/release-deployment-state.mjs record app
            record_exit=$?
          fi
          set -e
          if (( deploy_exit != 0 )); then exit "$deploy_exit"; fi
          if (( status_exit != 0 )); then exit "$status_exit"; fi
          exit "$record_exit"

      - name: Smoke app session endpoint
        if: inputs.target == 'all' || inputs.target == 'app'
        timeout-minutes: 5
        run: npm run smoke:live:app-session

      - name: Smoke anonymous app account boundary
        if: inputs.target == 'all' || inputs.target == 'app'
        timeout-minutes: 5
        run: npm run smoke:live:app-public-boundary

      - name: Smoke current PRO public boundary after app deployment
        if: inputs.target == 'all' || inputs.target == 'app'
        timeout-minutes: 5
        run: npm run smoke:live:pro-room

      - name: Verify release still owns current production deployments
        timeout-minutes: 10
        id: final_verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-deployment-state.mjs verify-current

      - name: Restore PRO room generation readiness
        timeout-minutes: 10
        id: pro_room_generation_cutover
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'ready', release_sha = '${{ github.sha }}', updated_at = unixepoch() * 1000 WHERE contract_version = 1 AND ever_enabled = 1 AND floor_release_sha IS NOT NULL; SELECT contract_version, status, release_sha, ever_enabled, floor_release_sha, ever_enabled AS generation_floor FROM mxqr_pro_room_generation_cutover WHERE contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-ready.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-ready.json \
            ready \
            "${{ github.sha }}"

      - name: Disable PRO room generation cutover before failed-release rollback
        timeout-minutes: 10
        id: pro_room_generation_cutover_disable
        if: (failure() || cancelled()) && inputs.target == 'all'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          mkdir -p release-artifacts/deployments
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'disabled', release_sha = NULL, updated_at = unixepoch() * 1000 WHERE contract_version = 1; SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-disabled.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-disabled.json \
            disabled
          node scripts/pro-room-generation-cutover.mjs cutover-outputs \
            release-artifacts/deployments/pro-room-generation-cutover-disabled.json \
            >> "$GITHUB_OUTPUT"

      - name: Restore Worker deployments after a failed release
        timeout-minutes: 20
        id: worker_rollback
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rollback_skip_targets=""
          if [[ "${{ steps.pro_room_generation_cutover_disable.outcome }}" == "failure" ||
                "${{ steps.pro_room_generation_cutover_disable.outcome }}" == "cancelled" ||
                "${{ steps.pro_room_generation_cutover_disable.outputs.generation_floor }}" == "true" ]]; then
            # If the global reuse fence cannot be proven disabled, never restore
            # a generation-sensitive dependency. Once the permanent floor
            # exists, keep the current stack and repair forward. Independent
            # remote-share recovery remains safe.
            rollback_skip_targets="pro-room,signaling,developer-api-facade,developer-api,app"
          elif [[ "${{ inputs.apply_developer_api_d1 }}" == "true" ]]; then
            # The current baseline has no generic down migration. Keep both
            # Developer API Workers on the matched forward schema floor.
            rollback_skip_targets="developer-api-facade,developer-api"
          fi

          MXQR_ROLLBACK_SKIP_TARGETS="$rollback_skip_targets" \
            node scripts/release-deployment-state.mjs rollback
          echo "skipped_targets=${rollback_skip_targets}" >> "$GITHUB_OUTPUT"

      - name: Upload deployment records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployments-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/deployments/
          if-no-files-found: warn
          retention-days: 90

      - name: Release summary
        if: always()
        run: |
          echo "### MUSIXQUARE production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Wrangler: \`${WRANGLER_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: \`${RELEASE_VALIDATION_PROFILE}\` (full E2E runs on manual dispatch)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate source: run \`${RELEASE_SOURCE_RUN_ID}\`, attempt \`${RELEASE_SOURCE_RUN_ATTEMPT}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- Developer API D1 changes requested: \`${{ inputs.apply_developer_api_d1 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PRO generation readiness restore: \`${{ steps.pro_room_generation_cutover.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery PRO generation fence: \`${{ steps.pro_room_generation_cutover_disable.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final production ownership verification: \`${{ steps.final_verification.outcome || 'not-run' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery Worker outcome: \`${{ steps.worker_rollback.outcome || 'not-requested' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery compatibility floor: \`${{ steps.worker_rollback.outputs.skipped_targets || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare deployment records are attached to this run." >> "$GITHUB_STEP_SUMMARY"
          node scripts/release-deployment-state.mjs summary

      - name: Fail release when automatic recovery is incomplete
        if: >-
          always() &&
          (steps.pro_room_generation_cutover_disable.outcome == 'failure' ||
           steps.pro_room_generation_cutover_disable.outcome == 'cancelled' ||
           steps.worker_rollback.outcome == 'failure' ||
           steps.worker_rollback.outcome == 'cancelled')
        run: |
          echo "::error::Automatic release recovery was incomplete. Inspect the rollback report before any manual action."
          exit 1
