<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 16px;
    gap: 16px;
  }
  h1 { font-size: 16px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #666; }

  .viz-row { display: flex; align-items: center; gap: 20px; }
  canvas#spectrum { width: 400px; height: 150px; border-radius: 8px; background: #111; }

  .lamp { width: 72px; height: 72px; border-radius: 50%; background: #1a1a1a; border: 3px solid #333; transition: border-color 0.05s; }
  .lamp.beat {
    background: radial-gradient(circle at 40% 35%, #6fff6f, #00cc00 60%, #009900);
    border-color: #00ff00;
    box-shadow: 0 0 40px rgba(0,255,0,0.5), 0 0 80px rgba(0,255,0,0.2);
  }

  .debug { display: flex; gap: 16px; font-family: 'SF Mono','Fira Code',monospace; }
  .debug-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .debug-value { font-size: 16px; font-weight: 600; color: #aaa; min-width: 44px; text-align: center; }
  .debug-value.active { color: #00ff00; }
  .debug-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #444; }

  .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .file-label { padding: 10px 24px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; cursor: pointer; font-size: 13px; color: #aaa; }
  .file-label:hover { border-color: #555; color: #fff; }
  #fileInput { display: none; }
  .play-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #444; background: transparent; cursor: pointer; display: none; align-items: center; justify-content: center; }
  .play-btn:hover { border-color: #888; }
  .play-btn.visible { display: flex; }
  .play-btn .icon-play { width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent #aaa; margin-left: 2px; }
  .play-btn .icon-pause { display: flex; gap: 3px; }
  .play-btn .icon-pause span { width: 3px; height: 12px; background: #aaa; border-radius: 1px; }
  .track-name { font-size: 11px; color: #555; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seekbar-row { display: flex; align-items: center; gap: 8px; width: 300px; }
  .seekbar-row input[type="range"] { flex: 1; accent-color: #00cc00; }
  .seekbar-row .time { font-size: 10px; color: #555; font-family: monospace; min-width: 32px; }

  .params { display: flex; flex-direction: column; gap: 6px; width: 300px; }
  .param-row { display: flex; align-items: center; gap: 8px; }
  .param-row label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 1px; min-width: 72px; }
  .param-row input[type="range"] { flex: 1; accent-color: #00cc00; }
  .param-row .param-val { font-size: 10px; color: #777; min-width: 32px; text-align: right; font-family: monospace; }
</style>
</head>
<body>

<h1>Beat Lab — Spectral Flux</h1>

<div class="viz-row">
  <canvas id="spectrum" width="800" height="300"></canvas>
  <div class="lamp" id="lamp"></div>
</div>

<div class="debug">
  <div class="debug-item"><span class="debug-value" id="dbFlux">0</span><span class="debug-label">Flux</span></div>
  <div class="debug-item"><span class="debug-value" id="dbThresh">0</span><span class="debug-label">Thresh</span></div>
  <div class="debug-item"><span class="debug-value" id="dbBPM">—</span><span class="debug-label">BPM</span></div>
  <div class="debug-item"><span class="debug-value" id="dbBeats">0</span><span class="debug-label">Beats</span></div>
</div>

<div class="controls">
  <label class="file-label" for="fileInput">Load File</label>
  <input type="file" id="fileInput" accept="audio/*">
  <span class="track-name" id="trackName"></span>
  <button class="play-btn" id="playBtn"><div class="icon-play"></div></button>
  <div class="seekbar-row" id="seekRow" style="display:none;">
    <span class="time" id="timeCur">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
    <span class="time" id="timeTotal">0:00</span>
  </div>
</div>

<div class="params">
  <div class="param-row">
    <label>Decay</label>
    <input type="range" id="paramDecay" min="1" max="20" value="6" step="1">
    <span class="param-val" id="valDecay">6</span>
  </div>
  <div class="param-row">
    <label>Cooldown</label>
    <input type="range" id="paramCooldown" min="30" max="300" value="100" step="10">
    <span class="param-val" id="valCooldown">100ms</span>
  </div>
  <div class="param-row">
    <label>Bass Bins</label>
    <input type="range" id="paramBins" min="2" max="24" value="10" step="1">
    <span class="param-val" id="valBins">10</span>
  </div>
  <div class="param-row">
    <label>Smoothing</label>
    <input type="range" id="paramSmoothing" min="0" max="100" value="5" step="1">
    <span class="param-val" id="valSmoothing">0.05</span>
  </div>
</div>

<script>
// ─── Audio ──────────────────────────────────────────────────────
let audioCtx, analyser, audioBuffer, bufferSource;
let isPlaying = false, startedAt = 0, pausedAt = 0;

const $ = id => document.getElementById(id);
const lamp = $('lamp'), playBtn = $('playBtn'), trackName = $('trackName');
const seekBar = $('seekBar'), seekRow = $('seekRow'), timeCur = $('timeCur'), timeTotal = $('timeTotal');
const specCanvas = $('spectrum'), specCtx = specCanvas.getContext('2d');
let isSeeking = false;

// ─── Params ─────────────────────────────────────────────────────
let peakDecay = 6;       // 피크가 프레임당 떨어지는 양
let cooldown = 100;      // ms
let bassBins = 10;

// ─── Flux + Peak Hold State ─────────────────────────────────────
let prevSpectrum = null;
let fluxPeak = 0;        // 감쇠 중인 flux 피크
let lastBeatTime = 0;
let lampOffTimer = null;
let beatCount = 0;
const beatTimes = [];

// ─── Helpers ────────────────────────────────────────────────────
function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

// ─── Seekbar ────────────────────────────────────────────────────
seekBar.addEventListener('mousedown', () => isSeeking = true);
seekBar.addEventListener('touchstart', () => isSeeking = true, {passive:true});
seekBar.addEventListener('input', () => timeCur.textContent = fmtTime(Number(seekBar.value)));
seekBar.addEventListener('change', () => {
  isSeeking = false;
  const t = Number(seekBar.value);
  if (isPlaying) { stopSource(); isPlaying = false; pausedAt = t; play(); }
  else { pausedAt = t; timeCur.textContent = fmtTime(t); }
});

// ─── Param Controls ─────────────────────────────────────────────
$('paramDecay').addEventListener('input', e => {
  peakDecay = Number(e.target.value);
  $('valDecay').textContent = peakDecay;
});
$('paramCooldown').addEventListener('input', e => {
  cooldown = Number(e.target.value);
  $('valCooldown').textContent = cooldown + 'ms';
});
$('paramBins').addEventListener('input', e => {
  bassBins = Number(e.target.value);
  $('valBins').textContent = bassBins;
});
$('paramSmoothing').addEventListener('input', e => {
  const v = Number(e.target.value) / 100;
  $('valSmoothing').textContent = v.toFixed(2);
  if (analyser) analyser.smoothingTimeConstant = v;
});

// ─── File Load ──────────────────────────────────────────────────
$('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  if (!audioCtx) {
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.05;
    analyser.connect(audioCtx.destination);
  }
  trackName.textContent = file.name;
  audioBuffer = await audioCtx.decodeAudioData(await file.arrayBuffer());
  pausedAt = 0; beatCount = 0; prevSpectrum = null; fluxPeak = 0;
  playBtn.classList.add('visible');
  seekRow.style.display = 'flex';
  seekBar.max = audioBuffer.duration;
  seekBar.value = 0;
  timeTotal.textContent = fmtTime(audioBuffer.duration);
  if (isPlaying) { stopSource(); isPlaying = false; }
  togglePlay();
});

// ─── Play/Pause ─────────────────────────────────────────────────
playBtn.addEventListener('click', togglePlay);

function togglePlay() {
  if (!audioBuffer) return;
  isPlaying ? pause() : play();
}

function stopSource() {
  if (bufferSource) { bufferSource.onended = null; try { bufferSource.stop(); } catch {} bufferSource = null; }
}

function play() {
  stopSource();
  bufferSource = audioCtx.createBufferSource();
  bufferSource.buffer = audioBuffer;
  bufferSource.connect(analyser);
  bufferSource.start(0, pausedAt);
  startedAt = audioCtx.currentTime - pausedAt;
  isPlaying = true;
  fluxPeak = 0;
  playBtn.innerHTML = '<div class="icon-pause"><span></span><span></span></div>';
  bufferSource.onended = () => {
    if (isPlaying) { isPlaying = false; pausedAt = 0; playBtn.innerHTML = '<div class="icon-play"></div>'; }
  };
  loop();
}

function pause() {
  pausedAt = audioCtx.currentTime - startedAt;
  stopSource();
  isPlaying = false;
  playBtn.innerHTML = '<div class="icon-play"></div>';
}

// ─── Main Loop ──────────────────────────────────────────────────
function loop() {
  if (!isPlaying) return;
  requestAnimationFrame(loop);

  const binCount = analyser.frequencyBinCount;
  const spectrum = new Uint8Array(binCount);
  analyser.getByteFrequencyData(spectrum);

  // ─── Spectral Flux (bass only) ────────────────────
  // 각 bin의 에너지 증가분만 합산. 지속음 = 0, 킥 = 급증
  let flux = 0;
  const count = Math.min(bassBins, binCount);

  if (prevSpectrum && prevSpectrum.length >= count) {
    for (let i = 0; i < count; i++) {
      const diff = spectrum[i] - prevSpectrum[i];
      if (diff > 0) flux += diff;
    }
  }

  if (!prevSpectrum || prevSpectrum.length !== binCount) {
    prevSpectrum = new Uint8Array(binCount);
  }
  prevSpectrum.set(spectrum);

  // ─── Flux Peak Hold ───────────────────────────────
  // 피크가 천천히 내려옴. flux가 이 피크를 뚫으면 비트.
  // flux는 킥이 없을 때 자연스럽게 0으로 떨어지므로
  // "에너지가 높은 채로 유지" 문제가 없음!
  fluxPeak -= peakDecay;
  if (fluxPeak < 0) fluxPeak = 0;

  const now = performance.now();
  const beat = flux > fluxPeak && flux > 15 && (now - lastBeatTime) > cooldown;

  if (beat) {
    lastBeatTime = now;
    beatCount++;
    lamp.classList.add('beat');
    if (lampOffTimer) clearTimeout(lampOffTimer);
    lampOffTimer = setTimeout(() => lamp.classList.remove('beat'), 80);

    // BPM
    beatTimes.push(now);
    if (beatTimes.length > 12) beatTimes.shift();
    if (beatTimes.length >= 4) {
      const intervals = [];
      for (let i = 1; i < beatTimes.length; i++) intervals.push(beatTimes[i] - beatTimes[i-1]);
      const avgI = intervals.reduce((a,b) => a+b, 0) / intervals.length;
      const bpm = Math.round(60000 / avgI);
      $('dbBPM').textContent = (bpm > 40 && bpm < 240) ? bpm : '—';
    }
  }

  // flux가 피크보다 높으면 피크 갱신
  if (flux > fluxPeak) fluxPeak = flux;

  // ─── Debug ────────────────────────────────────────
  $('dbFlux').textContent = flux.toFixed(0);
  $('dbFlux').className = 'debug-value' + (beat ? ' active' : '');
  $('dbThresh').textContent = fluxPeak.toFixed(0);
  $('dbBeats').textContent = beatCount;

  // ─── Seekbar ──────────────────────────────────────
  if (!isSeeking && audioBuffer) {
    const pos = audioCtx.currentTime - startedAt;
    seekBar.value = Math.min(pos, audioBuffer.duration);
    timeCur.textContent = fmtTime(pos);
  }

  // ─── Visualizer ───────────────────────────────────
  drawSpectrum(spectrum, binCount, flux, fluxPeak);
}

// ─── Spectrum Visualizer ────────────────────────────────────────
let specPeaks = null;

function drawSpectrum(spectrum, binCount, flux, fluxPeakVal) {
  const W = specCanvas.width, H = specCanvas.height;
  specCtx.clearRect(0, 0, W, H);

  if (!specPeaks || specPeaks.length !== binCount) specPeaks = new Float32Array(binCount);

  const barCount = Math.min(binCount, 128);
  const barW = W / barCount;
  const bassEnd = Math.min(bassBins, barCount);

  for (let i = 0; i < barCount; i++) {
    const val = spectrum[i] / 255;
    const h = val * H;
    const x = i * barW;
    const isBass = i < bassEnd;

    // Peak decay (visual only)
    specPeaks[i] *= 0.97;
    if (val > specPeaks[i]) specPeaks[i] = val;
    const peakH = specPeaks[i] * H;

    // Bar
    specCtx.fillStyle = isBass ? 'rgba(0,200,0,0.7)' : 'rgba(60,60,60,0.5)';
    specCtx.fillRect(x, H - h, barW - 1, h);

    // Peak dot
    specCtx.fillStyle = isBass ? 'rgba(0,255,0,0.9)' : 'rgba(100,100,100,0.5)';
    specCtx.fillRect(x, H - peakH, barW - 1, 2);
  }

  // Flux meter (오른쪽)
  const meterW = 14;
  const meterX = W - meterW - 4;
  const maxFlux = 600;
  const fluxH = Math.min(1, flux / maxFlux) * H;
  const peakH = Math.min(1, fluxPeakVal / maxFlux) * H;

  // Flux bar (현재)
  specCtx.fillStyle = flux > fluxPeakVal ? 'rgba(0,255,0,0.9)' : 'rgba(0,150,0,0.5)';
  specCtx.fillRect(meterX, H - fluxH, meterW, fluxH);

  // Peak line (내려오는 잔상) — 이게 핵심 시각화
  specCtx.fillStyle = 'rgba(255,255,0,0.9)';
  specCtx.fillRect(meterX - 6, H - peakH, meterW + 12, 3);

  // Labels
  specCtx.fillStyle = 'rgba(255,255,0,0.5)';
  specCtx.font = '9px monospace';
  specCtx.fillText('FLUX', meterX - 2, 12);
  specCtx.fillStyle = 'rgba(255,255,0,0.3)';
  specCtx.fillText('PEAK', meterX - 2, 22);
}
</script>
</body>
</html>
