[build]
  command = "npm run build"
  publish = "dist"

# Explicit robots.txt exception for GSC over Netlify domain
[[redirects]]
  from = "https://mxqr.netlify.app/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# Exact root match (From blog post screenshot)
[[redirects]]
  from = "https://mxqr.netlify.app"
  to = "https://musixquare.com"
  status = 301
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app"
  to = "https://musixquare.com"
  status = 301
  force = true

# Wildcard match for all sub-pages
[[redirects]]
  from = "https://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

# SPA fallback: serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed Vite assets aggressively (immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for vendor scripts (not hashed)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker must not be cached
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
