name = "musixquare-developer-api"
main = "developer-api-worker.js"
compatibility_date = "2026-07-17"
workers_dev = false
preview_urls = false

[triggers]
crons = ["0 */6 * * *"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# Keep automatic request-URL events disabled across the public Worker fleet;
# sampled application logs use explicit credential-free fields.
[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = false

[observability.traces]
enabled = false

[[routes]]
pattern = "api.musixquare.com"
custom_domain = true

# Keys can only be issued through the Access-gated admin dashboard and remain
# cryptographically bound to one registered PRO room. The public API is
# therefore available to every room for which an administrator issues a key.
[vars]
DEVELOPER_API_MODE = "enabled"

[[d1_databases]]
binding = "DEVELOPER_API_DB"
database_name = "musixquare-developer-api"
database_id = "237d63d2-6eea-4b01-b396-7784b5b8b6f0"

[[durable_objects.bindings]]
name = "DEVELOPER_API_LIMITERS"
class_name = "DeveloperApiRateLimiter"

[[durable_objects.bindings]]
name = "MUSIXQUARE_SERVICE_CONTROL"
class_name = "MusixquareServiceControl"
script_name = "musixquare-pro-room"

[[services]]
binding = "DEVELOPER_API_FACADE"
service = "musixquare-developer-api-facade"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeveloperApiRateLimiter"]

# Required secrets (never commit their values):
# Both must be independent random values of at least 32 characters. The key
# pepper must match the App Worker's value.
# npm run wrangler -- secret put MXQR_DEVELOPER_API_KEY_PEPPER --config cloudflare/wrangler.developer-api.toml
# npm run wrangler -- secret put MXQR_DEVELOPER_API_RATE_SECRET --config cloudflare/wrangler.developer-api.toml
