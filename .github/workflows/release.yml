            --config cloudflare/wrangler.remote-share.toml \
            --force
          lifecycle_state="$(npm run --silent wrangler -- r2 bucket lifecycle list \
            musixquare-remote-share \
            --config cloudflare/wrangler.remote-share.toml)"
          if ! grep -Fq 'prefix:   room/' <<<"$lifecycle_state"; then
            echo "::error::Remote-share R2 lifecycle read-back is missing room/."
            exit 1
          fi
          if [[ "$(grep -Fc 'action:   Expire objects after 1 days' <<<"$lifecycle_state")" -ne 1 ]]; then
