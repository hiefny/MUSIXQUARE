[build]
  command = "npm run build"
  publish = "dist"

# REDIRECT: From old subdomain to new domain
[[redirects]]
  from = "https://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

# SPA fallback: serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed Vite assets aggressively (immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for vendor scripts (not hashed)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker must not be cached
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
