name: Full E2E

# The complete Playwright suite is intentionally separate from the production
# release gate and runs only when manually requested. It runs serially because
# the tests share a signaling server.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musixquare-full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The serial suite has exceeded two hours on a throttled Windows host.
    # Preserve explicit bounds while leaving artifact-upload headroom on slow CI.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build E2E bundle
        run: npm run build:e2e

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Full E2E tests
        timeout-minutes: 165
        run: npx playwright test --reporter=line,html

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-e2e-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build E2E bundle
        run: npm run build:e2e

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Targeted iPhone WebKit smoke
        run: npx playwright test --config=playwright.webkit.config.ts --reporter=line

      - name: Upload WebKit failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-mobile-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
