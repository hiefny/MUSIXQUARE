name: Full E2E

# The complete Playwright suite is intentionally separate from the production
# release gate. It runs nightly at 03:17 KST and remains available on demand.
# The Chromium suite runs serially because its tests share a signaling server.

on:
  schedule:
    # GitHub cron is UTC. 18:17 UTC runs at 03:17 KST on the following day;
    # the off-minute start also avoids the busiest top-of-hour scheduling window.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musixquare-full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The serial suite has exceeded two hours on a throttled Windows host.
    # Preserve explicit bounds while leaving artifact-upload headroom on slow CI.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Build E2E bundle
        run: npm run build:e2e

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Full E2E tests
        timeout-minutes: 165
        run: npx playwright test --reporter=line,html

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-e2e-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Build E2E bundle
        run: npm run build:e2e

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Targeted iPhone WebKit smoke
        run: npx playwright test --config=playwright.webkit.config.ts --reporter=line

      - name: Upload WebKit failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-mobile-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
