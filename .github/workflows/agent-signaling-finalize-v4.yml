name: Trigger Signaling Repair Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-signaling-finalize-v4.yml'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: trigger-signaling-repair-runner
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the full repair runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run one-shot-signaling-production.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh pr comment 82 --repo "$GITHUB_REPOSITORY" --body "Dispatched the full signaling repair runner from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true
