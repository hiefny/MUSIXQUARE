<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSIXQUARE – UI Showcase</title>
<style>
@font-face {
  font-family: "Pretendard";
  src: url("/fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f8f9fa;
  --primary: #3b82f6;
  --primary-rgb: 59, 130, 246;
  --text-main: #212529;
  --text-sub: #495057;
}

body {
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

.promo-scene {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 1;
}

/* ─── Background blobs ─── */
.promo-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0;
  pointer-events: none;
}
.promo-blob-1 {
  width: 500px; height: 500px;
  background: rgba(59,130,246,0.10);
  top: -120px; right: -120px;
}
.promo-blob-2 {
  width: 400px; height: 400px;
  background: rgba(59,130,246,0.06);
  bottom: -100px; left: -100px;
}

/* ─── Logo + tagline area ─── */
#promo-top {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 3;
  white-space: nowrap;
}

.glow-bg {
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--primary-rgb), 0.15) 0%, transparent 70%);
  opacity: 0;
  pointer-events: none;
}

.note-icon-wrapper {
  margin-bottom: 48px;
  opacity: 0;
  transform: scale(0.5);
}
.note-icon { width: 96px; height: 96px; overflow: visible; }
/* Inside stroke: use clip-path to mask the outer half of the stroke */
.note-stroke {
  fill: none; stroke: var(--primary); stroke-width: 2.4;
  stroke-dasharray: 60; stroke-dashoffset: 60;
  stroke-linecap: round; stroke-linejoin: round; opacity: 0;
  clip-path: url(#note-clip);
}
.note-fill-path { fill: var(--primary); opacity: 0; }

.logo-welcome { height: 56px; fill: var(--text-main); display: block; }
.logo-welcome > .wg { opacity: 0; }
.wl.wlr  { clip-path: inset(0 100% 0 0); }
.wl.wrl  { clip-path: inset(0 0 0 100%); }
.wl.wtb  { clip-path: inset(0 0 100% 0); }
.wl.wbt  { clip-path: inset(100% 0 0 0); }
.wl.wdiag { clip-path: inset(0 100% 100% 0); }

/* Tagline: large, same visual weight as MUSIXQUARE logo */
#promo-tagline {
  font-size: 60px;
  font-weight: 800;
  color: var(--text-main);
  margin-top: 20px;
  letter-spacing: -0.8px;
  opacity: 0;
  text-align: center;
  line-height: 1.35;
  white-space: normal;
  max-width: 600px;
}

/* ─── Phone frame ─── */
.promo-phone-wrap {
  position: absolute;
  width: 375px; height: 812px;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -48%) scale(1.55);
  z-index: 2;
  opacity: 0;
}

.promo-phone {
  width: 375px; height: 812px;
  border-radius: 0; overflow: hidden;
  position: relative; background: #fff;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.10),
    0 4px 16px rgba(0,0,0,0.05);
}

.promo-phone iframe {
  width: 375px; height: 812px;
  border: none; display: block;
}
</style>
</head>
