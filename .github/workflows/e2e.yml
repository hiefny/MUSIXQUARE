name: E2E

# The Playwright suite runs serially (workers: 1 due to shared PeerJS
# signaling) and takes roughly 30 minutes. PRs use the focused smoke gate in
# ci.yml; this full compatibility run remains scheduled and manually runnable.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build E2E bundle
        run: npm run build:e2e

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        run: npx playwright test
