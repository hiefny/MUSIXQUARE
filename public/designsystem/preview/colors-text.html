<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MUSIXQUARE" />
    <meta property="og:title" content="Design System · MUSIXQUARE" />
    <meta property="og:image" content="https://musixquare.com/og-designsystem.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Design System · MUSIXQUARE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Design System · MUSIXQUARE" />
    <meta name="twitter:image" content="https://musixquare.com/og-designsystem.png" />
    <meta name="twitter:image:alt" content="Design System · MUSIXQUARE" />

    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .card {
        padding: 20px 24px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .swatch {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }
      .meta {
        font-size: 11px;
        font-weight: 700;
      }
      .meta .hx {
        color: var(--text-sub);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <div class="swatch">
          <div
            class="dot"
            style="
              background: #eeeeee;
              outline: 1px solid rgba(255, 255, 255, 0.1);
              outline-offset: -1px;
            "
          ></div>
          <div class="meta">text-main<br /><span class="hx">#EEEEEE</span></div>
        </div>
        <div class="swatch">
          <div class="dot" style="background: #a1a1aa"></div>
          <div class="meta">text-sub<br /><span class="hx">#A1A1AA</span></div>
        </div>
        <div class="swatch">
          <div class="dot" style="background: #71717a"></div>
          <div class="meta">text-muted<br /><span class="hx">#71717A</span></div>
        </div>
        <div class="swatch">
          <div class="dot" style="background: #303540"></div>
          <div class="meta">light text-main<br /><span class="hx">#303540</span></div>
        </div>
        <div class="swatch">
          <div class="dot" style="background: #495057"></div>
          <div class="meta">light text-sub<br /><span class="hx">#495057</span></div>
        </div>
        <div class="swatch">
          <div class="dot" style="background: #868e96"></div>
          <div class="meta">light text-muted<br /><span class="hx">#868E96</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
