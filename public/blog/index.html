  <style>
    .editorial-blog {
      --blog-max: 960px;
    }

    .blog-shell {
      width: min(var(--blog-max), calc(100vw - 32px));
      margin: calc(var(--header-h) + var(--tabs-h) + 56px) auto 0;
    }

    .blog-heading {
      margin-bottom: 28px;
    }

    .blog-kicker {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .blog-heading h1 {
      margin: 0;
      font-size: 76px;
      line-height: 0.95;
      letter-spacing: 0;
    }

    .blog-heading p {
      max-width: 620px;
      margin: 18px 0 0;
      color: var(--text-sub);
      font-size: 18px;
    }

    #soro-blog {
      min-height: 360px;
    }

    @media (max-width: 720px) {
      .blog-shell {
        width: min(100% - 24px, var(--blog-max));
        margin-top: calc(var(--header-h) + var(--tabs-h) + 36px);
      }

      .blog-heading h1 {
        font-size: 42px;
      }

      .blog-heading p {
        font-size: 16px;
      }
    }
  </style>
