name = "musixquare-remote-share"
main = "remote-share-worker.js"
compatibility_date = "2026-05-03"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[routes]]
pattern = "share.musixquare.com"
custom_domain = true

[vars]
R2_BUCKET_NAME = "musixquare-remote-share"
OBJECT_TTL_SECONDS = "3600"
RATE_LIMIT_WINDOW_SECONDS = "3600"
IP_UPLOADS_PER_WINDOW = "60"
ROOM_UPLOADS_PER_WINDOW = "0"
ROOM_STORAGE_QUOTA_BYTES = "1073741824"
ALLOWED_ORIGINS = "https://musixquare.com,https://www.musixquare.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"

# Required secrets, set outside this file:
# npx wrangler secret put R2_ACCOUNT_ID --config cloudflare/wrangler.remote-share.toml
# npx wrangler secret put REMOTE_SHARE_SIGNING_SECRET --config cloudflare/wrangler.remote-share.toml
# npx wrangler secret put R2_ACCESS_KEY_ID --config cloudflare/wrangler.remote-share.toml
# npx wrangler secret put R2_SECRET_ACCESS_KEY --config cloudflare/wrangler.remote-share.toml
# Required for capability gate (set to same value as app worker MXQR_CAPABILITY_SECRET
# so app-issued tokens verify here):
# npx wrangler secret put MXQR_CAPABILITY_SECRET --config cloudflare/wrangler.remote-share.toml

[[r2_buckets]]
binding = "REMOTE_SHARE_BUCKET"
bucket_name = "musixquare-remote-share"

[[kv_namespaces]]
binding = "REMOTE_SHARE_RATE_LIMIT"
id = "ccf776d532e44e2daed916e7304542cd"

[[durable_objects.bindings]]
name = "REMOTE_SHARE_QUOTA"
class_name = "RemoteShareQuota"

# Cloudflare requires this Durable Object migration history to remain
# append-only. These provider-managed identifiers are immutable infrastructure
# schema tags; do not edit or reuse deleted class names.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoteShareRateLimiter"]

[[migrations]]
tag = "v2"
deleted_classes = ["RemoteShareRateLimiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RemoteShareQuota"]
