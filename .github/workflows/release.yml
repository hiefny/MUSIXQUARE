name: Production Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker scope to deploy
        required: true
        default: app
        type: choice
        options:
          - app
          - signaling
          - pro-room
          - developer-api
          - remote-share
          - all
      apply_developer_api_d1:
        description: Apply the current Developer API D1 baseline
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: musixquare-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_artifact_name: ${{ steps.candidate_source.outputs.artifact_name }}
      candidate_run_attempt: ${{ steps.candidate_source.outputs.run_attempt }}
      candidate_run_id: ${{ steps.candidate_source.outputs.run_id }}
      candidate_validation_profile: ${{ steps.candidate_source.outputs.validation_profile }}

    steps:
      - name: Validate release options
        run: |
          if [[ "${{ inputs.apply_developer_api_d1 }}" == "true" &&
                "${{ inputs.target }}" != "all" &&
                "${{ inputs.target }}" != "developer-api" ]]; then
            echo "::error::Developer API D1 changes require target 'developer-api' or 'all'."
            exit 1
          fi

      - name: Select exact-SHA validated candidate
        id: candidate_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 720))
          while (( SECONDS < deadline )); do
            runs="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="$GITHUB_SHA" \
                -f per_page=20
            )"
            run_id="$(
              jq -r \
                '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.run_attempt) | last | .id // empty' \
                <<< "$runs"
            )"
            if [[ -n "$run_id" ]]; then
              artifacts="$(
                gh api --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                  -f per_page=100
              )"
              artifact_prefix="production-candidate-$GITHUB_SHA-$run_id-"
              artifact_name="$(
                jq -r --arg prefix "$artifact_prefix" \
                  '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at) | last | .name // empty' \
                  <<< "$artifacts"
              )"
              if [[ -z "$artifact_name" ]]; then
                echo "::error::Successful CI run $run_id has no unexpired exact-SHA production candidate."
                exit 1
              fi
              run_attempt="${artifact_name##*-}"
              if [[ ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Production candidate $artifact_name has an invalid source attempt."
                exit 1
              fi
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
              echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
              echo "validation_profile=main-ci" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            active_count="$(
              jq -r \
                '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' \
                <<< "$runs"
            )"
            completed_url="$(
              jq -r \
                '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_attempt) | last | .html_url // empty' \
                <<< "$runs"
            )"
            if [[ "$active_count" == "0" && -n "$completed_url" ]]; then
              echo "::error::The exact main commit did not pass CI: $completed_url"
              exit 1
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for successful CI on exact commit $GITHUB_SHA."
          exit 1

  deploy:
    name: Deploy validated candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      mutation_authorized: ${{ steps.mutation_authorization.outputs.authorized }}
      production_committed: ${{ steps.production_commit.outputs.committed }}
    environment:
      name: production
      url: https://musixquare.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare deployment status can return only the first 50 characters
      # of an upload annotation. Keep exact-equality ownership inside that
      # observed boundary instead of weakening the ownership comparison.
      RELEASE_MESSAGE: git:${{ github.sha }}
      RELEASE_ROLLBACK_MESSAGE: rollback:${{ github.run_id }}:${{ github.run_attempt }}
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_SOURCE_RUN_ATTEMPT: ${{ needs.validate.outputs.candidate_run_attempt }}
      RELEASE_SOURCE_RUN_ID: ${{ needs.validate.outputs.candidate_run_id }}
      RELEASE_VALIDATION_PROFILE: ${{ needs.validate.outputs.candidate_validation_profile }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          # The schema-intent fence compares this release with the immutable
          # SHA recorded on the previous deployment. Keep that commit object
          # available instead of failing closed on a shallow checkout.
          fetch-depth: 0

      - name: Verify release commit is still current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced to $current_main after this release was dispatched. Run the release again for the current commit."
            exit 1
          fi
          # From this point onward the immutable candidate is pinned. If main
          # advances while a multi-Worker release is in flight, completing
          # this coherent candidate is safer than aborting after only part of
          # the stack has changed. The newer commit gets its own release.

      - name: Require a full release for remote-share contract cutovers
        shell: bash
        run: |
          contract_marker='cloudflare/remote-share-contract-version.txt'
          parent_sha="$(git rev-parse "${GITHUB_SHA}^")"
          if git diff --quiet "$parent_sha" "$GITHUB_SHA" -- "$contract_marker"; then
            exit 0
          fi
          if [[ "${{ inputs.target }}" != 'all' ]]; then
            echo "::error::A remote-share public contract cutover requires target 'all' so the app and Worker deploy together."
            exit 1
          fi

      - name: Require a full release for service-control contract cutovers
        shell: bash
        run: |
          contract_marker='cloudflare/service-control-contract-version.txt'
          parent_sha="$(git rev-parse "${GITHUB_SHA}^")"
          if git diff --quiet "$parent_sha" "$GITHUB_SHA" -- "$contract_marker"; then
            exit 0
          fi
          if [[ "${{ inputs.target }}" != 'all' ]]; then
            echo "::error::A service-control contract cutover requires target 'all' so the PRO and app Workers deploy together."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies with pinned npm
        run: corepack npm ci

      - name: Download validated production candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.candidate_artifact_name }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.candidate_run_id }}

      - name: Verify candidate hashes and commit
        run: npm run release:verify

      - name: Revalidate every production Worker bundle without deploying
        run: npm run check:worker-bundles

      - name: Verify Cloudflare credentials
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run --silent wrangler -- whoami

      - name: Verify partial release dependency compatibility
        if: inputs.target != 'all'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-deployment-state.mjs compatibility "$RELEASE_TARGET" "${{ github.sha }}"

      - name: Prepare deployment records
        run: mkdir -p release-artifacts/deployments

      - name: Capture immutable Worker and R2 recovery checkpoint
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p release-artifacts/recovery-checkpoint
          node scripts/release-deployment-state.mjs \
            checkpoint "$RELEASE_TARGET" \
            release-artifacts/recovery-checkpoint
          node scripts/release-r2-policy-state.mjs \
            snapshot "$RELEASE_TARGET" \
            release-artifacts/recovery-checkpoint

      - name: Capture immutable Worker compatibility floors
        timeout-minutes: 10
        if: inputs.target != 'remote-share'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          floor_file='release-artifacts/recovery-checkpoint/worker-floor-before-live.json'
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor, CASE WHEN EXISTS (SELECT 1 FROM mxqr_pro_grant_audit WHERE actor_id = 'system:entitlement-backfill' AND action = 'entitlement.backfill' AND result = 'complete') THEN 1 ELSE 0 END AS entitlement_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs "$floor_file"
          node scripts/release-worker-floor-state.mjs \
            snapshot "$RELEASE_TARGET" "$floor_file" \
            release-artifacts/recovery-checkpoint

      - name: Persist pre-mutation recovery checkpoint
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-recovery-checkpoint-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/recovery-checkpoint/
          if-no-files-found: error
          retention-days: 90

      - name: Authorize production mutations from persisted checkpoint
        id: mutation_authorization
        run: echo 'authorized=true' >> "$GITHUB_OUTPUT"

      - name: Read PRO room generation cutover before dependency rollout
        timeout-minutes: 10
        id: pro_room_generation_cutover_before_rollout
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-before-rollout.json
          node scripts/pro-room-generation-cutover.mjs cutover-outputs \
            release-artifacts/deployments/pro-room-generation-cutover-before-rollout.json \
            >> "$GITHUB_OUTPUT"

      - name: Verify full release honors immutable PRO generation floor
        if: inputs.target == 'all'
        shell: bash
        run: |
          if [[ "${{ steps.pro_room_generation_cutover_before_rollout.outputs.generation_floor }}" != "true" ]]; then
            echo "::error::The immutable PRO generation floor is not established. Repair production forward; the completed first-generation ceremony cannot be replayed."
            exit 1
          fi
          floor_release_sha="${{ steps.pro_room_generation_cutover_before_rollout.outputs.floor_release_sha }}"
          if [[ ! "$floor_release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The immutable PRO generation floor is missing or malformed."
            exit 1
          fi
          if ! git cat-file -e "${floor_release_sha}^{commit}" 2>/dev/null; then
            echo "::error::The immutable PRO generation floor commit is unavailable in this checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$floor_release_sha" "${{ github.sha }}"; then
            echo "::error::This full release predates or diverges from the immutable PRO generation floor."
            exit 1
          fi

      - name: Fence room-code reuse during dependency rollout
        timeout-minutes: 10
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "UPDATE mxqr_pro_room_generation_cutover SET status = 'disabled', release_sha = NULL, updated_at = unixepoch() * 1000 WHERE contract_version = 1; SELECT cutover.contract_version, cutover.status, cutover.release_sha, cutover.ever_enabled, cutover.floor_release_sha, CASE WHEN cutover.ever_enabled = 1 OR EXISTS (SELECT 1 FROM mxqr_pro_room_registry WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_history WHERE room_generation > 0) OR EXISTS (SELECT 1 FROM mxqr_pro_room_generation_allocations WHERE room_generation > 0) THEN 1 ELSE 0 END AS generation_floor FROM mxqr_pro_room_generation_cutover AS cutover WHERE cutover.contract_version = 1" \
            | node scripts/capture-wrangler-d1-json.mjs \
                release-artifacts/deployments/pro-room-generation-cutover-rollout-fenced.json
          node scripts/pro-room-generation-cutover.mjs verify-cutover \
            release-artifacts/deployments/pro-room-generation-cutover-rollout-fenced.json \
            disabled

      - name: Apply and verify lifetime room-count D1 contract
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'app'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --config cloudflare/wrangler.app.toml \
            --file cloudflare/admin-metrics.lifetime-room-count.migration.sql

          verify_file='release-artifacts/deployments/admin-lifetime-room-count-verified.json'
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'mxqr_lifetime_metric_totals' AND instr(lower(sql), 'count integer not null') > 0 AND instr(lower(sql), 'check (count >= 0)') > 0) AS table_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('mxqr_lifetime_room_opened_insert', 'mxqr_lifetime_room_opened_increment')) AS trigger_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('mxqr_lifetime_room_opened_insert', 'mxqr_lifetime_room_opened_increment') AND instr(lower(sql), 'new.event = ''room_opened''') > 0 AND instr(lower(sql), 'mxqr_lifetime_metric_totals') > 0) AS room_opened_guard_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name = 'mxqr_lifetime_room_opened_insert' AND instr(lower(sql), 'new.count > 0') > 0) AS insert_guard_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name = 'mxqr_lifetime_room_opened_increment' AND instr(lower(sql), 'new.count > old.count') > 0 AND instr(lower(sql), 'new.count - old.count') > 0) AS increment_guard_count, (SELECT COUNT(*) FROM mxqr_lifetime_metric_totals WHERE event = 'room_opened' AND typeof(count) = 'integer' AND count >= 0) AS row_count, (SELECT count FROM mxqr_lifetime_metric_totals WHERE event = 'room_opened') AS rooms_opened, (SELECT COALESCE(SUM(count), 0) FROM mxqr_metric_buckets WHERE event = 'room_opened') AS retained_rooms_opened" \
            | node scripts/capture-wrangler-d1-json.mjs "$verify_file"
          jq -e '
            .[0].results[0]
            | (.table_count | tonumber) == 1
              and (.trigger_count | tonumber) == 2
              and (.room_opened_guard_count | tonumber) == 2
              and (.insert_guard_count | tonumber) == 1
              and (.increment_guard_count | tonumber) == 1
              and (.row_count | tonumber) == 1
              and (.rooms_opened | tonumber) >= (.retained_rooms_opened | tonumber)
          ' "$verify_file" >/dev/null || {
            echo '::error::The production lifetime room-count schema/backfill contract is incomplete.'
            jq '.[0].results[0]' "$verify_file"
            exit 1
          }

      - name: Apply and verify generic PRO grant D1 contract
        timeout-minutes: 10
        if: inputs.target == 'all' || inputs.target == 'app' || inputs.target == 'pro-room'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --config cloudflare/wrangler.app.toml \
            --file cloudflare/admin-metrics.pro-grants.migration.sql

          verify_file='release-artifacts/deployments/admin-pro-grants-verified.json'
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name IN ('mxqr_pro_grant_campaigns', 'mxqr_pro_grant_voucher_batches', 'mxqr_pro_grant_vouchers', 'mxqr_pro_grant_account_fences', 'mxqr_pro_grants', 'mxqr_pro_grant_allocations', 'mxqr_pro_grant_redemptions', 'mxqr_pro_grant_audit', 'mxqr_pro_account_entitlements')) AS table_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name IN ('idx_mxqr_pro_grant_vouchers_campaign_status', 'idx_mxqr_pro_grant_vouchers_batch', 'idx_mxqr_pro_grants_one_current_pro_per_account', 'idx_mxqr_pro_grants_validity_status', 'idx_mxqr_pro_grant_allocations_room_status', 'idx_mxqr_pro_grant_redemptions_account_campaign', 'idx_mxqr_pro_grant_audit_campaign_created', 'idx_mxqr_pro_account_entitlements_one_current_account', 'idx_mxqr_pro_account_entitlements_one_reserved_room', 'idx_mxqr_pro_account_entitlements_room_status', 'idx_mxqr_pro_account_entitlements_transfer_request')) AS index_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('mxqr_pro_grant_campaigns_no_delete', 'mxqr_pro_grant_voucher_batches_no_delete', 'mxqr_pro_grant_voucher_material_immutable', 'mxqr_pro_grant_voucher_registry_guard', 'mxqr_pro_grant_vouchers_no_delete', 'mxqr_pro_grants_no_delete', 'mxqr_pro_grant_account_fences_no_update', 'mxqr_pro_grant_account_fences_no_delete', 'mxqr_pro_grant_allocations_no_delete', 'mxqr_pro_grant_redemptions_no_delete', 'mxqr_pro_account_entitlements_material_immutable', 'mxqr_pro_account_entitlements_no_delete', 'mxqr_pro_grant_audit_no_update', 'mxqr_pro_grant_audit_no_delete')) AS trigger_count, (SELECT COUNT(*) FROM pragma_table_info('mxqr_pro_grant_vouchers') WHERE lower(name) IN ('code', 'raw_code', 'plaintext_code')) + (SELECT COUNT(*) FROM pragma_table_info('mxqr_pro_grant_audit') WHERE lower(name) IN ('code', 'code_digest', 'raw_code', 'plaintext_code', 'claim_token', 'cookie', 'pin')) AS forbidden_secret_column_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_mxqr_pro_grants_one_current_pro_per_account' AND instr(lower(sql), 'pending_activation') > 0 AND instr(lower(sql), 'active') > 0 AND instr(lower(sql), 'suspended') > 0) AS account_limit_index_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'mxqr_pro_grant_account_fences' AND instr(lower(sql), 'account_deleted') > 0) AS account_fence_table_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_mxqr_pro_account_entitlements_one_current_account' AND instr(lower(sql), '''reserved''') > 0 AND instr(lower(sql), '''active''') > 0 AND instr(lower(sql), '''suspended''') > 0 AND instr(lower(sql), '''transfer_source_reserved''') > 0 AND instr(lower(sql), '''transfer_source_active''') > 0 AND instr(lower(sql), '''transfer_source_suspended''') > 0) AS entitlement_account_index_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_mxqr_pro_account_entitlements_one_reserved_room' AND instr(lower(sql), '''reserved''') > 0 AND instr(lower(sql), '''active''') > 0 AND instr(lower(sql), '''suspended''') > 0 AND instr(lower(sql), '''orphaned''') > 0 AND instr(lower(sql), 'transfer_source') = 0) AS entitlement_room_index_count" \
            | node scripts/capture-wrangler-d1-json.mjs "$verify_file"
          jq -e '
            .[0].results[0]
            | (.table_count | tonumber) == 9
              and (.index_count | tonumber) == 11
              and (.trigger_count | tonumber) == 14
              and (.forbidden_secret_column_count | tonumber) == 0
              and (.account_limit_index_count | tonumber) == 1
              and (.account_fence_table_count | tonumber) == 1
              and (.entitlement_account_index_count | tonumber) == 1
              and (.entitlement_room_index_count | tonumber) == 1
          ' "$verify_file" >/dev/null || {
            echo '::error::The production generic PRO grant schema contract is incomplete.'
            jq '.[0].results[0]' "$verify_file"
            exit 1
          }

      - name: Apply and verify PRO suspension-reason D1 contract
        timeout-minutes: 10
        if: inputs.target == 'all'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The production environment secret CLOUDFLARE_D1_API_TOKEN is not configured."
            exit 1
          fi
          probe_file='release-artifacts/deployments/admin-suspension-reason-before.json'
          npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
            --remote --json --config cloudflare/wrangler.app.toml \
            --command "SELECT COUNT(*) AS column_count FROM pragma_table_info('mxqr_pro_room_registry') WHERE name = 'suspension_reason'" \
            | node scripts/capture-wrangler-d1-json.mjs "$probe_file"
          column_count="$(jq -er '.[0].results[0].column_count | tonumber' "$probe_file")"
          if [[ "$column_count" == '0' ]]; then
            npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
              --remote --config cloudflare/wrangler.app.toml \
              --file cloudflare/admin-metrics.suspension-reason.migration.sql
          elif [[ "$column_count" == '1' ]]; then
            # A previous attempt can commit ALTER TABLE before a later
            # statement fails. Rebuild the idempotent post-ALTER tail so a
            # workflow rerun repairs/backfills instead of repeating ALTER.
            repair_file='release-artifacts/deployments/admin-suspension-reason-repair.sql'
            awk '
              /^UPDATE mxqr_pro_room_registry$/ { emit = 1 }
              emit {
                if ($0 == "CREATE TRIGGER mxqr_pro_room_registry_suspension_reason_insert_guard") {
                  print "DROP TRIGGER IF EXISTS mxqr_pro_room_registry_suspension_reason_insert_guard;"
                }
                if ($0 == "CREATE TRIGGER mxqr_pro_room_registry_suspension_reason_update_guard") {
                  print "DROP TRIGGER IF EXISTS mxqr_pro_room_registry_suspension_reason_update_guard;"
                }
                print
              }
            ' cloudflare/admin-metrics.suspension-reason.migration.sql > "$repair_file"
            grep -Fq 'DROP TRIGGER IF EXISTS mxqr_pro_room_registry_suspension_reason_insert_guard;' "$repair_file"
            grep -Fq 'DROP TRIGGER IF EXISTS mxqr_pro_room_registry_suspension_reason_update_guard;' "$repair_file"
            npm run --silent wrangler -- d1 execute musixquare-admin-metrics \
              --remote --config cloudflare/wrangler.app.toml --file "$repair_file"
          else
