<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background: var(--bg); color: var(--text-main); font-family: var(--font-sans); }
  .card { padding: 20px 24px; min-height: 150px; box-sizing:border-box; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .sw { width: 64px; height: 64px; border-radius: var(--radius-s); display:flex; flex-direction:column; justify-content:flex-end; padding: 6px 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; box-sizing:border-box; }
  .sw.bordered { outline: 1px solid rgba(255,255,255,0.08); outline-offset: -1px; }
  .label-s { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-sub); }
  .mono { font-variant-numeric: tabular-nums; }
