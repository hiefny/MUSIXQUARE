<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .frame {
        padding: 24px 0;
      }
      .nav {
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-around;
        padding: 10px 16px;
        border: 0;
        border-radius: 0;
        background: var(--surface-1);
        box-shadow: none;
      }
      .item {
        display: flex;
        min-width: 0;
        min-height: 44px;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #6b7684;
        font: inherit;
        font-size: 10px;
        font-weight: 500;
      }
      .item svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .item.active {
        color: var(--primary);
      }
      [data-theme='dark'] .item:not(.active) span {
        color: #8b95a1;
      }
      .note {
        margin: 14px 24px 0;
        color: var(--text-sub);
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </head>
