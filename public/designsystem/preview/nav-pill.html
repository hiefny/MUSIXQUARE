<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:22px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.nav{display:flex;gap:6px;background:var(--glass-bg);backdrop-filter:blur(16px);padding:10px 16px;border-radius:16px;}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:#6B7684;cursor:pointer;font-size:10px;font-weight:500;}
.item svg{width:24px;height:24px;fill:currentColor;}
.item.active{color:var(--primary);}
.pill{display:inline-flex;padding:8px 16px;border-radius:100px;font-size:13px;font-weight:700;}
.p-on{background:var(--primary);color:#fff;}
.p-off{background:var(--surface-2);color:var(--text-sub);}
