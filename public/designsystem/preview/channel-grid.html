<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:22px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surface-1);padding:8px;border-radius:20px;width:320px;}
.opt{padding:14px 8px;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text-sub);cursor:pointer;}
.opt svg{width:24px;height:24px;fill:currentColor;}
.opt.active{background:var(--primary);color:#fff;}
.hint{font-size:9px;font-weight:800;color:var(--text-sub);letter-spacing:0.14em;text-transform:uppercase;align-self:flex-start;}
</style></head><body><div class="card">
<div class="grid">
  <div class="opt"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>Left</div>
  <div class="opt"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>Right</div>
  <div class="opt"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><circle cx="12" cy="12" r="3"/></svg>Woofer</div>
  <div class="opt active"><svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.16-1.75 4.45-4H15V6h4V3h-7z"/></svg>Center</div>
</div>
<div class="hint">Channel grid · role picker</div>
</div></body></html>
