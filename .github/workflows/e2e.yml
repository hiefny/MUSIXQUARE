name: Full E2E

# Temporary diagnostic branch only. No production access or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-repeat:
    name: Fixed focus timeline repeat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the same application and test revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 594fbc5dc9ca5f43e9f4a302cc0a420a81e9fa6a
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        run: corepack npm ci
      - name: Build unchanged application
        run: npm run build:e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Instrument event order without changing application logic
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'e2e/youtube-search-interactions.test.ts';
          let source = fs.readFileSync(file, 'utf8');
          const marker = '    trackPageErrors(page);';
          const init = `    await page.addInitScript(() => {
                const events: unknown[] = [];
                (window as any).__focusTimeline = events;
                const active = () => document.activeElement?.id || document.activeElement?.tagName;
                const record = (kind: string, details: object = {}) => {
                  events.push({ at: performance.now(), kind, active: active(), ...details });
                  if (events.length > 400) events.shift();
                };
                for (const type of ['focusin', 'focusout', 'keydown', 'keyup']) {
                  document.addEventListener(type, (event) => {
                    record(type, { target: (event.target as HTMLElement)?.id, key: (event as KeyboardEvent).key, shift: (event as KeyboardEvent).shiftKey });
                  }, true);
                }
                const originalFocus = HTMLElement.prototype.focus;
                HTMLElement.prototype.focus = function (...args) {
                  if (['youtube-url-input', 'btn-yt-cancel', 'btn-local-file', 'btn-youtube-source'].includes(this.id)) {
                    record('focus-call', { target: this.id, stack: new Error().stack });
                  }
                  return originalFocus.apply(this, args);
                };
                const originalTimeout = window.setTimeout;
                window.setTimeout = function (callback: TimerHandler, delay?: number, ...args: unknown[]) {
                  if (delay !== 100 || typeof callback !== 'function') return originalTimeout(callback, delay, ...args);
                  const callbackSource = String(callback);
                  const stack = new Error().stack;
                  record('timer-100-set', { callbackSource, stack });
                  return originalTimeout(() => {
                    record('timer-100-fire', { callbackSource, stack });
                    callback(...args);
                  }, delay);
                } as typeof window.setTimeout;
              });
          `;
          if (!source.includes(marker)) throw new Error('init marker missing');
          source = source.replace(marker, init + marker);
          const hookMarker = '  test.afterEach(async ({ page }) => {';
          const hook = `  test.afterEach(async ({ page }, testInfo) => {
              await testInfo.attach('focus-timeline', {
                body: JSON.stringify(await page.evaluate(() => (window as any).__focusTimeline), null, 2),
                contentType: 'application/json',
              });
            });
          `;
          if (!source.includes(hookMarker)) throw new Error('hook marker missing');
          fs.writeFileSync(file, source.replace(hookMarker, hook + hookMarker));
          NODE
      - name: Repeat state-aware keyboard entry 30 times without retries
        run: npx playwright test e2e/youtube-search-interactions.test.ts --project=chromium --grep 'keeps the empty editable input' --repeat-each=30 --retries=0 --reporter=line,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: focus-results.json
          PLAYWRIGHT_HTML_OPEN: never
      - name: Save evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: focus-timeline-${{ matrix.os }}-${{ github.run_id }}
          path: |
            focus-results.json
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
