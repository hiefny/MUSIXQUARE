[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin to a specific LTS so Netlify rotating its default Node image can't
  # break a launch-week build. Bump intentionally when upgrading deps.
  NODE_VERSION = "22"

# ─── Domain migration: mxqr.netlify.app → musixquare.com ───
# Explicit robots.txt exception for GSC over Netlify domain
[[redirects]]
  from = "https://mxqr.netlify.app/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# Exact root match
[[redirects]]
  from = "https://mxqr.netlify.app"
  to = "https://musixquare.com"
  status = 301
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app"
  to = "https://musixquare.com"
  status = 301
  force = true

# Wildcard match for all sub-pages
[[redirects]]
  from = "https://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://mxqr.netlify.app/*"
  to = "https://musixquare.com/:splat"
  status = 301
  force = true

# Design system: serve /designsystem and /designsystem/ as the static index
[[redirects]]
  from = "/designsystem"
  to = "/designsystem/index.html"
  status = 200

[[redirects]]
  from = "/designsystem/"
  to = "/designsystem/index.html"
  status = 200

# Roadmap: serve /roadmap and /roadmap/ as the static index
[[redirects]]
  from = "/roadmap"
  to = "/roadmap/index.html"
  status = 200

[[redirects]]
  from = "/roadmap/"
  to = "/roadmap/index.html"
  status = 200

# Changelog: serve /changelog and /changelog/ as the static index
[[redirects]]
  from = "/changelog"
  to = "/changelog/index.html"
  status = 200

[[redirects]]
  from = "/changelog/"
  to = "/changelog/index.html"
  status = 200

# Landing: serve /landing and /landing/ as the static landing page
[[redirects]]
  from = "/landing"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/landing/"
  to = "/landing.html"
  status = 200

# Case-variant redirects → canonical lowercase (301)
[[redirects]]
  from = "/DESIGNSYSTEM"
  to = "/designsystem/"
  status = 301

[[redirects]]
  from = "/DESIGNSYSTEM/"
  to = "/designsystem/"
  status = 301

[[redirects]]
  from = "/DesignSystem"
  to = "/designsystem/"
  status = 301

[[redirects]]
  from = "/DesignSystem/"
  to = "/designsystem/"
  status = 301

[[redirects]]
  from = "/CHANGELOG"
  to = "/changelog/"
  status = 301

[[redirects]]
  from = "/CHANGELOG/"
  to = "/changelog/"
  status = 301

[[redirects]]
  from = "/Changelog"
  to = "/changelog/"
  status = 301

[[redirects]]
  from = "/Changelog/"
  to = "/changelog/"
  status = 301

[[redirects]]
  from = "/ROADMAP"
  to = "/roadmap/"
  status = 301

[[redirects]]
  from = "/ROADMAP/"
  to = "/roadmap/"
  status = 301

[[redirects]]
  from = "/Roadmap"
  to = "/roadmap/"
  status = 301

[[redirects]]
  from = "/Roadmap/"
  to = "/roadmap/"
  status = 301

# SPA fallback: serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Security headers (all routes) ───
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; media-src 'self' blob:; connect-src 'self' blob: wss://0.peerjs.com:443 https://0.peerjs.com:443 wss://*.peerjs.com https://*.peerjs.com https://www.youtube.com https://musixquare.com https://share.musixquare.com; frame-src https://www.youtube.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'"

# Cache hashed Vite assets aggressively (immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must not be cached
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
