name = "musixquare-signaling"
main = "signaling-worker.js"
compatibility_date = "2026-05-04"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[routes]]
pattern = "signal.musixquare.com"
custom_domain = true

[[durable_objects.bindings]]
name = "MUSIXQUARE_ROOMS"
class_name = "MusixquareRoom"

# Admin dashboard metrics shared with the app Worker.
[[d1_databases]]
binding = "MUSIXQUARE_ADMIN_DB"
database_name = "musixquare-admin-metrics"
database_id = "d6cc9ceb-f0b6-40e4-99aa-8f28bec412ed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MusixquareRoom"]
