<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .card {
        padding: 24px;
        position: relative;
        min-height: 140px;
      }
      .toast {
        background: var(--surface-1);
        color: var(--text-main);
        padding: 14px 28px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        display: inline-block;
      }
      .dialog {
        --dialog-squircle-corner: 34px;
        background: var(--surface-1);
        border-radius: var(--radius-l);
        padding: 28px 32px;
        max-width: 320px;
        margin-top: 14px;
        filter: drop-shadow(0 20px 48px rgba(0, 0, 0, 0.32));
        clip-path: polygon(
          0 var(--dialog-squircle-corner),
          0.2px 29px,
          0.8px 24.5px,
          1.8px 20.5px,
          3.1px 17px,
          4.9px 14px,
          7px 10.8px,
          9.5px 8.5px,
          12.4px 6.4px,
          15.6px 4.6px,
          19.2px 3px,
          23px 1.7px,
          26.8px 0.8px,
          30.5px 0.2px,
          var(--dialog-squircle-corner) 0,
          calc(100% - var(--dialog-squircle-corner)) 0,
          calc(100% - 30.5px) 0.2px,
          calc(100% - 26.8px) 0.8px,
          calc(100% - 23px) 1.7px,
          calc(100% - 19.2px) 3px,
          calc(100% - 15.6px) 4.6px,
          calc(100% - 12.4px) 6.4px,
          calc(100% - 9.5px) 8.5px,
          calc(100% - 7px) 10.8px,
          calc(100% - 4.9px) 14px,
          calc(100% - 3.1px) 17px,
          calc(100% - 1.8px) 20.5px,
          calc(100% - 0.8px) 24.5px,
          calc(100% - 0.2px) 29px,
          100% var(--dialog-squircle-corner),
          100% calc(100% - var(--dialog-squircle-corner)),
          calc(100% - 0.2px) calc(100% - 29px),
          calc(100% - 0.8px) calc(100% - 24.5px),
          calc(100% - 1.8px) calc(100% - 20.5px),
          calc(100% - 3.1px) calc(100% - 17px),
          calc(100% - 4.9px) calc(100% - 14px),
          calc(100% - 7px) calc(100% - 10.8px),
          calc(100% - 9.5px) calc(100% - 8.5px),
          calc(100% - 12.4px) calc(100% - 6.4px),
          calc(100% - 15.6px) calc(100% - 4.6px),
          calc(100% - 19.2px) calc(100% - 3px),
          calc(100% - 23px) calc(100% - 1.7px),
          calc(100% - 26.8px) calc(100% - 0.8px),
          calc(100% - 30.5px) calc(100% - 0.2px),
          calc(100% - var(--dialog-squircle-corner)) 100%,
          var(--dialog-squircle-corner) 100%,
          30.5px calc(100% - 0.2px),
          26.8px calc(100% - 0.8px),
          23px calc(100% - 1.7px),
          19.2px calc(100% - 3px),
          15.6px calc(100% - 4.6px),
          12.4px calc(100% - 6.4px),
          9.5px calc(100% - 8.5px),
          7px calc(100% - 10.8px),
          4.9px calc(100% - 14px),
          3.1px calc(100% - 17px),
          1.8px calc(100% - 20.5px),
          0.8px calc(100% - 24.5px),
          0.2px calc(100% - 29px),
          0 calc(100% - var(--dialog-squircle-corner))
        );
      }
      .dtitle {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 16px;
      }
      .dmsg {
        font-size: 15px;
        color: var(--text-sub);
        font-weight: 500;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .drow {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .db {
        height: 52px;
        min-width: 100px;
        padding: 0 24px;
        border-radius: 999px;
        border: none;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }
      .db.ghost {
        background: var(--surface-2);
        color: var(--text-main);
      }
      .db.prim {
        padding: 0 32px;
        background: var(--primary);
        color: #fff;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="toast">Invite code: 492815</div>
      <div class="dialog">
        <div class="dtitle">Leave Session</div>
        <div class="dmsg">Return to the start screen? You'll be disconnected.</div>
        <div class="drow">
          <button class="db ghost">Stay</button><button class="db prim">Leave</button>
        </div>
      </div>
    </div>
  </body>
</html>
