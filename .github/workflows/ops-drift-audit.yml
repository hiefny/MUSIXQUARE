name: Operations Drift Audit

# Read-only daily and manually dispatched comparison of practical live controls
# with their checked-in contracts. It never applies CORS, changes secrets, or
# edits a GitHub ruleset.

on:
  schedule:
    # Daily at 03:37 UTC. The non-hour boundary avoids common Actions load.
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musixquare-operations-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout audit contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The D1 guard verifies every visible manifest revision, so the
          # read-only audit must retain full first-parent history too.
          fetch-depth: 0

      - name: Use pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Validate source contracts
        run: |
          node scripts/check-d1-migration-contract.mts
          node scripts/audit-ops-drift.mts --source-only

      - name: Compare read-only live controls
        run: node scripts/audit-ops-drift.mts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # This GET-only job receives only the narrowly scoped read credential.
          # Required Cloudflare account permissions: Workers R2 Storage Read
          # and Workers Scripts Read.
          # Missing configuration must fail closed rather than borrowing the
          # production deployment token.
          CLOUDFLARE_DRIFT_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_DRIFT_AUDIT_TOKEN }}
          # Optional exact zone-route coverage uses a separate least-privilege
          # credential. Optional separate permission: Workers Routes Read.
          # Set both values or neither; a partial setup fails closed.
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WORKERS_ROUTES_READ_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_ROUTES_READ_TOKEN }}
          GITHUB_DRIFT_AUDIT_TOKEN: ${{ secrets.GITHUB_DRIFT_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-drift-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/ops-drift/report.json
          if-no-files-found: warn
          retention-days: 90
