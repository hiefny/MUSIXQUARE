<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:20px 24px;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.swatch{display:flex;align-items:center;gap:10px;}
.dot{width:40px;height:40px;border-radius:50%;}
.meta{font-size:11px;font-weight:700;}
.meta .hx{color:var(--text-sub);font-weight:600;}
</style></head><body><div class="card">
<div class="row">
  <div class="swatch"><div class="dot" style="background:#ffffff"></div><div class="meta">text-main<br><span class="hx">#FFFFFF</span></div></div>
  <div class="swatch"><div class="dot" style="background:#a1a1aa"></div><div class="meta">text-sub<br><span class="hx">#A1A1AA</span></div></div>
  <div class="swatch"><div class="dot" style="background:#71717a"></div><div class="meta">text-muted<br><span class="hx">#71717A</span></div></div>
  <div class="swatch"><div class="dot" style="background:#6B7684"></div><div class="meta">grey-600<br><span class="hx">#6B7684</span></div></div>
  <div class="swatch"><div class="dot" style="background:#8B95A1"></div><div class="meta">grey-500<br><span class="hx">#8B95A1</span></div></div>
</div></div></body></html>
