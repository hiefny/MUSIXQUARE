name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check structural invariants
        run: npm run guard:structure

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build and verify production bundle
        run: npm run build:checked

      - name: Install smoke-test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser-security smoke tests
        run: npm run test:e2e:smoke

      # The serial full suite stays in e2e.yml (scheduled/manual). This fast
      # gate deliberately keeps web security enabled in Chromium and WebKit.
