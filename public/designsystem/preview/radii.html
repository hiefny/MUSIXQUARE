<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font-sans);}
.card{padding:22px 24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.r{background:var(--surface-2);}
.r14{width:72px;height:72px;border-radius:14px;}
.r20{width:72px;height:72px;border-radius:20px;}
.r32{width:72px;height:72px;border-radius:32px;}
.rpill{width:120px;height:40px;border-radius:100px;}
.lab{font-size:10px;font-weight:700;color:var(--text-sub);letter-spacing:0.08em;text-align:center;margin-top:6px;}
.w{display:flex;flex-direction:column;align-items:center;}
</style></head><body><div class="card">
<div class="w"><div class="r r14"></div><div class="lab">14 · radius-s</div></div>
<div class="w"><div class="r r20"></div><div class="lab">20 · radius-m</div></div>
<div class="w"><div class="r r32"></div><div class="lab">32 · radius-l</div></div>
<div class="w"><div class="r rpill"></div><div class="lab">100 · pill</div></div>
</div></body></html>
