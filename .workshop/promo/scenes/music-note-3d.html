<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSIXQUARE – 3D Glass Note</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f8f9fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; }

  .overlay {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
    font-size: 11px; letter-spacing: 0.08em;
    color: #71717a; text-transform: uppercase;
    user-select: none;
    transition: opacity 0.3s ease;
    opacity: 0.75;
  }
  .overlay.hidden { opacity: 0; }
  .overlay kbd {
    display: inline-block;
    min-width: 18px; padding: 3px 6px;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 4px;
    background: rgba(255,255,255,0.8);
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 10px; font-weight: 600;
    color: #52525b;
    text-align: center;
  }
  body.dark .overlay { color: #a1a1aa; }
  body.dark .overlay kbd {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.12);
    color: #d4d4d8;
  }

  .brand {
    position: fixed;
    top: 24px; left: 24px;
    font-size: 10px; letter-spacing: 0.24em;
    color: #a1a1aa;
    text-transform: uppercase;
    font-weight: 700;
    user-select: none;
    transition: opacity 0.3s ease;
  }
  .brand.hidden { opacity: 0; }
  body.dark .brand { color: #71717a; }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="brand">MUSIXQUARE</div>
<div class="overlay">
  <span><kbd>Space</kbd> pause</span>
  <span><kbd>B</kbd> bg</span>
  <span><kbd>R</kbd> reset</span>
  <span><kbd>H</kbd> hide UI</span>
  <span>drag to orbit · scroll to zoom</span>
</div>

<script type="module" src="./music-note-3d.js"></script>
</body>
</html>
