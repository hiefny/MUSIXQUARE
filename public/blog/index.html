  <style>
    .editorial-blog {
      --blog-max: 1240px;
    }

    .editorial-blog .hero {
      grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr);
    }

    .blog-hero-index {
      width: min(560px, 42vw);
      min-height: auto;
      align-self: center;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: stretch;
      gap: 12px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: none;
    }

    .editorial-blog .hero[data-animate] > .blog-hero-index {
      transform: translateY(16px);
    }

    .editorial-blog .hero[data-animate].is-visible > .blog-hero-index {
      transform: translateY(0);
    }

    .blog-hero-index::before {
      display: none;
    }

    .blog-hero-line {
      min-height: clamp(104px, 9vw, 124px);
      padding: 0 clamp(32px, 3.3vw, 42px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 0;
      border-radius: var(--radius-m);
      background: var(--surface-1);
      box-shadow: none;
    }

    .blog-hero-line strong {
      display: block;
      color: var(--text-main);
      font-size: clamp(24px, 3vw, 40px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .blog-page {
      max-width: var(--blog-max);
    }

    .blog-page .section {
      padding-top: 96px;
    }

    #soro-blog {
      min-height: 360px;
    }

    #soro-blog,
    #soro-blog * {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      letter-spacing: 0 !important;
    }

    #soro-blog .soro-blog {
      color: var(--text-main) !important;
    }

    #soro-blog .soro-blog-content {
      width: 100% !important;
      max-width: none !important;
      color: var(--text-main) !important;
    }

    #soro-blog .soro-blog-list {
      display: flex !important;
      flex-direction: column !important;
      gap: 18px !important;
    }

    #soro-blog .soro-blog-card {
      min-height: 164px;
      padding: 18px !important;
      display: grid !important;
      grid-template-columns: 190px minmax(0, 1fr) !important;
      gap: 22px !important;
      align-items: center !important;
      border: 0 !important;
      border-radius: 20px !important;
      background: rgba(255, 255, 255, 0.045) !important;
      box-shadow: none !important;
      color: var(--text-main) !important;
      text-decoration: none !important;
      transition:
        background var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out);
    }

    #soro-blog .soro-blog-card[hidden] {
      display: none !important;
    }

    #soro-blog .soro-blog-card:focus,
    #soro-blog .soro-blog-card:focus-visible {
      outline: 0 !important;
      box-shadow: none !important;
    }

    #soro-blog .soro-blog-card:hover {
      background: rgba(59, 130, 246, 0.09) !important;
      transform: translateY(-1px);
    }

    #soro-blog .soro-blog-card:focus-visible {
      background: rgba(59, 130, 246, 0.09) !important;
      transform: translateY(-1px);
    }

    #soro-blog .soro-blog-card-image {
      width: 190px !important;
      height: 128px !important;
      border-radius: 8px !important;
      object-fit: cover !important;
      background: var(--surface-2) !important;
    }

    #soro-blog .soro-blog-card-content {
      min-width: 0;
    }

    #soro-blog .soro-blog-card-title,
    #soro-blog .soro-blog-article-title {
      color: var(--text-main) !important;
      letter-spacing: 0 !important;
    }

    #soro-blog .soro-blog-card-title {
      margin: 0 0 10px !important;
      font-size: 22px !important;
      line-height: 1.2 !important;
    }

    #soro-blog .soro-blog-card-excerpt {
      margin: 0 0 18px !important;
      color: #c6cbd6 !important;
      font-size: 15px !important;
      line-height: 1.65 !important;
    }

    #soro-blog .soro-blog-card-date,
    #soro-blog .soro-blog-article-date {
      color: #9aa3b2 !important;
    }

    #soro-blog .soro-blog-header {
      margin-bottom: 24px !important;
    }

    #soro-blog .soro-blog-back {
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      color: #c6cbd6 !important;
      border: 0 !important;
      background: transparent !important;
      padding: 0 !important;
      text-decoration: none !important;
    }

    #soro-blog .soro-blog-back-label {
      text-decoration: underline !important;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
    }

    #soro-blog .soro-blog-back:hover {
      color: var(--text-main) !important;
    }

    #soro-blog .soro-blog-article {
      width: 100% !important;
      max-width: none !important;
      color: var(--text-main) !important;
    }

    #soro-blog .soro-blog-article header {
      margin-bottom: 24px !important;
    }

    #soro-blog .soro-blog-article-title {
      margin: 0 0 14px !important;
      font-size: 44px !important;
      line-height: 1.08 !important;
    }

    #soro-blog .soro-blog-article-image {
      width: 100% !important;
      max-height: 440px !important;
      margin: 0 0 34px !important;
      display: block !important;
      aspect-ratio: 16 / 9 !important;
      border-radius: 8px !important;
      object-fit: cover !important;
      background: var(--surface-2) !important;
    }

    #soro-blog .soro-blog-article-content {
      color: #d7dbe4 !important;
      font-size: 18px !important;
      line-height: 1.78 !important;
    }

    #soro-blog .soro-blog-article-content p {
      color: #d7dbe4 !important;
    }

    #soro-blog .soro-blog-article-content h2,
    #soro-blog .soro-blog-article-content h3 {
      color: var(--text-main) !important;
      letter-spacing: 0 !important;
    }

    #soro-blog .soro-blog-article-content h2 {
      margin-top: 42px !important;
      font-size: 30px !important;
      line-height: 1.18 !important;
    }

    #soro-blog .soro-blog-article-content h3 {
      margin-top: 30px !important;
      font-size: 22px !important;
      line-height: 1.25 !important;
    }

    #soro-blog .soro-blog-article-content a {
      color: #86b7ff !important;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #soro-blog .soro-blog-pagination {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    #soro-blog .soro-blog-page-status {
      color: #9aa3b2;
      font-size: 13px;
      font-weight: 700;
    }

    #soro-blog .soro-blog-page-buttons {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    #soro-blog .soro-blog-page-button {
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      color: #d7dbe4;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      transition:
        background var(--dur-fast) var(--ease-out),
        color var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out),
        opacity var(--dur-fast) var(--ease-out);
    }

    #soro-blog .soro-blog-page-button:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.12);
      color: var(--text-main);
    }

    #soro-blog .soro-blog-page-button:focus-visible {
      outline: 2px solid #86b7ff;
      outline-offset: 2px;
    }

    #soro-blog .soro-blog-page-button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    #soro-blog .soro-blog-page-button[aria-current="page"] {
      background: var(--text-main);
      color: #121212;
    }

    #soro-blog .soro-blog-page-button--nav {
      min-width: 28px;
      width: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #d7dbe4;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    #soro-blog .soro-blog-page-icon {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #soro-blog .soro-blog-page-button--nav:hover:not(:disabled) {
      background: transparent;
      color: var(--text-main);
      transform: translateY(-1px);
    }

    #soro-blog .soro-blog-page-ellipsis {
      min-width: 20px;
      color: #71717a;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 1023px) {
      .editorial-blog .hero {
        grid-template-columns: 1fr;
      }

      .blog-hero-index {
        width: min(100%, 640px);
        justify-self: stretch;
      }
    }

    @media (max-width: 720px) {
      .blog-hero-index {
        width: 100%;
        gap: 10px;
      }

      .blog-hero-line {
        min-height: 96px;
        padding: 0 32px;
      }

      .blog-hero-line strong {
        font-size: clamp(20px, 6vw, 26px);
      }

      #soro-blog .soro-blog-card {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
        padding: 14px !important;
      }

      #soro-blog .soro-blog-card-image {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9 !important;
      }

      #soro-blog .soro-blog-article-title {
        font-size: 34px !important;
      }

      #soro-blog .soro-blog-article-content {
        font-size: 16px !important;
      }

      #soro-blog .soro-blog-pagination {
        align-items: stretch;
        flex-direction: column;
      }

      #soro-blog .soro-blog-page-buttons {
        justify-content: center;
      }
    }
  </style>
