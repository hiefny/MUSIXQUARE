name: Full E2E

# The complete Playwright suite is intentionally separate from the production
# release gate. It runs serially because the tests share a signaling server.

on:
  schedule:
    # 03:00 KST every day.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musixquare-full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build E2E bundle
        run: npm run build:e2e

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Full E2E tests
        run: npx playwright test --reporter=line,html

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
