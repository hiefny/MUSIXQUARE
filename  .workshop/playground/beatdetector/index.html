<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Beat Detector</title>
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --light-off: #222;
            --light-on: #f00;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #ui {
            position: absolute;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            background: #111;
            padding: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="range"] { width: 200px; cursor: pointer; }
        #lamp {
            position: absolute;
            top: 140px;
            width: 40px;
            height: 40px;
            background: var(--light-off);
        }
        #lamp.active { background: var(--light-on); }
        #circle {
            width: 100px;
            height: 100px;
            background: var(--fg);
            border-radius: 50%;
            transform: scale(1);
        }
        label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="control-group">
            <label>1. Upload Audio</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>
        <div class="control-group">
            <label>2. Threshold: <span id="threshVal">1.50</span></label>
            <input type="range" id="threshRange" min="1.0" max="3.0" step="0.01" value="1.50">
        </div>
    </div>

    <div id="lamp"></div>
    <div id="circle"></div>

    <script>
        const audioInput = document.getElementById('audioInput');
        const threshRange = document.getElementById('threshRange');
        const threshVal = document.getElementById('threshVal');
        const lamp = document.getElementById('lamp');
        const circle = document.getElementById('circle');

        let audioCtx, analyser, source, dataArray;
        let threshold = 1.5;
        let isLooping = false;

        threshRange.oninput = (e) => {
            threshold = parseFloat(e.target.value);
            threshVal.textContent = threshold.toFixed(2);
        };

        audioInput.onchange = function() {
            if (!this.files.length) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; // 반응성을 위해 작게 설정
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                audioCtx.decodeAudioData(e.target.result, (buffer) => {
                    if (source) source.stop();
                    source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    source.start(0);
                    if (!isLooping) {
                        isLooping = true;
                        update();
                    }
                });
            };
            reader.readAsArrayBuffer(this.files[0]);
        };

        function update() {
            requestAnimationFrame(update);
            analyser.getByteFrequencyData(dataArray);

            // 저음역대 (0~5번 빈) 평균 추출
            let bass = 0;
            for(let i=0; i<5; i++) bass += dataArray[i];
            bass /= 5;

            // 스케일 계산 (기본 1.0 + 저음 강도)
            const scale = 1 + (bass / 255) * 1.5;
            circle.style.transform = `scale(${scale})`;

            // 비트 감지 및 전등 점등
            if (scale > threshold) lamp.classList.add('active');
            else lamp.classList.remove('active');
        }
    </script>
</body>
</html>
