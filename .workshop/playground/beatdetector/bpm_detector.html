<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced BPM Auto-Correlation Engine</title>
    <style>
        :root { --bg: #030303; --hl: #00ffaa; --fg: #666; --panel: rgba(15, 15, 15, 0.98); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; letter-spacing: -0.5px; }
        
        /* BPM 램프 (중앙) */
        #lamp {
            width: 220px; height: 220px; background: #111; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.05s ease-out, box-shadow 0.05s ease-out;
            border: 2px solid #222; margin-bottom: 20px; box-sizing: border-box;
        }
        #lamp.active { background: var(--hl); box-shadow: 0 0 80px var(--hl); border-color: #fff; }
        #bpm-val { font-size: 32px; font-weight: 900; color: #fff; }
        #bpm-label { font-size: 10px; color: #444; margin-top: -5px; }
        #lamp.active #bpm-label { color: #000; }

        /* 컨트롤 패널 */
        #control-panel {
            position: absolute; bottom: 30px; width: 350px; background: var(--panel);
            padding: 20px; border-radius: 12px; border: 1px solid #333;
            display: flex; flex-direction: column; gap: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        
        /* 시커바 */
        #seekbar-container { width: 100%; display: flex; align-items: center; gap: 10px; }
        #seekbar { flex: 1; height: 4px; background: #222; cursor: pointer; position: relative; }
        #seek-progress { absolute: left; height: 100%; background: var(--hl); width: 0%; }
        #time-info { font-size: 9px; color: #666; min-width: 60px; }

        /* 버튼 및 정보 */
        .row { display: flex; align-items: center; justify-content: space-between; }
        #file-btn { border: 1px solid #444; padding: 6px 10px; font-size: 10px; cursor: pointer; color: #aaa; background: transparent; }
        #file-btn:hover { border-color: var(--hl); color: #fff; }
        #status { font-size: 9px; color: #444; text-transform: uppercase; }

        /* 정밀도 그래프 (상관관계 시각화) */
        #debug-canvas { width: 100%; height: 30px; background: #080808; border-top: 1px solid #222; margin-top: 10px; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div id="lamp">
        <div id="bpm-val">--</div>
        <div id="bpm-label">ESTIMATED BPM</div>
    </div>
    
    <div id="status">Engine Ready: Waiting for file...</div>

    <div id="control-panel">
        <div id="seekbar-container">
            <div id="time-info">00:00 / 00:00</div>
            <div id="seekbar">
                <div id="seek-progress"></div>
            </div>
        </div>

        <div class="row">
            <button id="file-btn" onclick="document.getElementById('audioInput').click()">LOAD AUDIO FILE</button>
            <div id="current-file" style="font-size: 9px; color: #444; max-width: 150px; overflow: hidden; text-overflow: ellipsis;">No file loaded</div>
        </div>
        
        <canvas id="debug-canvas"></canvas>
    </div>

    <input type="file" id="audioInput" accept="audio/*">

    <script>
        const audioInput = document.getElementById('audioInput'), lamp = document.getElementById('lamp'), bpmVal = document.getElementById('bpm-val'), seekProgress = document.getElementById('seek-progress'), timeInfo = document.getElementById('time-info'), seekbar = document.getElementById('seekbar'), statusTxt = document.getElementById('status'), debugCanvas = document.getElementById('debug-canvas'), debugCtx = debugCanvas.getContext('2d');
        
        let audioCtx, analyser, lowPass, source, buffer;
        let isLooping = false, startTime = 0, pausedAt = 0, isPaused = false;
        
        // --- BPM 엔진 메모리 ---
        const SAMPLE_RATE = 60; // 초당 60회 샘플링 (60fps 수준)
        const HISTORY_SECONDS = 6; 
        const HISTORY_SIZE = SAMPLE_RATE * HISTORY_SECONDS;
        let energyHistory = new Float32Array(HISTORY_SIZE); 
        let lastEnergy = 0;
        let currentBPM = 0;
        let beatTimer = 0;
        let frameCount = 0;

        audioInput.onchange = function() {
            if(!this.files.length) return;
            const file = this.files[0];
            document.getElementById('current-file').textContent = file.name;
            initAudio(file);
        };

        async function initAudio(file) {
            statusTxt.textContent = "Processing: Decoding Audio...";
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                buffer = await audioCtx.decodeAudioData(e.target.result);
                statusTxt.textContent = "Tracking: Autocorrelation Active";
                playAudio();
            };
            reader.readAsArrayBuffer(file);
        }

        function playAudio() {
            if(source) source.stop();
            source = audioCtx.createBufferSource();
            source.buffer = buffer;
            
            lowPass = audioCtx.createBiquadFilter(); lowPass.type = 'lowpass'; lowPass.frequency.value = 150;
            analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.1;

            source.connect(lowPass); lowPass.connect(analyser); analyser.connect(audioCtx.destination);
            source.start(0);
            startTime = audioCtx.currentTime;
            if(!isLooping) { isLooping = true; update(); }
        }

        // --- 메인 엔진 헬퍼 ---
        function detectOnset(energy) {
            const hpsDelta = Math.max(0, energy - lastEnergy);
            lastEnergy = energy;
            return hpsDelta;
        }

        function calculateBPM() {
            // Auto-correlation (자기상관관계 구하기)
            // 최소 60BPM(1초 간격) ~ 최대 180BPM(0.33초 간격) 범위 탐색
            const minLag = Math.floor(SAMPLE_RATE / (180 / 60)); // 약 20 samples
            const maxLag = Math.floor(SAMPLE_RATE / (60 / 60));  // 60 samples
            
            let bestLag = 0, maxScore = -1;
            let scores = [];

            for (let lag = minLag; lag <= maxLag; lag++) {
                let score = 0;
                for (let i = lag; i < HISTORY_SIZE; i++) {
                    score += energyHistory[i] * energyHistory[i - lag];
                }
                scores.push(score);
                if (score > maxScore) { maxScore = score; bestLag = lag; }
            }

            drawDebug(scores);

            if (bestLag > 0) {
                const bpm = Math.round((60 * SAMPLE_RATE) / bestLag);
                // 템포 안정화 (스무딩)
                if(!currentBPM) currentBPM = bpm;
                currentBPM = currentBPM * 0.98 + bpm * 0.02;
                return Math.round(currentBPM);
            }
            return 0;
        }

        function drawDebug(scores) {
            debugCtx.clearRect(0,0,debugCanvas.width, debugCanvas.height);
            debugCtx.fillStyle = "#111"; debugCtx.fillRect(0,0,debugCanvas.width, debugCanvas.height);
            const max = Math.max(...scores);
            debugCtx.beginPath(); debugCtx.strokeStyle = "#333";
            for(let i=0; i<scores.length; i++) {
                const x = (i / scores.length) * debugCanvas.width;
                const y = debugCanvas.height - (scores[i] / max) * debugCanvas.height;
                if(i===0) debugCtx.moveTo(x,y); else debugCtx.lineTo(x,y);
            }
            debugCtx.stroke();
        }

        function update() {
            requestAnimationFrame(update);
            if(!analyser || !source.buffer) return;

            // 1. 진행도 업데이트
            const elapsed = audioCtx.currentTime - startTime;
            const progress = (elapsed / buffer.duration) * 100;
            seekProgress.style.width = Math.min(100, progress) + "%";
            timeInfo.textContent = formatTime(elapsed) + " / " + formatTime(buffer.duration);

            // 2. 에너지 분석 (Onset Detection)
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let energy = 0;
            for(let i=1; i<5; i++) energy += dataArray[i]; // Lower bins for Kick
            energy /= 4;

            const onsetValue = detectOnset(energy);
            
            // 3. 역사적 에너지 기록
            energyHistory[frameCount % HISTORY_SIZE] = onsetValue;
            frameCount++;

            // 4. 0.5초마다 BPM 재계산
            if(frameCount % 30 === 0) {
                const b = calculateBPM();
                if(b > 0) bpmVal.textContent = b;
            }

            // 5. 비트 동기화 Flash (BPM 주기에 기반한 Phase Tracking)
            if(currentBPM > 0) {
                const beatIntervalInFrames = (60 / currentBPM) * SAMPLE_RATE;
                beatTimer++;
                
                // 에너지가 터질 때(Onset) 타이머를 보정하여 박자에 동기화 (Phase Alignment)
                if(onsetValue > 15 && beatTimer > beatIntervalInFrames * 0.6) {
                    beatTimer = beatIntervalInFrames; // 박자 강제 터뜨림
                }

                if(beatTimer >= beatIntervalInFrames) {
                    lamp.classList.add('active');
                    setTimeout(() => lamp.classList.remove('active'), 100);
                    beatTimer = 0;
                }
            }
        }

        function formatTime(s) {
            const mins = Math.floor(s / 60); const secs = Math.floor(s % 60);
            return (mins<10?'0':'')+mins + ":" + (secs<10?'0':'')+secs;
        }

        // 시커바 클릭 지원
        seekbar.onclick = (e) => {
            if(!buffer) return;
            const r = seekbar.getBoundingClientRect();
            const p = (e.clientX - r.left) / r.width;
            const jumpTo = p * buffer.duration;
            startTime = audioCtx.currentTime - jumpTo;
            source.stop(); playAudioAt(jumpTo);
        };

        function playAudioAt(time) {
            source = audioCtx.createBufferSource(); source.buffer = buffer;
            lowPass = audioCtx.createBiquadFilter(); lowPass.type='lowpass'; lowPass.frequency.value=150;
            source.connect(lowPass); lowPass.connect(analyser); // Reconnect
            source.start(0, time);
        }
    </script>
</body>
</html>
