name = "musixquare-app"
main = "app-worker.js"
compatibility_date = "2026-05-04"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "musixquare.com"
custom_domain = true

[[routes]]
pattern = "www.musixquare.com"
custom_domain = true

[assets]
directory = "../dist"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/*"]

[triggers]
crons = ["0 */6 * * *"]

[[r2_buckets]]
binding = "SORO_IMAGE_BUCKET"
bucket_name = "musixquare-soro-images"

[[kv_namespaces]]
binding = "SORO_RSS_BACKUP"
id = "fd1a24bab0524b5688d168e9bdb6c038"

# Admin dashboard metrics shared with the signaling Worker.
[[d1_databases]]
binding = "MUSIXQUARE_ADMIN_DB"
database_name = "musixquare-admin-metrics"
database_id = "d6cc9ceb-f0b6-40e4-99aa-8f28bec412ed"

[vars]
YOUTUBE_SEARCH_MAX_RESULTS = "10"
YOUTUBE_SAFE_SEARCH = "moderate"
CLOUDFLARE_TURN_TTL = "172800"
# Turnstile remains disabled for a challenge-free UX. Capability minting uses a
# short-lived, IP/scope-bound stateless proof-of-work challenge instead.
MXQR_TURNSTILE_DISABLED = "true"
MXQR_CAPABILITY_POW_DIFFICULTY = "16"
MXQR_CAPABILITY_POW_TTL = "120"
# Optional comma/space-separated exact origins for trusted deploy previews.
# TRUSTED_CORS_ORIGINS = "https://example-preview.pages.dev"
# Required production secrets:
# - MXQR_CAPABILITY_SECRET (at least 32 random bytes)
# Optional; remove MXQR_TURNSTILE_DISABLED to re-enable the Turnstile path.
# - TURNSTILE_SITE_KEY
# - TURNSTILE_SECRET_KEY
# Optional secret separation (defaults to MXQR_CAPABILITY_SECRET):
# - MXQR_REALTIME_SESSION_OWNER_SECRET (at least 32 random bytes)
# - MXQR_RATE_LIMIT_HASH_SECRET (at least 32 random bytes; HMAC-pseudonymizes IPs in D1)
# Local/emergency only:
# - MXQR_ALLOW_UNGUARDED_PAID_APIS = "true"
